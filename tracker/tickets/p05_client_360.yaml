        type: Bug
        reporter: omar.haddad
        summary: "Health score blank in Salesforce for accounts the dashboard scores"
        estimate_hours: 3
        due_day: 18
        priority: High
        components: [Reverse ETL]
        labels: [bug, reverse-etl, merges, level-3]
        description: |
          **Reported by Omar Haddad:**
          > "Tara opened two of her accounts in Salesforce this morning and Health Score is empty, but Client Health 360
          > shows 41 and 67. One of them is the account Dana merged last month."

          **Expected:** every active client's surviving Account carries the current score and risk band.
        acceptance_criteria:
          - "Root cause found, or non-reproduction proven with a test covering merged and re-parented accounts"
          - "A daily check compares Salesforce values with the latest scores and alerts on drift"
          - *fix
        depends_on: [P5.S4.T5, P5.S1.T5]
      - id: P5.S6.T8
        type: Task
        summary: "UAT sign-off from Iris Novak for P5-D1 and P5-D2"
        estimate_hours: 4
        due_day: 20
        priority: Highest
        reporter: iris.novak
        components: [Dashboards, Data Quality]
        labels: [uat, sign-off, reconciliation, level-3]
        description: |
          Nothing goes to Hannah and Omar until Iris Novak (Business Performance Manager) has signed it off. She ties
          your numbers back to the source systems herself, checks every KPI against your metric catalog and the
          dashboard spec, and writes up numbered findings with a verdict.

          For each dashboard: stop the stream, refresh, download the source extract from the Control Center, and put
