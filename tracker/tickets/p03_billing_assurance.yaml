        type: Task
        summary: "Finance marts with frozen month-ends"
        estimate_hours: 4
        due_day: 18
        priority: High
        components: [Modeling]
        labels: [gold, performance, month-end]
        description: |
          Pre-aggregate assurance (monthly), AR (daily and month-end) and P&L (site × month) so every view is fast. Once Alan
          closes a month, that month's numbers must not move.
        acceptance_criteria:
          - "Every visual in the three specs backed by a mart"
          - "Each visual's query runs in under 3 seconds"
          - "Closed months immutable after Alan's close date; mechanism documented"
          - *git
        depends_on: [P3.S4.T6, P3.S5.T5]
      - id: P3.S6.T2
        type: Task
        summary: "Build P3-D1 Revenue Assurance"
        estimate_hours: 5
        due_day: 18
        priority: Highest
        components: [Dashboards]
        labels: [dashboard, brand]
        description: |
          Build the dashboard to the P3-D1 spec and wireframe. Alan needs to go from "this client is under-billed" to the
          billing records and invoice lines that prove it in two clicks.
        acceptance_criteria:
          - "Every P3-D1 KPI and visual present per spec"
          - "Drill-down to evidence lines works"
          - "Brand kit applied; footer shows freshness and links to the currency policy"
          - *git
        depends_on: [P3.S6.T1]
      - id: P3.S6.T3
        type: Task
        summary: "Build P3-D2 AR & Cash"
        estimate_hours: 4
        due_day: 19
        priority: High
        components: [Dashboards]
        labels: [dashboard, brand]
        description: |
          Build the dashboard to the P3-D2 spec. Rebecca's question: who owes us, how late are they, and who is getting worse?
        acceptance_criteria:
          - "Every P3-D2 KPI and visual present per spec"
          - "As-of date selector works for any past month-end"
