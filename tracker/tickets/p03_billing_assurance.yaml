          - *git
        depends_on: [P3.S6.T1, P3.S5.T3]
      - id: P3.S6.T4
        type: Task
        summary: "Build P3-D3 Warehouse P&L vs Budget"
        estimate_hours: 4
        due_day: 19
        priority: High
        components: [Dashboards]
        labels: [dashboard, brand]
        description: |
          Build the dashboard to the P3-D3 spec. Rebecca wants the monthly pack in one place; Luis wants to see his sites
          without seeing anything else of Finance's.
        acceptance_criteria:
          - "Every P3-D3 KPI and visual present per spec"
          - "Budget version selectable; latest version by default"
          - "Brand kit applied"
          - *git
        depends_on: [P3.S6.T1]
      - id: P3.S6.T5
        type: Bug
        reporter: alan.brooks
        summary: "Bug: Revenue Assurance double-counts credit notes"
        estimate_hours: 2
        due_day: 20
        priority: Highest
        components: [Dashboards, Modeling]
        labels: [bug, credit-notes]
        description: |
          **Reported by Alan Brooks:**
          > "Quick one before the readout. Invoiced revenue on Revenue Assurance is lower than AX for a couple of clients that
