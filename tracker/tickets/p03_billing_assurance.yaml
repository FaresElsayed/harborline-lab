          Finance will ask Iris whether the figures tie to AX before they look at anything else.
        acceptance_criteria:
          - "A submission for each dashboard: every page as PNG, CSV exports of the headline visuals and the end tables behind them, data-as-of and sim clock, a copy of the metric catalog, bridge.csv and the matching source extract"
          - "Iris's review report committed under uat/ for every round"
          - "No open Blocker or Major findings; agreed Minors ticketed"
          - "Verdict Signed off (or Signed off with conditions) for P3-D1, P3-D2 and P3-D3"
        depends_on: [P3.S6.T5, P3.S6.T6]
      - id: P3.S6.T8
        type: Task
        summary: "Readout to Rebecca and Alan and release v0.3.0"
        estimate_hours: 2
        due_day: 20
        priority: High
        components: [Documentation]
        labels: [readout, release]
        description: |
          Five minutes, money first: how much leakage, how much overdue, which sites are off budget, and what you'd do next.
          Record it; it's your portfolio demo too. Then tag the release and close the epic.
        acceptance_criteria:
          - "Readout delivered and recording (or script plus screenshots) linked here"
          - "Feedback captured as new tickets"
          - "v0.3.0 tagged on main; CHANGELOG lists every ticket key in the release"
          - "Retro notes (keep / change / try) committed"
        depends_on: [P3.S6.T7]
