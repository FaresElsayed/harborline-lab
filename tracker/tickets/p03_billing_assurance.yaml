# Project 3 - Billing Assurance & AR (program weeks 9-12)
# Requesters: Rebecca Lindqvist (CFO) and Alan Brooks (Controller)
project: 3
epic:
  id: P3
  summary: "Billing Assurance & AR: every dollar from contract to cash, explained"
  department: Finance
  reporter: rebecca.lindqvist
  priority: Highest
  labels: [finance, billing, ar, dashboards]
  description: |
    **Sponsors:** Rebecca Lindqvist (CFO) and Alan Brooks (Controller).

    > "We bill sixty clients across three legal entities and five currencies, and I can't tell you with confidence that
    > we bill each of them what their contract says." (Rebecca)

    Rates are negotiated in Salesforce, keyed by hand into the WMS by billing analysts, accrued daily in the WMS and
    invoiced from AX 2012 at month-end. That's three systems with a person in the middle, and last year's auditors noted
    the manual keying as a control weakness. Meanwhile DSO is drifting, and Rebecca spends the first week of every month
    rebuilding warehouse P&L against budget in Excel.

    **What this project delivers**
    - AX 2012 and the Finance-relevant Salesforce objects in the platform, modeled so Finance trusts them.
    - A currency policy and one shared conversion for USD, CAD, MXN, EUR and GBP.
    - A billing assurance model: contract vs WMS accrual vs AX invoice, with every variance explained.
    - AR aging and DSO as of any date, and warehouse P&L vs budget.
    - Dashboards **P3-D1 Revenue Assurance**, **P3-D2 AR & Cash** and **P3-D3 Warehouse P&L vs Budget**.

    **Why now:** year-end close and the audit are coming. Rebecca wants every leakage quantified before the auditors
    find it, and a DSO number she can take to the board.

    **People:** Alan Brooks owns billing and AR. Priya Raman knows AX inside out. Dana Whitfield runs Salesforce, and
    Hannah Price owns the commercial process (contracts, rate cards, amendments).

    **Success measures**
    - Every difference between contract, accrual and invoice is explained or ticketed, by client, charge code and month.
    - AR aging ties to the AX customer ledger, to the cent, for every legal entity.
    - The monthly P&L pack takes a day, not a week.
    - Release **v0.3.0** tagged with CHANGELOG.

    **Out of scope:** opportunities, cases and the full client master (Project 5); carrier freight bills (Project 4).
  dashboards: [P3-D1, P3-D2, P3-D3]

stories:
  # ---------------------------------------------------------------- S1
  - id: P3.S1
    summary: "AX 2012 ingestion: companies, enums, date-effective addresses and no foreign keys"
    type: Story
    reporter: alan.brooks
    priority: Highest
    story_points: 13
    sprint: 1
    due_day: 5
    components: [Ingestion, Modeling]
    labels: [ax2012, finance, incremental]
    description: |
      **From Alan Brooks, Controller:**
      > "AX is our book of record, and it's old. Priya Raman is the person who knows where the bodies are buried."

      AX 2012 has no foreign keys in the database (relations exist only in the application, through `RECID`), stores enums
      as integers, keeps every company's data in the same tables separated by `DATAAREAID` (`us01`, `ca01`, `mx01`), uses
      1900-01-01 for "no date", and keeps addresses date-effective. Posted documents never change; unposted journals
      change all the time. Times are UTC, unlike the WMS.

      Land the AX tables Finance needs and model them so Alan can trust them: customers (with names and addresses as of
      any date), invoices and lines, the customer ledger with settlements, vendor invoices, the general ledger with
      financial dimensions, and exchange rates.

      **Volume:** most AX tables are small next to the WMS. Vendor invoice lines for carrier freight bills are the
      exception (a line per shipment); Transportation will need them in Project 4.

      **Definition of Done**
      - All sub-tasks done; AX tables in bronze incrementally; silver finance models with tests
      - Invoice totals and the AR balance reconcile to the AX general ledger by entity and month
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "In-scope AX tables land in bronze incrementally, with deletes detected where AX deletes (unposted journal lines, reversed settlements)"
      - "Enum integers decoded to labels, with a cited source for enums missing from srsanalysisenums"
      - "Customer names and addresses available as of any date"
      - "Sentinel dates and AX numeric conventions handled once, consistently"
      - "Silver models for customers, invoices, customer ledger with settlements, vendor invoices and general ledger, per legal entity"
      - "Invoice and AR totals reconcile to the AX general ledger by entity and month"
      - "Every billed client mapped across WMS, AX and Salesforce, or listed with a reason"
    depends_on: [P1.S5]
    tasks:
      - id: P3.S1.T1
        type: Task
        summary: "Map the AX entities Finance needs, with Priya"
        estimate_hours: 3
        due_day: 1
        priority: High
        components: [Ingestion, Documentation]
        labels: [ax2012, stakeholder]
        description: |
          Map which AX tables Finance needs and how they relate: `RECID` references, company vs shared tables, posted
          (immutable) vs editable documents. Priya Raman can explain AX conventions; Alan Brooks can tell you which
          numbers Finance reconciles to today.
        acceptance_criteria:
          - "Entity map (diagram and table) of in-scope AX tables, with relations and company scope"
          - "Each table's change signal, delete behaviour and immutability recorded"
          - "Finance's reconciliation targets listed (the balances your models must tie to)"
          - &docs "Committed via PR (docs/DATA-<n>-… branch, Conventional Commit with the key) and linked from this ticket"
        depends_on: []
      - id: P3.S1.T2
        type: Task
        summary: "Incremental AX ingestion"
        estimate_hours: 6
        due_day: 3
        priority: Highest
        components: [Ingestion]
        labels: [ax2012, incremental, deletes]
        description: |
          Land the in-scope AX tables with the Project 1 ingestion framework. `MODIFIEDDATETIME` is UTC. Unposted journal
          lines (`ledgerjournaltrans`) are edited and deleted freely, reversed settlements (`custsettlement`) are deleted,
          and posted documents don't change.
        acceptance_criteria:
          - "All in-scope tables in bronze with load metadata"
          - "Incremental wherever a change signal exists; otherwise the choice is justified"
          - "Deletes detected for ledgerjournaltrans and custsettlement"
          - "Re-runs idempotent; counts reconciled per table per run"
          - &git "Merged via PR from a feat/DATA-<n>-… branch; Conventional Commits carry the key; PR self-review done; CI green"
        depends_on: [P3.S1.T1]
      - id: P3.S1.T3
        type: Task
        summary: "Decode AX enums"
        estimate_hours: 3
        due_day: 3
        priority: High
        components: [Modeling]
        labels: [ax2012, reference-data]
        description: |
          AX stores enums as integers (`transtype`, `postingtype`, `blocked`, `accounttype` and more). `srsanalysisenums`
          has labels for some of them, but not all. Build one reusable decode for silver. Where an enum is missing, find
          the value meanings from a trustworthy source (Priya Raman, Microsoft's documentation) and record where each came from.
        acceptance_criteria:
          - "Every enum column used in silver decoded to a label"
          - "Values missing from srsanalysisenums seeded with a cited source"
          - "Unknown values raise a DQ warning instead of becoming nulls"
          - *git
        depends_on: [P3.S1.T1]
      - id: P3.S1.T4
        type: Task
        summary: "Customers, names and date-effective addresses"
        estimate_hours: 5
        due_day: 4
        priority: High
        components: [Modeling]
        labels: [ax2012, scd2, date-effective]
        description: |
          `custtable` has no name: the name lives on `dirpartytable` via `party`. Addresses go through `dirpartylocation`,
          `logisticslocation` and `logisticspostaladdress`, which is date-effective (a change closes `validto` and inserts
          a new row; open-ended rows end 2154-12-31). The same client can exist in more than one legal entity. Finance needs
          the customer as it was on the invoice date.
        acceptance_criteria:
          - "Customer dimension per legal entity, with party name and history"
          - "Address as of any date, with no overlaps or gaps (tested)"
          - "The same client across legal entities linked"
          - "As-of join on invoice date demonstrated on a customer whose address changed"
          - *git
        depends_on: [P3.S1.T2]
      - id: P3.S1.T5
        type: Task
        summary: "Handle AX sentinel dates and numeric conventions"
        estimate_hours: 2
        due_day: 4
        priority: Medium
        components: [Modeling, Data Quality]
        labels: [ax2012, conventions]
        description: |
          AX uses 1900-01-01 for an empty date and 2154-12-31 for "forever"; amounts are numeric(32,16); exchange rates are
          stored ×100, with a display factor on the currency pair; general-journal credits are negative. Handle these once,
          consistently, so nobody downstream has to remember them.
        acceptance_criteria:
          - "Sentinel dates become nulls (or a documented equivalent) in silver"
          - "Amounts keep full precision; rounding happens only at presentation"
          - "Conventions documented"
          - "DQ checks catch values that break the conventions"
          - *git
        depends_on: [P3.S1.T2]
      - id: P3.S1.T6
        type: Task
        summary: "Finance silver models"
        estimate_hours: 6
        due_day: 5
        priority: Highest
        components: [Modeling]
        labels: [ax2012, finance, gl]
        description: |
          Model invoices (header and lines; credit notes are invoices with negative amounts), the customer ledger
          (`custtrans`, updated when settled) with settlements, vendor invoices, and the general ledger
          (`generaljournalentry` / `generaljournalaccountentry` with `mainaccount` and the financial-dimension display value,
          such as `4010-ATL1-OPS`). Every amount needs its transaction currency and the entity's accounting currency.
        acceptance_criteria:
          - "Invoice, invoice line, customer transaction, settlement, vendor invoice and GL entry models per legal entity"
          - "Financial dimension split into main account, site and department"
          - "Transaction-currency and accounting-currency amounts carried on every money column"
          - "Free-text invoices (no sales order) handled"
          - *git
        depends_on: [P3.S1.T3, P3.S1.T4, P3.S1.T5]
      - id: P3.S1.T7
        type: Task
        summary: "Reconcile finance models to the AX general ledger"
        estimate_hours: 3
        due_day: 5
        priority: High
        components: [Data Quality]
        labels: [reconciliation, ax2012]
        description: |
          Reconcile your models to the AX general ledger, the book of record: invoice totals by entity and month, the AR
          balance (account 1200) by entity, and revenue by account (4000-4030). Differences must be explained to the cent
          or ticketed.
        acceptance_criteria:
          - "Reconciliation for at least six months per legal entity"
          - "Differences explained or ticketed"
          - "Reconciliation automated as a daily test"
          - *git
        depends_on: [P3.S1.T6]
      - id: P3.S1.T8
        type: Task
        summary: "Billing client mapping across WMS, AX and Salesforce"
        estimate_hours: 3
        due_day: 5
        priority: High
        components: [Modeling, Data Quality]
        labels: [crosswalk, billing]
        description: |
          Billing assurance joins Salesforce rate cards, WMS billing and AX invoices per client. P1.S4.T7 measured how well
          the three systems' client keys line up. Build the mapping Finance needs now: each billed client's WMS owner, its
          AX customer account in each legal entity, and its Salesforce Account, with manual overrides Alan approves.

          Client Success builds the enterprise client master in Project 5. Keep this simple and easy to replace.
        acceptance_criteria:
          - "Every client invoiced in the last 12 months mapped across the three systems, or listed as unmapped with a reason"
          - "Overrides stored as data, with who approved them and when"
          - "Mapping coverage reported daily in the DQ results table"
          - *git
        depends_on: [P1.S4.T7, P3.S1.T4]

  # ---------------------------------------------------------------- S2
  - id: P3.S2
    summary: "Salesforce API ingestion: contracts and rate cards"
    type: Story
    reporter: alan.brooks
    priority: Highest
    story_points: 13
    sprint: 1
    due_day: 9
    components: [Ingestion, Modeling]
    labels: [salesforce, api, oauth, deletes, contracts]
    description: |
      The contract is the truth about what a client should pay, and contracts live in Salesforce: `Contract`, plus the
      custom `Rate_Card__c` and `Rate_Card_Line__c` objects (one rate card per contract version, one line per charge
      code). Finance also needs `Account` and `Product2`. Opportunities, cases and the rest come in Project 5.

      Dana Whitfield administers the org. Her rules: use the integration user's connected app (OAuth client
      credentials), and stay inside the data team's budget of **5,000 API calls a day**. The org's 15,000-call daily
      limit is shared with other integrations.

      **Things to know**
      - REST queries return pages of 2,000 records (`nextRecordsUrl`); Bulk API 2.0 exists for big pulls.
      - Deleted records stay in the recycle bin for **15 days**, and merged accounts leave a `MasterRecordId` trail. Miss
        a fortnight and you've missed deletes.
      - Admins add custom fields without telling anyone.

      **Definition of Done**
      - All sub-tasks done; in-scope objects in bronze incrementally, with deletes and merges handled
      - Rate cards modeled with effective dates in silver
      - API usage per run recorded and inside Dana's budget
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "OAuth client-credentials authentication with secrets from the secret store; expired tokens handled"
      - "Incremental extraction for Account, Contract, Rate_Card__c, Rate_Card_Line__c and Product2"
      - "Deletes and merges reflected downstream; a gap longer than the recycle-bin window is detected and recovered"
      - "Initial backfill uses a bulk method; daily runs stay inside the 5,000-call budget"
      - "New custom fields detected and reported without breaking the pipeline"
      - "Contracts and rate-card lines in silver with effective dates, status, currency and monthly minimums"
    depends_on: [P1.S5]
    tasks:
      - id: P3.S2.T1
        type: Task
        summary: "Connect to Salesforce as the integration user"
        estimate_hours: 3
        due_day: 6
        priority: High
        components: [Ingestion, Security]
        labels: [salesforce, oauth, security]
        description: |
          Authenticate with the connected app's client credentials (from the Control Center's Links page, kept in your
          secret store) and explore the org with the describe and limits endpoints. Confirm with Dana Whitfield how she
          wants the budget split between backfill days and normal days.
        acceptance_criteria:
          - "Token obtained, and re-obtained on expiry or a 401"
          - "Credentials only in the secret store"
          - "Budget split agreed with Dana and recorded"
          - "Describe output for in-scope objects saved for later schema comparison"
          - *git
        depends_on: [P1.S2.T3]
      - id: P3.S2.T2
        type: Task
        summary: "Incremental SOQL extraction with pagination"
        estimate_hours: 6
        due_day: 7
        priority: Highest
        components: [Ingestion]
        labels: [salesforce, incremental, pagination]
        description: |
          Extract the in-scope objects incrementally using a reliable change signal, following `nextRecordsUrl` until the
          result is done. Handle `REQUEST_LIMIT_EXCEEDED` and transient errors gracefully. Datetimes come back like
          `2026-01-05T14:03:22.000+0000`; keep them in UTC.
        acceptance_criteria:
          - "All in-scope objects extracted incrementally with persisted watermarks"
          - "Pagination complete: landed counts match totalSize"
          - "Limit and transient errors retried or failed cleanly, with an alert"
          - "API calls per run recorded"
          - *git
        depends_on: [P3.S2.T1]
      - id: P3.S2.T3
        type: Task
        summary: "Deletes, merges and the 15-day recycle bin"
        estimate_hours: 5
        due_day: 8
        priority: Highest
        components: [Ingestion]
        labels: [salesforce, deletes, merges]
        description: |
          Accounts get merged, rate cards drafted in error get deleted, duplicates get cleaned up. Billing assurance must not
          keep counting deleted records. The recycle bin only remembers 15 days, so design for the day your pipeline was off
          for three weeks.
        acceptance_criteria:
          - "Deleted records flagged with their deletion time in bronze and silver"
          - "Merged accounts mapped to their surviving master record"
          - "A gap longer than 15 days is detected and triggers a full key comparison"
          - "Tested with the simulator's account-merge scenario"
          - *git
        depends_on: [P3.S2.T2]
      - id: P3.S2.T4
        type: Task
        summary: "Initial backfill with Bulk API 2.0"
        estimate_hours: 4
        due_day: 8
        priority: Medium
        components: [Ingestion]
        labels: [salesforce, bulk-api, backfill]
        description: |
          Paging through years of history with REST queries burns the call budget. Use a bulk method for the first load and
          for full key comparisons.
        acceptance_criteria:
          - "Bulk query jobs created, polled and downloaded page by page with locators until done"
          - "Backfill of every in-scope object completed; calls used recorded"
          - "Re-runnable without duplicates"
          - *git
        depends_on: [P3.S2.T2]
      - id: P3.S2.T5
        type: Task
        summary: "Detect Salesforce schema drift"
        estimate_hours: 2
        due_day: 9
        priority: Medium
        components: [Ingestion]
        labels: [salesforce, schema-drift]
        description: |
          Dana's admins add custom fields without warning, and the simulator can too (Control Center → Scenarios →
          schema-drift release). New fields shouldn't break loads, and you should hear about them the same day.
        acceptance_criteria:
          - "Describe output compared with the last known schema on every run"
          - "New fields landed (or deliberately ignored) and reported"
          - "Removed or retyped fields fail loudly with a clear message"
          - *git
        depends_on: [P3.S2.T2]
      - id: P3.S2.T6
        type: Task
        summary: "Contracts and rate cards in silver"
        estimate_hours: 4
        due_day: 9
        priority: Highest
        components: [Modeling]
        labels: [salesforce, contracts, rate-cards, scd2]
        description: |
          Model contracts and rate cards so Finance can ask what rate applied to client X for charge code Y on date Z. Rate
          cards have effective and end dates and a status (Draft, Active, Superseded, Expired), and only some of them should
          count. Ask Hannah Price how amendments and annual increases are recorded, and Alan Brooks which status Finance
          considers binding.
        acceptance_criteria:
          - "Effective-dated rates per client, charge code and currency"
          - "Status rules agreed with Hannah and Alan and documented"
          - "Overlapping or gapped rate periods flagged by DQ"
          - "Monthly minimum available per contract version"
          - *git
        depends_on: [P3.S2.T3]
      - id: P3.S2.T7
        type: Task
        summary: "Monitor Salesforce API usage"
        estimate_hours: 2
        due_day: 9
        priority: Medium
        components: [Orchestration]
        labels: [salesforce, observability, api-limits]
        description: |
          Other integrations share the org's daily limit, and Dana will notice before you do if the data team overspends.
          Track your usage from the response headers or the limits endpoint and alert before it becomes a problem.
        acceptance_criteria:
          - "API calls recorded per run and per day"
          - "Alert at a threshold agreed with Dana"
          - "Usage visible on P1-D1"
          - *git
        depends_on: [P3.S2.T2]

  # ---------------------------------------------------------------- S3
  - id: P3.S3
    summary: "FX and currency conversion: ECB reference rates vs AX month-end rates"
    type: Story
    reporter: alan.brooks
    priority: High
    story_points: 8
    sprint: 1
    due_day: 10
    components: [Ingestion, Modeling]
    labels: [fx, currency, public-api, ax2012]
    description: |
      Harborline invoices in USD, CAD, MXN, EUR and GBP across three legal entities whose books are in USD, CAD and MXN,
      and the board pack is in USD. Every number in this project needs a currency policy, and right now the policy lives
      in Alan's head.

      **Rates available**
      - **AX**: month-end accounting rates keyed by Finance (`exchangerate`, stored ×100 per currency pair, with
        `validfrom` and `validto`).
      - **Frankfurter API**: free daily ECB reference rates, published on working days only.

      **Ask:** agree with Alan which rate is used for what (invoice translation, P&L translation, budget comparison), make
      conversion consistent everywhere, and show where Harborline's booked rates differ from the market.

      **Definition of Done**
      - All sub-tasks done; daily ECB rates and AX rates in silver with full history
      - Currency policy documented and signed off by Alan
      - One shared conversion used by every finance model, with tests
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Daily ECB rates for all five currencies for the full history plus daily increments; non-publication days handled per a documented rule"
      - "AX accounting rates decoded (×100, display factor, validity periods) into a daily rate table"
      - "Currency policy (which rate for which purpose) signed off by Alan Brooks"
      - "A single conversion used by every finance model, tested for cross rates and rounding"
      - "Differences between AX and ECB rates visible by currency and month"
    depends_on: [P3.S1]
    tasks:
      - id: P3.S3.T1
        type: Task
        summary: "Daily ECB reference rates from Frankfurter"
        estimate_hours: 3
        due_day: 6
        priority: High
        components: [Ingestion]
        labels: [fx, public-api]
        description: |
          Load daily reference rates for USD, CAD, MXN, EUR and GBP for the full history and keep them current. The ECB
          doesn't publish at weekends or on its holidays, and publishes once a day. Decide, and write down, which rate a
          Sunday transaction gets.
        acceptance_criteria:
          - "Daily rates for the full history plus daily increments"
          - "Non-publication days handled per the documented rule"
          - "Cross rates derivable for every currency pair; base-currency handling documented"
          - *git
        depends_on: [P1.S5.T1]
      - id: P3.S3.T2
        type: Task
        summary: "AX exchange rates as a daily rate table"
        estimate_hours: 3
        due_day: 7
        priority: High
        components: [Modeling]
        labels: [fx, ax2012]
        description: |
          AX keeps month-end accounting rates in `exchangerate` (stored ×100), linked to `exchangeratecurrencypair` (which
          has a display factor) and `exchangeratetype`. Turn them into a rate you can look up for any date and pair, in the
          same shape as the ECB table.
        acceptance_criteria:
          - "Daily AX rate per currency pair and rate type for the full history"
          - "×100 storage and display factor handled and tested against a value you can verify by hand"
          - "Gaps or overlaps in validity periods flagged by DQ"
          - *git
        depends_on: [P3.S1.T5]
      - id: P3.S3.T3
        type: Task
        summary: "Agree the currency policy with Alan"
        estimate_hours: 3
        due_day: 8
        priority: Highest
        components: [Documentation]
        labels: [fx, policy, stakeholder]
        description: |
          Ask Alan Brooks which rate Finance uses for what: invoices in billing currency translated to entity currency, entity
          P&L translated to USD for the board, budget comparisons (at budget rates or actual?), and how realized FX on
          settlement is booked. Write the policy down with examples, and get his sign-off.
        acceptance_criteria:
          - "Policy per purpose (transaction, entity, reporting, budget) with worked examples"
          - "Alan's sign-off recorded"
          - "Open questions he couldn't answer listed, with who owns them"
          - *docs
        depends_on: [P3.S3.T1, P3.S3.T2]
      - id: P3.S3.T4
        type: Task
        summary: "One shared currency conversion"
        estimate_hours: 4
        due_day: 10
        priority: Highest
        components: [Modeling]
        labels: [fx, reusable]
        description: |
          Every finance model in this project and later ones converts money the same way, per the policy. Build it once,
          test it once, reuse it everywhere.
        acceptance_criteria:
          - "One reusable conversion used by every finance model (checked by search, not by promise)"
          - "Tests cover a direct rate, a cross rate, a missing-rate date and rounding"
          - "Converted amounts carry which rate and rate date were used"
          - *git
        depends_on: [P3.S3.T3]
      - id: P3.S3.T5
        type: Task
        summary: "AX vs ECB rate comparison"
        estimate_hours: 3
        due_day: 10
        priority: Medium
        components: [Modeling]
        labels: [fx, analysis]
        description: |
          Rebecca wants to know how far Harborline's booked rates are from the market, and what that is worth. Compare AX
          rates with ECB rates by currency and month, and size the effect on revenue booked in foreign currencies.
        acceptance_criteria:
          - "Difference (%) by currency pair and month"
          - "Revenue impact in USD by currency and month"
          - "Available for P3-D1"
          - *git
        depends_on: [P3.S3.T4]
      - id: P3.S3.T6
        type: Task
        summary: "Currency data-quality checks"
        estimate_hours: 2
        due_day: 10
        priority: Medium
        components: [Data Quality]
        labels: [fx, dq]
        description: |
          Invalid currency codes, missing rates and implausible jumps quietly corrupt every converted number. Catch them.
        acceptance_criteria:
          - "Invalid or unexpected currency codes on WMS, AX and Salesforce money columns flagged"
          - "Missing rates for any date and pair in use flagged"
          - "Day-over-day jumps beyond a documented threshold flagged"
          - *git
        depends_on: [P3.S3.T2]

  # ---------------------------------------------------------------- S4
  - id: P3.S4
    summary: "Billing assurance model: contract vs WMS accrual vs AX invoice"
    type: Story
    reporter: alan.brooks
    priority: Highest
    story_points: 13
    sprint: 2
    due_day: 15
    components: [Modeling, Data Quality]
    labels: [billing, assurance, scd2, finance]
    description: |
      **From Alan Brooks, Controller:**
      > "Any break between the contract and the invoice is either lost revenue or an angry client."

      How a dollar flows today: Sales negotiates a rate card in Salesforce → a billing analyst keys the rates into the WMS
      `billing_rate` table → the WMS accrues `billing_record` rows daily as work happens → at month-end the accruals go
      to AX and become invoice lines (`custinvoicetrans.itemid` is the charge code).

      Alan wants, per client, charge code and month: what Harborline **should** have billed under the contract, what the
      WMS **accrued**, and what AX **invoiced**, with every difference explained.

      **What makes it hard**
      - WMS `billing_rate` is overwritten in place, with no history. Your snapshots are the only history there will ever
        be; before them you'll have to infer it.
      - Salesforce rate cards are versioned (annual increases on contract anniversaries), and amendments can land mid-month.
      - Clients are billed in their own currency.
      - Monthly minimums: if a client's activity is below the contracted minimum, they owe the difference.

      **Definition of Done**
      - All sub-tasks done; billing assurance fact with expected, accrued and invoiced amounts and variance reasons, tested
      - Results walked through with Alan on three clients he picks
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Type-2 rate history for WMS billing_rate from your snapshots; inferred history before them clearly labelled"
      - "Expected billing computed from activity × the contract rate in effect on the activity date"
      - "Per client, charge code, warehouse and month: expected, accrued and invoiced in billing currency and USD"
      - "Every variance categorized (rate mismatch, missing charge, unbilled minimum, accrued not invoiced, invoiced without accrual, FX or rounding)"
      - "Materiality threshold agreed with Alan; immaterial variances grouped, not hidden"
      - "Walkthrough with Alan on three clients recorded"
    depends_on: [P3.S1, P3.S2, P3.S3]
    tasks:
      - id: P3.S4.T1
        type: Task
        summary: "Walk the billing process with Alan"
        estimate_hours: 2
        due_day: 11
        priority: High
        components: [Documentation]
        labels: [stakeholder, billing]
        description: |
          Before modeling, ask Alan Brooks to walk you through a month: who keys rates and when, how accruals become invoices,
          what gets corrected before invoicing, how credit notes are issued, and what he checks today. Ask Hannah Price how
          contract amendments reach Salesforce.
        acceptance_criteria:
          - "Process diagram from contract to cash, with an owner at each step"
          - "Manual steps and existing controls listed"
          - "Alan's current checks listed; your model must cover each one"
          - *docs
        depends_on: [P3.S2.T6]
      - id: P3.S4.T2
        type: Task
        summary: "Type-2 history for WMS billing_rate"
        estimate_hours: 5
        due_day: 12
        priority: Highest
        components: [Modeling]
        labels: [scd2, wms, billing]
        description: |
          `billing_rate` is updated in place. From your first Project 1 snapshot onwards you can build true history; before
          that, the rate actually charged is recorded on each `billing_record`. Build a rate history that is honest about
          which periods are observed and which are inferred.
        acceptance_criteria:
          - "Type-2 table with valid-from and valid-to per owner, warehouse, charge code and currency"
          - "Observed and inferred periods flagged"
          - "Several changes on the same day handled"
          - "Checked against billing_record rates for sampled months"
          - *git
        depends_on: [P3.S4.T1]
      - id: P3.S4.T3
        type: Task
        summary: "Line up contract, WMS and AX billing keys"
        estimate_hours: 3
        due_day: 12
        priority: High
        components: [Modeling]
        labels: [crosswalk, billing]
        description: |
          Salesforce rate-card lines are per Account and charge code; WMS rates are per owner, optional warehouse and charge
          code; AX invoice lines are per AX customer and item. Line them up using the billing client mapping (P3.S1.T8) and
          the charge codes, and surface anything that doesn't line up.
        acceptance_criteria:
          - "Every active WMS rate mapped to a contract rate-card line, or listed as unmapped"
          - "Charge codes compared across the three systems"
          - "UOM and currency mismatches flagged"
          - *git
        depends_on: [P3.S1.T8, P3.S2.T6]
      - id: P3.S4.T4
        type: Task
        summary: "Billing assurance fact"
        estimate_hours: 8
        due_day: 13
        priority: Highest
        components: [Modeling]
        labels: [billing, assurance]
        description: |
          Build the fact Finance will live in: client × charge code × warehouse × month, with expected (activity × contract
          rate on the activity date), accrued (WMS `billing_record`) and invoiced (AX) amounts, plus variance amounts and
          reasons. Handle voided and re-rated accruals, credit notes and late invoices.
        acceptance_criteria:
          - "Expected, accrued and invoiced amounts in billing currency and USD, per the currency policy"
          - "Variance reason categories as agreed with Alan"
          - "Drill-down from a month to individual billing records and invoice lines"
          - "Invoiced totals reconcile to AX invoiced revenue by entity and month"
          - *git
        depends_on: [P3.S4.T2, P3.S4.T3, P3.S3.T4]
      - id: P3.S4.T5
        type: Task
        summary: "Monthly minimum check"
        estimate_hours: 3
        due_day: 14
        priority: High
        components: [Modeling]
        labels: [billing, minimums]
        description: |
          Contracts include a monthly minimum. When a client's billable activity in a month is below it, a minimum adjustment
          (`MIN-ADJ`) should be invoiced. Check every client-month. Ask Alan how partial months (onboarding, offboarding)
          are treated.
        acceptance_criteria:
          - "Contracted minimum per client-month from the rate-card version in effect"
          - "Billable activity vs minimum compared per month"
          - "Expected vs invoiced minimum adjustments, with the variance"
          - "Alan's partial-month rule documented and applied"
          - *git
        depends_on: [P3.S4.T4]
      - id: P3.S4.T6
        type: Task
        summary: "Quantify leakage and agree materiality"
        estimate_hours: 3
        due_day: 14
        priority: High
        components: [Modeling]
        labels: [billing, assurance]
        description: |
          Rebecca will ask one question: how much? Roll variances up to client, charge code, entity and month in billing
          currency and USD, and agree a materiality threshold with Alan so the dashboard focuses on what matters.
        acceptance_criteria:
          - "Leakage totals by client, charge code, entity and month, with trend"
          - "Materiality threshold documented with Alan's approval"
          - "Over-billing reported as prominently as under-billing"
          - *git
        depends_on: [P3.S4.T4]
      - id: P3.S4.T7
        type: Bug
        reporter: alan.brooks
        summary: "Bug: assurance shows every EUR- and GBP-billed client as under-billed"
        estimate_hours: 3
        due_day: 15
        priority: Highest
        components: [Modeling]
        labels: [bug, fx]
        description: |
          **Reported by Alan Brooks:**
          > "I opened the draft assurance numbers. Every single EUR client is under-billed, by small amounts, every month,
          > consistently. GBP looks the same. That isn't a pricing problem; it smells like currency. Please check before
          > Rebecca sees it."

          Find the cause, fix it, and add a test so it can't come back. If your numbers are already right, explain to Alan
          why the EUR and GBP variances look the way they do.
        acceptance_criteria:
          - "Root cause explained to Alan in plain language"
          - "Currency conversion applied per the policy in all three measures (expected, accrued, invoiced)"
          - "Tests with a known EUR and a known GBP example"
          - "Affected months recomputed"
          - &fix "Fix merged via PR from a fix/DATA-<n>-… branch with a regression test; Conventional Commits carry the key; CI green"
        depends_on: [P3.S4.T4]
      - id: P3.S4.T8
        type: Task
        summary: "Walk three clients through with Alan"
        estimate_hours: 2
        due_day: 15
        priority: Medium
        components: [Documentation]
        labels: [stakeholder, validation]
        description: |
          Ask Alan to pick three clients he knows well: a big one, a multi-currency one, and one he's suspicious of. Walk him
          through their numbers from contract to invoice. His confidence is the acceptance test.
        acceptance_criteria:
          - "Three client walkthroughs recorded with Alan's comments"
          - "Issues found are fixed or ticketed"
          - *docs
        depends_on: [P3.S4.T5, P3.S4.T6]

  # ---------------------------------------------------------------- S5
  - id: P3.S5
    summary: "AR aging, DSO and budget vs actual"
    type: Story
    reporter: rebecca.lindqvist
    priority: High
    story_points: 13
    sprint: 2
    due_day: 17
    components: [Modeling, Ingestion]
    labels: [ar, dso, budget, ax2012, files]
    description: |
      > "Two things go to the board every month: how much cash is tied up in receivables and who's slow, and how each
      > warehouse did against budget. Both are built by hand today." (Rebecca)

      **AR:** open receivables as of any date, aged by due date, per entity and client, with DSO. AX updates invoice
      transactions in place when they're settled and deletes reversed settlements, so "as of last month" has to be
      reconstructed, not looked up. Rebecca will tell you how she wants DSO calculated; the board has seen one method for
      years and she doesn't want it to change without a reason.

      **Budget:** Finance's budget is an Excel workbook in `landing/files/`: wide (months across), merged headers, built
      for humans, and re-issued when Finance reforecasts. Actuals come from the AX general ledger with the site financial
      dimension.

      **Talk to:** Rebecca (DSO method), Alan Brooks (aging rules, which GL accounts roll into which P&L lines), Priya Raman
      (AX settlement mechanics).

      **Definition of Done**
      - All sub-tasks done; the AR as-of model reconciles to the AX customer ledger at three month-ends per entity
      - DSO method documented and signed off by Rebecca
      - Budget versions loaded; P&L actual vs budget by site and month ties to the GL
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Open AR as of any date per entity, client and currency, reconstructed from transactions and settlements"
      - "Aging buckets by days past due as agreed with Alan, in transaction currency and USD"
      - "DSO calculated with the method Rebecca specifies, by entity and client, monthly"
      - "Every budget workbook version ingested into a long format (site × GL account × month × version), latest version flagged"
      - "Warehouse P&L actuals from the GL by site and P&L line vs budget, with variance in USD and %"
      - "AR as-of reconciles to AX at three month-ends per entity"
    depends_on: [P3.S1, P3.S3]
    tasks:
      - id: P3.S5.T1
        type: Task
        summary: "Open AR as of any date"
        estimate_hours: 6
        due_day: 15
        priority: Highest
        components: [Modeling]
        labels: [ar, ax2012, point-in-time]
        description: |
          Reconstruct what was open on any date from `custtrans` and `custsettlement`. Invoice rows are updated when settled,
          settlements can be reversed (and are then deleted), and payments can be partial or cover several invoices. Priya
          Raman can explain the settlement mechanics.
        acceptance_criteria:
          - "Open amount per invoice as of any date"
          - "Partial, multi-invoice and reversed settlements handled"
          - "As-of balances reconcile to AX at three month-ends per entity"
          - "Month-end snapshots stored for fast history"
          - *git
        depends_on: [P3.S1.T6]
      - id: P3.S5.T2
        type: Task
        summary: "Aging buckets"
        estimate_hours: 3
        due_day: 16
        priority: High
        components: [Modeling]
        labels: [ar, aging]
        description: |
          Age open items by days past due into the buckets Finance uses. Ask Alan Brooks for the buckets, and whether credit
          notes and unapplied payments are aged or netted.
        acceptance_criteria:
          - "Buckets as specified by Alan"
          - "Credit notes and unapplied cash treated per his rule"
          - "Aging per entity, client and currency, in transaction currency and USD"
          - *git
        depends_on: [P3.S5.T1, P3.S3.T4]
      - id: P3.S5.T3
        type: Task
        summary: "DSO the way the board sees it"
        estimate_hours: 3
        due_day: 16
        priority: High
        components: [Modeling, Documentation]
        labels: [ar, kpi, stakeholder]
        description: |
          Rebecca's words: "DSO the way the board sees it." There's more than one way to compute DSO, and the methods tell
          different stories for a client whose sales are changing. Find out exactly which method Rebecca means and why, and
          how Alan computes it today. Implement it, and show the alternative side by side if they disagree.
        acceptance_criteria:
          - "DSO method documented in Rebecca's words, with a worked example"
          - "Monthly DSO by entity and client"
          - "Alternative method shown and clearly labelled if Rebecca and Alan differ"
          - "Rebecca's sign-off recorded"
          - *git
        depends_on: [P3.S5.T1]
      - id: P3.S5.T4
        type: Task
        summary: "Ingest the budget workbook"
        estimate_hours: 5
        due_day: 16
        priority: High
        components: [Ingestion]
        labels: [files, xlsx, budget]
        description: |
          Finance's budget workbook arrives in `landing/files/`: wide format, merged header cells, formatting meant for
          people, and new versions after each reforecast. Turn it into something you can join to actuals without losing
          which version said what.
        acceptance_criteria:
          - "Every version ingested with file metadata and a version label"
          - "Long format: site or entity × GL account × month × version"
          - "Totals reconciled to the workbook's own totals; subtotal and note rows excluded"
          - "Layout changes fail loudly"
          - *git
        depends_on: [P1.S5.T1]
      - id: P3.S5.T5
        type: Task
        summary: "Warehouse P&L actual vs budget"
        estimate_hours: 5
        due_day: 17
        priority: High
        components: [Modeling]
        labels: [pnl, budget, gl]
        description: |
          Build the monthly P&L by site from the AX general ledger (the site comes from the financial dimension) and compare
          it with the latest budget version. Alan Brooks decides which accounts roll into which P&L lines and how shared costs
          are treated. Translate to USD per the currency policy.
        acceptance_criteria:
          - "P&L by site, P&L line and month in USD, with entity-currency detail"
          - "Budget vs actual variance in USD and %, by budget version"
          - "Ties to GL totals per entity and month"
          - "Account mapping documented and approved by Alan"
          - *git
        depends_on: [P3.S5.T4, P3.S1.T6, P3.S3.T4]
      - id: P3.S5.T6
        type: Bug
        reporter: alan.brooks
        summary: "Bug: ca01 AR aging total doesn't match the AX customer balance"
        estimate_hours: 3
        due_day: 17
        priority: High
        components: [Modeling]
        labels: [bug, ar, ax2012]
        description: |
          **Reported by Alan Brooks:**
          > "us01 ties out to the penny. ca01 doesn't: the aging total is off from the AX customer balance at month-end, and
          > the difference isn't a round number. I haven't checked mx01 yet."

          Find the cause and fix it. Then check mx01 before Alan does.
        acceptance_criteria:
          - "Root cause identified and explained"
          - "ca01 and mx01 aging reconcile to the AX customer ledger at the last three month-ends"
          - "Reconciliation test added per legal entity"
          - *fix
        depends_on: [P3.S5.T2]

  # ---------------------------------------------------------------- S6
  - id: P3.S6
    summary: "Finance dashboards: Revenue Assurance, AR & Cash, Warehouse P&L vs Budget"
    type: Story
    reporter: rebecca.lindqvist
    priority: Highest
    story_points: 8
    sprint: 2
    due_day: 20
    components: [Dashboards]
    labels: [dashboard, finance]
    attachments: [wireframes/P3-D1.svg, wireframes/P3-D2.svg, wireframes/P3-D3.svg]
    description: |
      Three dashboards for Finance; specs are in the dashboard catalog and wireframes are attached.

      - **P3-D1 Revenue Assurance**: contract vs accrued vs invoiced, and leakage by client and charge code. Owner: Alan Brooks.
      - **P3-D2 AR & Cash**: aging, DSO, and who's slow and getting slower. Owner: Rebecca.
      - **P3-D3 Warehouse P&L vs Budget**: monthly by site, with room for variance commentary. Owner: Rebecca; Luis Moreno
        and the GMs see their own sites.

      **Non-negotiables:** financial data is restricted. Finance and the CEO see everything; Luis and the GMs see only their
      own sites' P&L and nothing else. Numbers tie to AX. Under 3 seconds per view on the free-tier warehouse. The Harborline brand kit with the Finance
      accent. Refreshed daily by 07:00 ET, with month-end numbers frozen once Alan closes the month.

      **Readout:** 5 minutes with Rebecca and Alan. Lead with the money.

      **Definition of Done**
      - All sub-tasks done; three dashboards in prod with access rules tested by role
      - Every headline number ties to AX, with the evidence in the PR
      - Release **v0.3.0** tagged on `main` with CHANGELOG; readout recorded
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "KPI definitions match the P3-D1, P3-D2 and P3-D3 specs and the documented currency and DSO policies"
      - "Filters for month, entity, client, charge code, site and currency view (billing currency or USD) as each spec lists"
      - "Refreshed daily by 07:00 ET; closed months frozen after month-end close; freshness shown in the footer"
      - "Access: Finance (Rebecca, Alan, Priya) and the CEO see everything; Operations see only P3-D3 for their own sites; tested by role"
      - "Every view loads in under 3 seconds (measured)"
      - "Harborline brand kit applied: logo, Finance accent, background template, palette, currency formats"
      - "5-minute readout to Rebecca Lindqvist and Alan Brooks delivered and recorded"
      - "Iris Novak's UAT sign-off recorded for P3-D1, P3-D2 and P3-D3 before the readout"
    depends_on: [P3.S4, P3.S5]
    tasks:
