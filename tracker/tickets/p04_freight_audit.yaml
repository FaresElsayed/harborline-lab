        summary: "Package tracking model linked to WMS shipments"
        estimate_hours: 6
        due_day: 6
        priority: Highest
        components: [Modeling]
        labels: [carrier-api, shipments, tracking]
        description: |
          One row per package with its key milestones (label created, first carrier scan, out for delivery, delivered,
          exceptions) in UTC, plus the local date that matters for on-time (agree which with Beth), linked to the WMS
          shipment and carton. A label reprint gives a package a new tracking number; the link must survive it.
        acceptance_criteria:
          - "Package-level model with milestone timestamps and latest status"
          - "Linked to the WMS shipment and carton through the full tracking-number history (P2.S2.T4)"
          - "Unmatched tracking numbers listed with reasons"
          - "Match rate per carrier recorded"
          - *git
        depends_on: [P4.S1.T4, P4.S1.T5, P2.S2.T4]
      - id: P4.S1.T7
        type: Task
        summary: "Tracking-event data-quality checks"
        estimate_hours: 2
        due_day: 6
        priority: Medium
        components: [Data Quality]
        labels: [carrier-api, dq]
        description: |
          Some tracking problems are data problems; some are lost packages. Flag both, so Beth can tell them apart.
        acceptance_criteria:
          - "Unknown status or exception codes flagged"
          - "Events for tracking numbers Harborline never shipped flagged"
          - "Events dated before the ship time or in the future flagged"
          - "Packages with no carrier scan an agreed number of days after shipping listed"
          - *git
        depends_on: [P4.S1.T4]

  # ---------------------------------------------------------------- S2
  - id: P4.S2
    summary: "EDI 940/945 parsing: X12 envelopes, control numbers and duplicates"
    type: Story
    reporter: beth.kowalczyk
    priority: High
    story_points: 8
    sprint: 1
    due_day: 9
    components: [Ingestion, Data Quality]
    labels: [edi, x12, files, duplicates]
    description: |
      Harborline's B2B clients (mostly auto parts and general merchandise) send orders as EDI **940** warehouse shipping
      orders, and Harborline sends back **945** warehouse shipping advices when they ship. The 945 is the record of what
      Harborline told the client it shipped, with the BOL and PRO numbers and the carrier. When a client disputes a shipment
      or a freight charge, the 945 is the evidence. Tomás Ortega runs the EDI translator and the `landing/edi/` folders.

      **What to expect (X12 004010)**
      - Envelopes (ISA, GS, ST) with control numbers and counts that must agree.
      - Resent files and duplicate interchanges.
      - The occasional malformed transaction set, such as a wrong segment count.
      - Client PO numbers that should match WMS `client_order_ref`.

      **Definition of Done**
      - All sub-tasks done; 940s and 945s parsed into structured tables with envelope validation, deduplication and quarantine
      - 945s matched to WMS shipments and 940s to WMS orders, with match rates reported
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Every document in landing/edi, loose files and the monthly history archives alike, is parsed or quarantined with a reason; none is silently skipped"
      - "Envelope validation: delimiters read from ISA; control numbers and counts checked at interchange, group and transaction-set level"
      - "Duplicate interchanges and resends loaded once, with resends recorded"
      - "940 orders and 945 shipments in silver at header and line level"
      - "945s matched to WMS shipments and 940s to WMS orders, with match rates per trading partner"
    depends_on: [P1.S5]
    tasks:
      - id: P4.S2.T1
        type: Task
        summary: "EDI walkthrough with Tomás"
        estimate_hours: 2
        due_day: 6
        priority: Medium
        components: [Documentation]
        labels: [edi, stakeholder]
        description: |
          Ask Tomás Ortega which trading partners send what, how files are named and moved, what the 997 acknowledgements
          mean, and what happens when a file is resent. Then look at real files in `landing/edi/`.
        acceptance_criteria:
          - "Trading partners and document types listed"
          - "File lifecycle (arrival, processing, archive) documented"
          - "Known quirks recorded"
          - *docs
        depends_on: []
      - id: P4.S2.T2
        type: Spike
        summary: "Spike: parse X12 with a library or write your own"
        estimate_hours: 2
        due_day: 6
        priority: Medium
        components: [Ingestion, Documentation]
        labels: [edi, spike, adr]
        description: |
          Time-box: 2 hours. Try at least one open-source X12 library against real files from `landing/edi/` (including a
          broken one), and compare it with a small parser of your own. Consider maintenance, licence, how failures surface,
          and whether it runs where your pipeline runs.
        acceptance_criteria:
          - "Short ADR with the options tried, the evidence and the decision"
          - "Behaviour on a malformed file shown for each option"
          - *docs
        depends_on: [P4.S2.T1]
      - id: P4.S2.T3
        type: Task
        summary: "Parse X12 envelopes and validate control numbers"
        estimate_hours: 5
        due_day: 7
        priority: Highest
        components: [Ingestion]
        labels: [edi, x12, validation]
        description: |
          Read interchanges, groups and transaction sets with the delimiters taken from the ISA segment, never assumed.
          Validate control numbers and counts at every level, and quarantine what fails.
        acceptance_criteria:
          - "Interchange, group and transaction-set metadata stored per file"
          - "Control numbers and counts validated; failures quarantined with a reason"
          - "Unit tests with good and broken samples"
          - *git
        depends_on: [P4.S2.T2]
      - id: P4.S2.T4
        type: Task
        summary: "940 and 945 documents to structured tables"
        estimate_hours: 6
        due_day: 8
        priority: Highest
        components: [Modeling]
        labels: [edi, x12]
        description: |
          Turn 940 shipping orders and 945 shipping advices into header and line tables: depositor order number, client PO,
          ship-to, requested dates, and lines with quantities, UPC or SKU and lot. For 945s, also the ship date, BOL, PRO,
          carrier SCAC and shipped vs ordered quantities.
        acceptance_criteria:
          - "940 header and line, and 945 header and line, in silver"
          - "Party loops and reference segments handled generically, not by position"
          - "Quantities and units typed"
          - "Sample transactions hand-checked against the raw files"
          - *git
        depends_on: [P4.S2.T3]
      - id: P4.S2.T5
        type: Task
        summary: "Duplicates, resends and control-number gaps"
        estimate_hours: 3
        due_day: 8
        priority: High
        components: [Data Quality]
        labels: [edi, duplicates]
        description: |
          Clients resend files when they aren't sure Harborline got them, and the same order can appear in more than one
          interchange. Load each business document once, keep a trail of resends, and report control-number gaps.
        acceptance_criteria:
          - "Duplicate interchanges and transaction sets loaded once; dedup key documented"
          - "Resend history kept"
          - "Control-number gaps per trading partner reported"
          - *git
        depends_on: [P4.S2.T3]
      - id: P4.S2.T6
        type: Task
        summary: "Match EDI documents to WMS orders and shipments"
        estimate_hours: 4
        due_day: 9
        priority: High
        components: [Modeling, Data Quality]
        labels: [edi, reconciliation]
        description: |
          Each 940 should become a WMS order (client PO ↔ `client_order_ref`), and each 945 should describe a WMS shipment.
          Measure how well they line up and list what doesn't.
        acceptance_criteria:
          - "940 → WMS order and 945 → WMS shipment match rates per trading partner and month"
          - "Unmatched documents listed with reason categories"
          - "Quantity differences between 945 lines and WMS shipment lines flagged"
          - *git
        depends_on: [P4.S2.T4, P4.S2.T5, P2.S2.T4]
      - id: P4.S2.T7
        type: Task
        summary: "EDI processing monitor"
        estimate_hours: 2
        due_day: 9
        priority: Medium
        components: [Orchestration]
        labels: [edi, observability]
        description: |
          Tomás wants to know when a partner goes quiet or the backlog grows. Track files received vs processed per partner
          per day and how long processing takes.
        acceptance_criteria:
          - "Files and transaction sets received, processed and quarantined per partner per day"
          - "Alert when a partner sends nothing for longer than its usual gap, or quarantine grows"
          - "Visible on P1-D1"
          - *git
        depends_on: [P4.S2.T3]

  # ---------------------------------------------------------------- S3
  - id: P4.S3
    summary: "Carrier rate cards and diesel price for fuel surcharge"
    type: Story
    reporter: beth.kowalczyk
    priority: High
    story_points: 8
    sprint: 1
    due_day: 10
    components: [Ingestion, Modeling]
    labels: [rate-cards, xlsx, public-api, fuel]
    description: |
      To audit a bill you need to know what it **should** have cost. Each carrier's negotiated rates are in a workbook in
      `landing/files/`. New versions arrive after renegotiations and general rate increases. Each workbook has base rates
      by service, zone and weight, plus accessorials and the fuel-surcharge table. Parcel carriers bill on the greater of
      actual and dimensional weight.

      Fuel surcharges float weekly with the US Energy Information Administration's diesel price. The EIA has a free API;
      you'll need to register for a key.

      **Talk to:** Beth Kowalczyk (how each carrier's contract works: dimensional divisors, minimums, fuel effective dates)
      and Alan Brooks (how freight is accrued).

      **Definition of Done**
      - All sub-tasks done; rate cards (every version) and weekly diesel prices in silver
      - Expected cost for any historical shipment computable from the rate-card version in effect on its ship date
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Every carrier rate-card version ingested with effective dates, tolerating layout differences between carriers"
      - "Weekly diesel prices for the full history plus weekly increments"
      - "Fuel surcharge % per carrier per week, with the effective-date rule agreed with Beth"
      - "Billable weight per package per carrier rule (actual vs dimensional)"
      - "Expected charge per package (base, fuel and accessorials) from the rate-card version in effect on the ship date"
    depends_on: [P1.S5, P2.S2]
    tasks:
      - id: P4.S3.T1
        type: Task
        summary: "Ingest carrier rate-card workbooks"
        estimate_hours: 6
        due_day: 8
        priority: Highest
        components: [Ingestion]
        labels: [rate-cards, xlsx, scd2]
        description: |
          Each carrier sends rates in its own layout: zones across, weights down, accessorial tables on other sheets, notes in
          merged cells. New versions arrive over time and must not overwrite history.
        acceptance_criteria:
          - "Every carrier and version loaded with file metadata and effective dates"
          - "Long format: carrier × service × zone × weight break → rate"
          - "Accessorial and fuel tables captured"
          - "A layout surprise fails loudly, per carrier"
          - *git
        depends_on: [P1.S5.T1]
      - id: P4.S3.T2
        type: Task
        summary: "Weekly diesel prices from the EIA API"
        estimate_hours: 3
        due_day: 7
        priority: High
        components: [Ingestion]
        labels: [public-api, fuel]
        description: |
          Load the weekly US on-highway diesel price for the full history and keep it current. Register for a free EIA key
          and keep it in the secret store. Publication can slip around holidays, and values are occasionally revised.
        acceptance_criteria:
          - "Weekly diesel price for the full history plus weekly increments"
          - "Key kept in the secret store"
          - "Late and revised publications handled"
          - *git
        depends_on: [P1.S2.T3]
      - id: P4.S3.T3
        type: Task
        summary: "Fuel surcharge % by carrier and week"
        estimate_hours: 3
        due_day: 9
        priority: High
        components: [Modeling]
        labels: [fuel, rate-cards]
        description: |
          Carriers map the diesel price to a fuel-surcharge percentage through a table in their rate card, applied from a
          specific day relative to the price publication. Ask Beth Kowalczyk exactly when each carrier's new percentage
          takes effect.
        acceptance_criteria:
          - "Fuel % per carrier, service type and week"
          - "Effective-date rule per carrier documented with Beth's answer"
          - "Tested on a week where the diesel band changed"
          - *git
        depends_on: [P4.S3.T1, P4.S3.T2]
      - id: P4.S3.T4
        type: Task
        summary: "Billable weight and zones"
        estimate_hours: 4
        due_day: 9
        priority: High
        components: [Modeling]
        labels: [dim-weight, zones]
        description: |
          Parcel carriers bill the greater of actual and dimensional weight (L × W × H divided by a divisor that differs by
          carrier and contract), rounded up by their rules. Zones depend on origin and destination. Agree with Beth where the
          authoritative zone comes from.
        acceptance_criteria:
          - "Billable weight per carton per carrier rule, using canonical units from P1"
          - "Zone per package from the agreed source"
          - "Rules documented per carrier"
          - *git
        depends_on: [P4.S3.T1, P2.S2.T4]
      - id: P4.S3.T5
        type: Task
        summary: "Accessorial catalog per carrier"
        estimate_hours: 3
        due_day: 9
        priority: Medium
        components: [Modeling]
        labels: [accessorials, rate-cards]
        description: |
          Residential delivery, delivery-area surcharges, additional handling, liftgate on LTL: every carrier names and prices
          them differently. Build one catalog that maps each carrier's accessorial codes and descriptions to common types,
          with the conditions under which each applies.
        acceptance_criteria:
          - "Accessorials per carrier mapped to common types"
          - "Conditions of applicability documented (for example residential vs commercial address)"
          - "Unmapped accessorials listed for Beth"
          - *git
        depends_on: [P4.S3.T1]
      - id: P4.S3.T6
        type: Task
        summary: "Expected cost per package"
        estimate_hours: 6
        due_day: 10
        priority: Highest
        components: [Modeling]
        labels: [expected-cost, rate-cards]
        description: |
          Combine rate card, billable weight, zone, service, fuel and applicable accessorials into an expected charge per
          package, using the rate-card version in effect on the ship date. This is the yardstick the audit measures every
          bill against. LTL is priced differently; agree with Beth how far to take LTL in this project.
        acceptance_criteria:
          - "Expected charge per parcel package with a component breakdown"
          - "LTL scope agreed with Beth and implemented to that scope"
          - "Spot-checked against five real bill lines per carrier"
          - "Missing-rate cases flagged, never defaulted to zero"
          - *git
        depends_on: [P4.S3.T3, P4.S3.T4, P4.S3.T5]

  # ---------------------------------------------------------------- S4
  - id: P4.S4
    summary: "Freight audit model: AX freight bill lines vs shipments vs rate cards"
    type: Story
    reporter: beth.kowalczyk
    priority: Highest
    story_points: 13
    sprint: 2
    due_day: 15
    components: [Modeling, Data Quality]
    labels: [freight-audit, ax2012, parsing, matching]
    description: |
      Carriers bill weekly. AP (Alan Brooks's team) posts each bill in AX as a vendor invoice (`vendinvoicejour` and
      `vendinvoicetrans`, vendors in the CARRIER group). The detail is in the free-text line description, something like
      `TRK 1Z… WT 12.4LB ZN 5 GND`. Formats differ by carrier and have drifted over the years.

      Beth wants every bill line matched to what Harborline shipped and compared with what it should have cost under the
      contract, with each discrepancy classified so she can dispute it: weight billed above what was measured, the same
      package billed twice, surcharges that don't apply, the wrong service level, the wrong fuel percentage, the wrong base rate.

      **Constraints**
      - Disputes need evidence a carrier will accept: tracking number, measured weight and dimensions, the contract rate
        and the calculation.
      - Some lines will never match (reprinted labels, PRO numbers on LTL, typos). They need a queue, not a shrug.
      - Volume: one bill line per parcel package, so millions of lines over the full history.

      **Definition of Done**
      - All sub-tasks done; freight audit fact with expected vs billed per line and classified discrepancies, tested
      - Dispute-ready extract reviewed by Beth
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Carrier bill lines parsed from AX free text into structured fields for every carrier format; unparseable lines quarantined"
      - "Bill lines matched to WMS shipments and cartons, including reprinted labels and LTL PRO numbers; match rate per carrier reported"
      - "Each matched line compared with its expected charge; discrepancies classified (weight, duplicate, accessorial, service, fuel, base rate)"
      - "Disputable amount per carrier and invoice, with evidence, within each carrier's dispute window"
      - "Freight accrued vs billed, and freight recovered from clients vs carrier cost, available by month"
    depends_on: [P3.S1, P4.S1, P4.S3]
    tasks:
      - id: P4.S4.T1
        type: Task
        summary: "How carrier bills are processed today"
        estimate_hours: 2
        due_day: 11
        priority: Medium
        components: [Documentation]
        labels: [stakeholder, freight-audit]
        description: |
          Ask Alan Brooks how AP receives, posts and pays carrier bills, and how freight is accrued (account 2100) and
          expensed (5100). Ask Beth Kowalczyk what she disputes today, how, and within what window for each carrier.
        acceptance_criteria:
          - "Bill-to-pay process documented, with owners"
          - "Dispute window and evidence requirements per carrier recorded"
          - "Current manual checks listed"
          - *docs
        depends_on: []
      - id: P4.S4.T2
        type: Task
        summary: "Parse carrier bill lines from AX"
        estimate_hours: 6
        due_day: 12
        priority: Highest
        components: [Modeling]
        labels: [ax2012, parsing, free-text]
        description: |
          Extract the tracking or PRO number, billed weight and unit, zone, service and charge type from
          `vendinvoicetrans.name` for every carrier. Formats differ by carrier and over time, and some lines are surcharges
          or adjustments rather than packages.
        acceptance_criteria:
          - "Parsed fields for every carrier format, with a documented pattern per format"
          - "Line types classified (package, accessorial, adjustment, fuel)"
          - "Unparseable lines quarantined with reasons and counted per carrier"
          - "Parser unit tests with real samples per carrier"
          - *git
        depends_on: [P3.S1.T6, P4.S4.T1]
      - id: P4.S4.T3
        type: Task
        summary: "Match bill lines to shipments"
        estimate_hours: 5
        due_day: 13
        priority: Highest
        components: [Modeling]
        labels: [matching, tracking]
        description: |
          Join parsed lines to WMS shipments and cartons by tracking number. Remember that a reprinted label changes the
          tracking number, LTL bills reference PRO numbers, and some lines carry typos. Every unmatched line goes to a queue
          with a reason.
        acceptance_criteria:
          - "Matching uses the full tracking-number history"
          - "Match rate per carrier and week"
          - "Unmatched queue with reason categories"
          - "Lines that match more than one shipment flagged"
          - *git
        depends_on: [P4.S4.T2, P2.S2.T4]
      - id: P4.S4.T4
        type: Task
        summary: "Audit rules and discrepancy classes"
        estimate_hours: 6
        due_day: 14
        priority: Highest
        components: [Modeling, Data Quality]
        labels: [freight-audit, rules]
        description: |
          Compare each matched line with its expected charge (P4.S3) and classify discrepancies: billed weight above
          Harborline's billable weight, the same package billed twice, residential or delivery-area surcharges on addresses
          that don't qualify, a higher service than shipped, a base rate off the card. Each rule needs a tolerance agreed with Beth.
        acceptance_criteria:
          - "Each discrepancy class implemented with a documented tolerance"
          - "Duplicate detection works across invoices and weeks"
          - "Every flagged line carries its evidence fields"
          - "Rules tested with crafted examples"
          - *git
        depends_on: [P4.S4.T3, P4.S3.T6]
      - id: P4.S4.T5
        type: Task
        summary: "Fuel surcharge audit by week"
        estimate_hours: 3
        due_day: 14
        priority: High
        components: [Modeling]
        labels: [freight-audit, fuel]
        description: |
          Compare the fuel-surcharge percentage each carrier applied, week by week, with what its own table says it should
          have been for that week's diesel price and effective date.
        acceptance_criteria:
          - "Applied vs expected fuel % per carrier per week"
          - "Dollar impact per week"
          - "Weeks with systematic differences highlighted"
          - *git
        depends_on: [P4.S4.T3, P4.S3.T3]
      - id: P4.S4.T6
        type: Task
        summary: "Dispute-ready output"
        estimate_hours: 3
        due_day: 15
        priority: High
        components: [Modeling]
        labels: [freight-audit, disputes]
        description: |
          Beth needs to file disputes that carriers will accept. Produce, per carrier and invoice, the disputable lines and
          amounts with their evidence, only within the dispute window.
        acceptance_criteria:
          - "Per carrier and invoice: lines, amounts, discrepancy class and evidence"
          - "Window rule per carrier applied"
          - "Export format agreed with Beth (CSV or workbook)"
          - *git
        depends_on: [P4.S4.T4, P4.S4.T5]
      - id: P4.S4.T7
        type: Task
        summary: "Freight accruals and client freight recovery"
        estimate_hours: 3
        due_day: 15
        priority: Medium
        components: [Modeling]
        labels: [finance, freight]
        description: |
          Alan Brooks wants to know how freight accrued at ship time compares with what carriers eventually billed, and how
          much of the freight cost Harborline recovers from clients through the `FRT-RCV` charge (pass-through plus markup).
        acceptance_criteria:
          - "Accrued vs billed freight by month and carrier"
          - "Freight recovery billed vs carrier cost by client and month"
          - "Ties to GL 2100, 5100 and revenue account 4030 per entity, converted per the currency policy"
          - *git
        depends_on: [P4.S4.T3, P3.S3.T4]
      - id: P4.S4.T8
        type: Bug
        reporter: beth.kowalczyk
        summary: "Bug: most LTL freight bill lines land in the unmatched queue"
        estimate_hours: 3
        due_day: 15
        priority: High
        components: [Modeling]
        labels: [bug, matching, ltl]
        description: |
          **Reported by Beth Kowalczyk:**
          > "The unmatched queue is full of ODFL, Marlowe and Estes lines, something like four in ten LTL lines. Parcel looks
          > fine. Those shipments definitely went out; I can see the BOLs. Is the matching broken for LTL?"

          Find out why, fix it, and make sure the unmatched queue holds only lines that genuinely can't be matched. If LTL
          matching is already sound, show Beth the evidence line by line for a sample.
        acceptance_criteria:
          - "Root cause identified with examples"
          - "LTL match rate comparable to parcel, or the remaining gap explained line by line for a sample"
          - &fix "Fix merged via PR from a fix/DATA-<n>-… branch with a regression test; Conventional Commits carry the key; CI green"
        depends_on: [P4.S4.T3]

  # ---------------------------------------------------------------- S5
  - id: P4.S5
    summary: "Carrier performance model: on-time delivery and exceptions by lane"
    type: Story
    reporter: beth.kowalczyk
    priority: High
    story_points: 8
    sprint: 2
    due_day: 17
    components: [Modeling]
    labels: [carrier-performance, on-time, lanes, metrics]
    description: |
      For the RFP Beth needs facts per carrier, service and lane: on-time delivery, transit times, exceptions and cost. A
      lane is origin warehouse → destination region; agree the granularity with Beth (state, 3-digit ZIP or zone).

      **On-time, again**
      > "I measure carriers against what *they* committed to. Omar's team measures against what the *client's customer*
      > was promised. Both are fair. They're not the same number." (Beth)

      Talk to Beth and Omar Haddad, and check the metric catalog from Project 2, before you build it.

      > "A package that sat on our dock for a day isn't the carrier's fault. I need late deliveries split between us and
      > them." (Beth)

      **Definition of Done**
      - All sub-tasks done; delivery performance fact per package with on-time flags per agreed definition, transit and tender lag
      - Lane, exception and cost metrics per carrier, service and month; definitions added to the metric catalog
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "On-time delivery definitions from Transportation and Client Success recorded, named distinctly and added to the metric catalog"
      - "Per-package transit time in business days, tender lag and on-time flags"
      - "Late deliveries attributed to warehouse or carrier with a documented rule"
      - "Exceptions by type, carrier, service and lane"
      - "Cost per package and per billable pound by carrier, service and lane, from audited bill lines"
      - "Weather and holidays available as context for delays"
      - "Carrier scorecard weights agreed with Beth"
    depends_on: [P4.S1, P4.S4, P2.S5]
    tasks:
      - id: P4.S5.T1
        type: Task
        summary: "Agree on-time delivery with Beth and Omar"
        estimate_hours: 3
        due_day: 15
        priority: Highest
        components: [Documentation]
        labels: [stakeholder, metrics, on-time]
        description: |
          Interview Beth Kowalczyk and Omar Haddad separately about on-time delivery: what starts and stops the clock,
          business or calendar days, which transit standard applies (the carrier's service commitment or the promise to the
          end customer), and what's excluded. Reconcile with the P2 metric catalog so names don't collide.
        acceptance_criteria:
          - "Both definitions in the owners' own words, with worked examples"
          - "Distinct names and owners added to the metric catalog"
          - "Data each definition needs identified, with its source"
          - *docs
        depends_on: [P2.S5.T3]
      - id: P4.S5.T2
        type: Task
        summary: "Delivery performance fact"
        estimate_hours: 5
        due_day: 16
        priority: Highest
        components: [Modeling]
        labels: [carrier-performance, kpi]
        description: |
          Per package: ship time, first carrier scan, delivery, transit time in business days, on-time flags per the catalog
          definitions, and exception flags. Decide with Beth whose calendar counts for business days (origin or destination).
        acceptance_criteria:
          - "Grain is one row per package, with milestones and durations"
          - "On-time flags per the catalog definitions"
          - "Updated incrementally as late events arrive"
          - *git
        depends_on: [P4.S5.T1, P4.S1.T6]
      - id: P4.S5.T3
        type: Task
        summary: "Warehouse-caused vs carrier-caused lateness"
        estimate_hours: 3
        due_day: 16
        priority: High
        components: [Modeling]
        labels: [carrier-performance, attribution]
        description: |
          If Harborline handed the package over late (after cutoff, or the first carrier scan comes a day after the ship
          confirmation), the carrier shouldn't wear it. Agree the attribution rule with Beth and apply it.
        acceptance_criteria:
          - "Attribution rule documented, with Beth's sign-off"
          - "Each late package attributed"
          - "Share of lateness by cause per site and carrier"
          - *git
        depends_on: [P4.S5.T2, P2.S2.T5]
      - id: P4.S5.T4
        type: Task
        summary: "Exceptions by lane"
        estimate_hours: 3
        due_day: 17
        priority: High
        components: [Modeling]
        labels: [carrier-performance, exceptions, lanes]
        description: |
          Damage, address problems, weather delays, lost packages: by carrier, service and lane, at the lane granularity
          agreed with Beth.
        acceptance_criteria:
          - "Exception taxonomy mapped from carrier codes"
          - "Exception rates by carrier, service, lane and month"
          - "Lane definition documented"
          - *git
        depends_on: [P4.S5.T2]
      - id: P4.S5.T5
        type: Task
        summary: "Weather and holiday context for delays"
        estimate_hours: 2
        due_day: 17
        priority: Medium
        components: [Modeling]
        labels: [weather, calendar]
        description: |
          Reuse the P2 weather and calendar data to put delays in context: a storm week shouldn't count against a carrier in
          the same way as a sunny one. Show the context; don't excuse delays automatically.
        acceptance_criteria:
          - "Weather and holiday context joined to deliveries at the origin site"
          - "Context visible alongside on-time metrics"
          - "No automatic exclusion without Beth's agreement"
          - *git
        depends_on: [P4.S5.T2, P2.S1.T3]
      - id: P4.S5.T6
        type: Task
        summary: "Cost per package and per pound by lane"
        estimate_hours: 3
        due_day: 17
        priority: High
        components: [Modeling]
        labels: [carrier-performance, cost]
        description: |
          For the RFP, Beth needs fully loaded cost (base, fuel, accessorials) per package and per billable pound by carrier,
          service, lane and weight band, from audited bill lines rather than estimates.
        acceptance_criteria:
          - "Cost metrics by carrier, service, lane, weight band and month"
          - "Based on matched bill lines; unmatched lines excluded and counted"
          - "Canadian and Mexican carrier bills converted per the currency policy"
          - *git
        depends_on: [P4.S4.T4]
      - id: P4.S5.T7
        type: Bug
        reporter: beth.kowalczyk
        summary: "Bug: carrier scorecard shows packages delivered before they shipped"
        estimate_hours: 3
        due_day: 17
        priority: High
        components: [Modeling]
        labels: [bug, time-zones]
        description: |
          **Reported by Beth Kowalczyk:**
          > "Some west-coast packages show negative transit times. Apparently they were delivered the evening before we
          > shipped them. Mostly RNO1 and LAX1. That'll get laughed out of the carrier review. What's happening?"

          Fix it at the source of the problem, not with a filter. If your model never produces negative transit times, show
          Beth the evidence.
        acceptance_criteria:
          - "Root cause explained"
          - "No negative transit times unless a documented data defect is behind them"
          - "Tests for time handling at Pacific, Central and Eastern sites"
          - *fix
        depends_on: [P4.S5.T2]
      - id: P4.S5.T8
        type: Task
        summary: "Agree scorecard weights with Beth"
        estimate_hours: 2
        due_day: 17
        priority: Medium
        components: [Documentation]
        labels: [stakeholder, scorecard]
        description: |
          The RFP scorecard ranks carriers on several measures. Ask Beth which measures count and how much (on-time, cost,
          billing accuracy, exceptions), and how to treat carriers with little volume on a lane.
        acceptance_criteria:
          - "Weights and the minimum-volume rule documented with Beth's sign-off"
          - "Composite score reproducible from the metric catalog"
          - *docs
        depends_on: [P4.S5.T1]

  # ---------------------------------------------------------------- S6
  - id: P4.S6
    summary: "Freight Audit and Carrier Scorecard dashboards"
    type: Story
    reporter: beth.kowalczyk
    priority: High
    story_points: 8
    sprint: 2
    due_day: 20
    components: [Dashboards]
    labels: [dashboard, freight-audit, carrier-performance]
    attachments: [wireframes/P4-D1.svg, wireframes/P4-D2.svg]
    description: |
      Two dashboards; specs are in the dashboard catalog and wireframes are attached.

      - **P4-D1 Freight Audit**: what Harborline was billed vs what it should have paid, by carrier and week, with every
        disputable dollar one click from its evidence. Users: Beth and AP.
      - **P4-D2 Carrier Scorecard**: on-time, transit, exceptions, cost and billing accuracy by carrier, service and lane.
        Users: Beth, Luis Moreno and, filtered to one carrier at a time, the carriers themselves at quarterly reviews.

      **Non-negotiables:** a carrier must never see another carrier's data, and freight cost detail stays inside
      Transportation and Finance. Under 3 seconds per view on the free-tier warehouse. The Harborline brand kit with the
      Transportation accent.
      Refreshed daily by 07:00 ET and again after the weekly carrier bills post on Mondays.

      **Readout:** 5 minutes with Beth. Tell her how much can be clawed back and which carrier she should worry about.

      **Definition of Done**
      - All sub-tasks done; both dashboards in prod with access tested, including a single-carrier export
      - Release **v0.4.0** tagged on `main` with CHANGELOG; readout recorded
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "KPI definitions match the P4-D1 and P4-D2 specs and the metric catalog, with both on-time definitions clearly named"
      - "Filters for carrier, service, mode, origin site, destination region, week or month and discrepancy class, as each spec lists"
      - "Refreshed daily by 07:00 ET and after the Monday carrier-bill postings; freshness shown in the footer"
      - "Access: Transportation and Finance AP see everything; Operations see P4-D2 only; single-carrier exports contain only that carrier's data (tested)"
      - "Every view loads in under 3 seconds (measured)"
      - "Harborline brand kit applied: logo, Transportation accent, background template, palette, currency and weight formats"
      - "5-minute readout to Beth Kowalczyk delivered and recorded"
      - "Iris Novak's UAT sign-off recorded for P4-D1 and P4-D2 before the readout"
    depends_on: [P4.S4, P4.S5]
    tasks:
      - id: P4.S6.T1
        type: Task
        summary: "Freight marts"
        estimate_hours: 4
        due_day: 18
        priority: High
        components: [Modeling]
        labels: [gold, performance]
        description: |
          Pre-aggregate audit results (carrier × invoice × week, carrier × discrepancy class) and performance (carrier ×
          service × lane × month) so every view is fast on a small warehouse.
        acceptance_criteria:
          - "Every visual in both specs backed by a mart"
          - "Each visual's query runs in under 3 seconds"
          - "Marts refresh daily and after Monday bill postings"
          - *git
        depends_on: [P4.S4.T6, P4.S5.T6]
      - id: P4.S6.T2
        type: Task
        summary: "Build P4-D1 Freight Audit"
        estimate_hours: 6
        due_day: 18
        priority: Highest
        components: [Dashboards]
        labels: [dashboard, brand]
        description: |
          Build the dashboard to the P4-D1 spec and wireframe. Beth needs to go from "this carrier overbilled last month" to
          the lines and evidence she'll send them in two clicks.
        acceptance_criteria:
          - "Every P4-D1 KPI and visual present per spec"
          - "Drill-down from carrier to invoice to line evidence"
          - "Dispute export reachable from the dashboard"
          - "Brand kit applied; footer shows freshness"
          - *git
        depends_on: [P4.S6.T1]
      - id: P4.S6.T3
        type: Task
        summary: "Build P4-D2 Carrier Scorecard"
        estimate_hours: 5
        due_day: 19
        priority: High
        components: [Dashboards]
        labels: [dashboard, brand]
        description: |
          Build the dashboard to the P4-D2 spec and wireframe: carrier ranking, lanes, trends and the agreed composite score.
        acceptance_criteria:
          - "Every P4-D2 KPI and visual present per spec"
          - "Both on-time definitions shown with their catalog names"
          - "Composite score matches the weights agreed with Beth"
          - "Brand kit applied"
          - *git
        depends_on: [P4.S6.T1, P4.S5.T8]
      - id: P4.S6.T4
        type: Task
        summary: "Single-carrier scorecard export"
        estimate_hours: 2
        due_day: 19
        priority: High
        components: [Dashboards, Security]
        labels: [export, access]
        description: |
          Beth shares a scorecard with each carrier at quarterly reviews. Produce a per-carrier version (PDF or filtered view)
          that can't leak other carriers' data or Harborline's internal costs and margins.
        acceptance_criteria:
          - "One-click or scheduled export per carrier"
          - "Contains only that carrier's metrics: no other carrier names, no internal margin"
          - "Checked by opening two carriers' exports side by side"
          - *git
        depends_on: [P4.S6.T3]
      - id: P4.S6.T5
        type: Task
        summary: "Access rules and performance check"
        estimate_hours: 2
        due_day: 20
        priority: High
        components: [Dashboards, Security]
        labels: [access, performance]
        description: |
          Implement the access rules in the specs, prove them with a Transportation identity and an Operations identity, and
          measure load times.
        acceptance_criteria:
          - "Each role sees exactly what the spec allows, tested with two identities (or the free-tier limitation documented with a mitigation)"
          - "Cold and warm load times recorded per view"
          - *git
        depends_on: [P4.S6.T2, P4.S6.T3]
      - id: P4.S6.T6
        type: Task
        summary: "UAT sign-off from Iris Novak for P4-D1 and P4-D2"
        estimate_hours: 4
        due_day: 20
        priority: Highest
        reporter: iris.novak
        components: [Dashboards, Data Quality]
        labels: [uat, sign-off, reconciliation]
        description: |
          Nothing goes to Beth until Iris Novak (Business Performance Manager) has signed it off. She ties
          your numbers back to the source systems herself, checks every KPI against your metric catalog and the
          dashboard spec, and writes up numbered findings with a verdict.

          For each dashboard: stop the stream, refresh, download the source extract from the Control Center, and put
          a submission in `uat/<dashboard id>/round-1/` as the team page describes (Dashboard sign-off). Attach the
          package zip, the zipped submission and the extract to a chat with Iris (or ask her in your coding agent).
          Fix or answer every finding, and resubmit as round 2, 3 and so on until she signs off. Blockers and Majors
          must be fixed before the readout; Minors can become tickets if she agrees.
        acceptance_criteria:
          - "A submission for each dashboard: every page as PNG, CSV exports of the headline visuals and the end tables behind them, data-as-of and sim clock, a copy of the metric catalog, bridge.csv and the matching source extract"
          - "Iris's review report committed under uat/ for every round"
          - "No open Blocker or Major findings; agreed Minors ticketed"
          - "Verdict Signed off (or Signed off with conditions) for P4-D1 and P4-D2"
        depends_on: [P4.S6.T4, P4.S6.T5]
      - id: P4.S6.T7
        type: Task
        summary: "Readout to Beth and release v0.4.0"
        estimate_hours: 2
        due_day: 20
        priority: High
        components: [Documentation]
        labels: [readout, release]
        description: |
          Five minutes: how much is disputable, which carrier is the biggest problem on cost and on service, and what you'd
          do next. Record it; it's your portfolio demo too. Then tag the release and close the epic.
        acceptance_criteria:
          - "Readout delivered and recording (or script plus screenshots) linked here"
          - "Feedback captured as new tickets"
          - "v0.4.0 tagged on main; CHANGELOG lists every ticket key in the release"
          - "Retro notes (keep / change / try) committed"
        depends_on: [P4.S6.T6]
