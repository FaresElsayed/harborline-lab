      - id: P4.S6.T4
        type: Task
        summary: "Single-carrier scorecard export"
        estimate_hours: 2
        due_day: 19
        priority: High
        components: [Dashboards, Security]
        labels: [export, access, level-4]
        description: |
          > "Every quarter I sit down with each carrier's rep and hand over their scorecard. If one of them can work out who else
          > we use on their lanes, or what we pay anyone else, that's a problem I can't take back." (Beth)

          Each carrier gets its own version, with its own metrics and its own billed amounts. It can't show another carrier's
          data or Harborline's internal costs and margins.

          Hiding names may not be enough. Nobody has decided whether a carrier sees its rank or a network average, what to do on
          a lane with only two carriers, or what travels along in a file's metadata. Beth decides what a carrier gets to see;
          you owe her the risks of each choice, and a way of producing thirteen of these that can't go wrong by hand.
        acceptance_criteria:
