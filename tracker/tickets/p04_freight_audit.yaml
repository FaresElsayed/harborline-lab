# Project 4 - Freight Audit & Carrier Performance (program weeks 13-16)
# Requester: Beth Kowalczyk (Transportation Manager)
project: 4
epic:
  id: P4
  summary: "Freight Audit & Carrier Performance: stop paying carrier bills on trust"
  department: Transportation
  reporter: beth.kowalczyk
  priority: High
  labels: [transportation, freight, carriers, dashboards]
  description: |
    **Sponsor:** Beth Kowalczyk, Transportation Manager.

    > "Freight is our second-biggest cost after labor, and we pay carrier invoices on trust. AP posts the bills, nobody
    > checks them line by line against what we shipped and what we negotiated." (Beth)

    Thirteen carriers, parcel and LTL across the US, Canada and Mexico, bill Harborline weekly. AP posts each bill in AX
    as a vendor invoice with free-text lines. On the service side, Beth renegotiates carrier contracts every year and goes
    in with anecdotes. She wants facts: who delivers on time on which lanes, who loses packages, and who's cheapest per
    pound once accessorials are in.

    **What this project delivers**
    - Carrier tracking events (API plus history export), EDI 940/945 documents, carrier rate cards and weekly diesel prices
      in the platform.
    - A freight audit model: every carrier bill line matched to a shipment and compared to what it should have cost.
    - A carrier performance model: on-time delivery, transit, exceptions and cost by carrier, service and lane.
    - Dashboards **P4-D1 Freight Audit** and **P4-D2 Carrier Scorecard**.

    **Why now:** carrier RFPs go out in Q1, and peak season is when billing errors pile up fastest. Carriers accept
    disputes only within a limited window after the invoice, so old errors are gone for good.

    **Sources:** the carrier tracking aggregator API, EDI 940/945 files from B2B clients, carrier rate-card workbooks in
    `landing/files/`, the weekly diesel reference file there, AX vendor invoices (from Project 3) and the WMS shipments you already have.

    **Success measures**
    - Every carrier bill line is matched, rated, and either accepted or disputable with evidence.
    - The Q1 RFP pack is built from P4-D2, with both on-time definitions clearly named.
    - Release **v0.4.0** tagged with CHANGELOG.
  dashboards: [P4-D1, P4-D2]

stories:
  # ---------------------------------------------------------------- S3
  - id: P4.S3
    summary: "Carrier rate cards and diesel price for fuel surcharge"
    type: Story
    reporter: beth.kowalczyk
    priority: High
    story_points: 8
    sprint: 1
    due_day: 4
    components: [Ingestion, Modeling]
    labels: [rate-cards, xlsx, files, fuel, level-3]
    description: |
      To audit a bill you need to know what it **should** have cost. Each carrier's negotiated rates are in a workbook in
      `landing/files/`. New versions arrive after renegotiations and general rate increases. Each workbook has base rates
      by service, zone and weight, plus accessorials and the fuel-surcharge table. Parcel carriers bill on the greater of
      actual and dimensional weight.

      Fuel surcharges float weekly with a diesel price. `landing/files/reference/diesel_weekly.csv` is the series the
      carriers' tables read and bills were rated from, so it is your rate-card reference. The real EIA series is a
      separate stretch comparison and won't match it.

      **Talk to:** Beth Kowalczyk (how each carrier's contract works: dimensional divisors, minimums, fuel effective dates)
      and Alan Brooks (how freight is accrued).

      **Definition of Done**
      - All sub-tasks done; rate cards (every version) and weekly diesel prices in silver
      - Expected cost for any historical shipment computable from the rate-card version in effect on its ship date
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Every carrier rate-card version ingested with effective dates, tolerating layout differences between carriers"
      - "Weekly diesel prices for the full history plus weekly increments"
      - "Fuel surcharge % per carrier per week, with the effective-date rule agreed with Beth"
      - "Billable weight per package per carrier rule (actual vs dimensional)"
      - "Expected charge per package (base, fuel and accessorials) from the rate-card version in effect on the ship date"
    depends_on: [P1.S5, P2.S2]
    tasks:
      - id: P4.S3.T2
        type: Task
        summary: "Weekly diesel prices from the reference file"
        estimate_hours: 3
        due_day: 1
        priority: High
        components: [Ingestion]
        labels: [files, fuel, level-2]
        description: |
          Load `landing/files/reference/diesel_weekly.csv`, the weekly on-highway diesel price, for the full history and
          keep it current. The file is rewritten in full with one more row each Monday.

          **Where to start:** Open Business files in Source systems. Beth Kowalczyk can tell you how carriers use the price.

          **Stretch:** load the real US series from the EIA API into its own table and chart the two. They won't match,
          because the simulator generates its own series. The Public APIs table has the series and the page where you
          register for a free key. Real publication can slip around holidays, and values are occasionally revised.
        acceptance_criteria:
          - "Weekly diesel price for the full history plus weekly increments, one row per week"
          - "A re-run picks up each new week, with no duplicate weeks"
          - "If you take the stretch: EIA key kept in the secret store, not in Git, and the EIA series is never used to rate bills"
          - &git "Merged via PR from a feat/DATA-<n>-… branch; Conventional Commits carry the key; PR self-review done; CI green"
        depends_on: [P1.S2.T3, P1.S5.T1]
      - id: P4.S3.T1
        type: Task
        summary: "Ingest carrier rate-card workbooks"
        estimate_hours: 6
        due_day: 2
        priority: Highest
        components: [Ingestion]
        labels: [rate-cards, xlsx, scd2, level-3]
        description: |
          Each carrier sends rates in its own layout: zones across, weights down, accessorial tables on other sheets, notes in
          merged cells. New versions arrive over time and must not overwrite history.
        acceptance_criteria:
          - "Every carrier and version loaded with file metadata and effective dates"
          - "Long format: carrier × service × zone × weight break → rate"
          - "Accessorial and fuel tables captured"
          - "A layout surprise fails loudly, per carrier"
          - *git
        depends_on: [P1.S5.T1]
      - id: P4.S3.T5
        type: Task
        summary: "Accessorial catalog per carrier"
        estimate_hours: 3
        due_day: 2
        priority: Medium
        components: [Modeling]
        labels: [accessorials, rate-cards, level-2]
        description: |
          Residential delivery, delivery-area surcharges, additional handling, liftgate on LTL: each carrier prices them on
          its own card, per country and per rate-card version. Build one catalog that maps each carrier's accessorial codes
          and descriptions to common types, with the amounts and the conditions under which each applies.

          **Where to start:** Open the `Accessorials` sheet in a few workbooks under `landing/files/carriers/rate_cards/`, one parcel and one
          LTL at least. Each sheet has a Code, a Description and an amount per currency. Beth Kowalczyk owns the rules for
          when each one applies.
        acceptance_criteria:
          - "Accessorials per carrier, country and rate-card version mapped to common types"
          - "Conditions of applicability documented (for example residential vs commercial address)"
          - "Unmapped accessorials listed for Beth"
          - *git
        depends_on: [P4.S3.T1]
      - id: P4.S3.T3
        type: Task
        summary: "Fuel surcharge % by carrier and week"
        estimate_hours: 3
        due_day: 3
        priority: High
        components: [Modeling]
        labels: [fuel, rate-cards, level-3]
        description: |
          Carriers map the diesel price to a fuel-surcharge percentage through a table in their rate card, applied from a
          specific day relative to the price publication. Ask Beth Kowalczyk exactly when each carrier's new percentage
          takes effect.
        acceptance_criteria:
          - "Fuel % per carrier, service type and week"
          - "Effective-date rule per carrier documented with Beth's answer"
          - "Tested on a week where the diesel band changed"
          - *git
        depends_on: [P4.S3.T1, P4.S3.T2]
      - id: P4.S3.T4
        type: Task
        summary: "Billable weight and zones"
        estimate_hours: 4
        due_day: 3
        priority: High
        components: [Modeling]
        labels: [dim-weight, zones, level-3]
        description: |
          Parcel carriers bill the greater of actual and dimensional weight (L × W × H divided by a divisor that differs by
          carrier and contract), rounded up by their rules. Zones depend on origin and destination. Agree with Beth where the
          authoritative zone comes from.
        acceptance_criteria:
          - "Billable weight per carton per carrier rule, using canonical units from P1"
          - "Zone per package from the agreed source"
          - "Rules documented per carrier"
          - *git
        depends_on: [P4.S3.T1, P2.S2.T4]
      - id: P4.S3.T6
        type: Task
        summary: "Expected cost per package"
        estimate_hours: 6
        due_day: 4
        priority: Highest
        components: [Modeling]
        labels: [expected-cost, rate-cards, level-3]
        description: |
          Combine rate card, billable weight, zone, service, fuel and applicable accessorials into an expected charge per
          package, using the rate-card version in effect on the ship date. This is the yardstick the audit measures every
          bill against. LTL is priced differently; agree with Beth how far to take LTL in this project.
        acceptance_criteria:
          - "Expected charge per parcel package with a component breakdown"
          - "LTL scope agreed with Beth and implemented to that scope"
          - "Spot-checked against five real bill lines per carrier"
          - "Missing-rate cases flagged, never defaulted to zero"
          - *git
        depends_on: [P4.S3.T3, P4.S3.T4, P4.S3.T5]

  # ---------------------------------------------------------------- S2
  - id: P4.S2
    summary: "EDI 940/945 parsing: X12 envelopes, control numbers and duplicates"
    type: Story
    reporter: beth.kowalczyk
    priority: High
    story_points: 8
    sprint: 1
    due_day: 7
    components: [Ingestion, Data Quality]
    labels: [edi, x12, files, duplicates, level-3]
    description: |
      Harborline's B2B clients (mostly auto parts and general merchandise) send orders as EDI **940** warehouse shipping
      orders, and Harborline sends back **945** warehouse shipping advices when they ship. The 945 is the record of what
      Harborline told the client it shipped, with the BOL and PRO numbers and the carrier. When a client disputes a shipment
      or a freight charge, the 945 is the evidence. Tomás Ortega runs the EDI translator and the `landing/edi/` folders.

      **What to expect (X12 004010)**
      - Envelopes (ISA, GS, ST) with control numbers and counts that must agree.
      - Resent files and duplicate interchanges.
      - The occasional malformed transaction set, such as a wrong segment count.
      - Client PO numbers that should match WMS `client_order_ref`.

      **Definition of Done**
      - All sub-tasks done; 940s and 945s parsed into structured tables with envelope validation, deduplication and quarantine
      - 945s matched to WMS shipments and 940s to WMS orders, with match rates reported
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Every document in landing/edi, loose files and the monthly history archives alike, is parsed or quarantined with a reason; none is silently skipped"
      - "Envelope validation: delimiters read from ISA; control numbers and counts checked at interchange, group and transaction-set level"
      - "Duplicate interchanges and resends loaded once, with resends recorded"
      - "940 orders and 945 shipments in silver at header and line level"
      - "945s matched to WMS shipments and 940s to WMS orders, with match rates per trading partner"
    depends_on: [P1.S5]
    tasks:
      - id: P4.S2.T1
        type: Task
        summary: "EDI walkthrough with Tomás"
        estimate_hours: 2
        due_day: 5
        priority: Medium
        components: [Documentation]
        labels: [edi, stakeholder, level-2]
        description: |
          Ask Tomás Ortega which trading partners send what, how files are named and moved, what the 997 acknowledgements
          mean, and what happens when a file is resent. Then look at real files in `landing/edi/`.

          **Where to start:** Read the EDI section of Source systems, then open one file under `landing/edi/inbound/940/` and one under
          `landing/edi/outbound/945/`. Tomás Ortega runs the translator, so bring him what you can't explain.
        acceptance_criteria:
          - "Trading partners and document types listed"
          - "File lifecycle (arrival, processing, archive) documented"
          - "Known quirks recorded, each with an example file name"
          - &docs "Committed via PR (docs/DATA-<n>-… branch, Conventional Commit with the key) and linked from this ticket"
        depends_on: []
      - id: P4.S2.T2
        type: Spike
        summary: "Spike: parse X12 with a library or write your own"
        estimate_hours: 2
        due_day: 5
        priority: Medium
        components: [Ingestion, Documentation]
        labels: [edi, spike, adr, level-3]
        description: |
          Time-box: 2 hours. Try at least one open-source X12 library against real files from `landing/edi/` (including a
          broken one), and compare it with a small parser of your own. Consider maintenance, licence, how failures surface,
          and whether it runs where your pipeline runs.
        acceptance_criteria:
          - "Short ADR with the options tried, the evidence and the decision"
          - "Behaviour on a malformed file shown for each option"
          - *docs
        depends_on: [P4.S2.T1]
      - id: P4.S2.T3
        type: Task
        summary: "Parse X12 envelopes and validate control numbers"
        estimate_hours: 5
        due_day: 5
        priority: Highest
        components: [Ingestion]
        labels: [edi, x12, validation, level-2]
        description: |
          Read interchanges, groups and transaction sets with the delimiters taken from the ISA segment, never assumed. Read
          both the loose files and the monthly zips under `landing/edi/archive/`. Check that every closing segment agrees with
          its opening segment on the control number and that the counts are right. Quarantine what fails, with the reason.

          **Where to start:** The EDI section of Source systems says what SE01, GE01 and IEA01 each count. Check one small file by hand against
          it before you write any code. Tomás Ortega can walk you through a file segment by segment.
        acceptance_criteria:
          - "Interchange, group and transaction-set metadata stored per file, for loose and archived files"
          - "Control numbers and the SE01, GE01 and IEA01 counts validated; failures quarantined with a reason"
          - "Unit tests with good and broken samples, including a wrong segment count"
          - *git
        depends_on: [P4.S2.T2]
      - id: P4.S2.T7
        type: Task
        summary: "EDI processing monitor"
        estimate_hours: 2
        due_day: 6
        priority: Medium
        components: [Orchestration]
        labels: [edi, observability, level-2]
        description: |
          Tomás wants to know when a partner goes quiet or the backlog grows. Track files received vs processed per partner
          per day and how long processing takes.

          **Where to start:** Start from the per-file metadata you stored in P4.S2.T3. File names carry the set, the partner and the time, as
          Source systems describes under EDI. Ask Tomás Ortega what gap is normal for a partner.
        acceptance_criteria:
          - "Files and transaction sets received, processed and quarantined per partner per day"
          - "Alert when a partner sends nothing for longer than its usual gap, or quarantine grows"
          - "Visible on P1-D1"
          - *git
        depends_on: [P4.S2.T3]
      - id: P4.S2.T4
        type: Task
        summary: "940 and 945 documents to structured tables"
        estimate_hours: 6
        due_day: 6
        priority: Highest
        components: [Modeling]
        labels: [edi, x12, level-3]
        description: |
          Turn 940 shipping orders and 945 shipping advices into header and line tables: depositor order number, client PO,
          ship-to, requested dates, and lines with quantities, UPC or SKU and lot. For 945s, also the ship date, BOL, PRO,
          carrier SCAC and shipped vs ordered quantities.
        acceptance_criteria:
          - "940 header and line, and 945 header and line, in silver"
          - "Party loops and reference segments read correctly wherever they appear in a transaction set"
          - "Quantities and units typed"
          - "Sample transactions hand-checked against the raw files"
          - *git
        depends_on: [P4.S2.T3]
      - id: P4.S2.T5
        type: Task
        summary: "Duplicates, resends and control-number gaps"
        estimate_hours: 3
        due_day: 6
        priority: High
        components: [Data Quality]
        labels: [edi, duplicates, level-3]
        description: |
          Clients resend files when they aren't sure Harborline got them, and the same order can appear in more than one
          interchange. Load each business document once, keep a trail of resends, and report control-number gaps.
        acceptance_criteria:
          - "Duplicate interchanges and transaction sets loaded once; dedup key documented"
          - "Resend history kept"
          - "Control-number gaps per trading partner reported"
          - *git
        depends_on: [P4.S2.T3]
      - id: P4.S2.T6
        type: Task
        summary: "Match EDI documents to WMS orders and shipments"
        estimate_hours: 4
        due_day: 7
        priority: High
        components: [Modeling, Data Quality]
        labels: [edi, reconciliation, level-3]
        description: |
          Each 940 should become a WMS order (client PO ↔ `client_order_ref`), and each 945 should describe a WMS shipment.
          Measure how well they line up and list what doesn't.
        acceptance_criteria:
          - "940 → WMS order and 945 → WMS shipment match rates per trading partner and month"
          - "Unmatched documents listed with reason categories"
          - "Quantity differences between 945 lines and WMS shipment lines flagged"
          - *git
        depends_on: [P4.S2.T4, P4.S2.T5, P2.S2.T4]

  # ---------------------------------------------------------------- S1
  - id: P4.S1
    summary: "Carrier tracking API ingestion: cursor, rate limits, late events and history backfill"
    type: Story
    reporter: beth.kowalczyk
    priority: Highest
    story_points: 13
    sprint: 1
    due_day: 10
    components: [Ingestion, Modeling]
    labels: [carrier-api, api, late-data, backfill, level-3]
    description: |
      Harborline subscribes to a tracking aggregator that returns every scan for every package across all carriers. Tomás
      Ortega set up the integration account; ask him about the API key and its limits.

      **What's known about the feed**
      - Cursor paging (`since` plus `cursor`, up to 500 events a page) and an API key in a header.
      - It throttles (429 with `Retry-After`) and has occasional 503s.
      - Events arrive late, out of order and sometimes twice; carriers also correct earlier statuses.
      - The API keeps only **90 days**. Older history is in a one-time export in `landing/files/carrier/history_export/`.
      - Volume: every shipped package (~2.5 M over 3 years on Large), each with several scans.

      **Definition of Done**
      - All sub-tasks done; full history (export plus API) in bronze with no gap or double count at the seam
      - Incremental ingestion runs on the schedule with retries and a persisted cursor
      - Package-level tracking model linked to WMS shipments, including reprinted labels
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Incremental ingestion with a persisted cursor; restarts resume with no gaps or duplicates"
      - "429s honour Retry-After and 503s are retried with backoff; no run fails on a single transient error"
      - "Duplicate, late and out-of-order events handled; the correct current status per package is derivable at any time"
      - "History export backfilled and stitched to API data with no gaps or overlaps (tested at the seam)"
      - "Event times normalized to UTC per the time standard (P2.S1.T5)"
      - "Package-level model linked to WMS shipments and cartons, including tracking numbers replaced by label reprints"
    depends_on: [P1.S5, P2.S2]
    tasks:
      - id: P4.S1.T1
        type: Task
        summary: "Explore the tracking API with Tomás and Beth"
        estimate_hours: 2
        due_day: 7
        priority: High
        components: [Ingestion, Documentation]
        labels: [carrier-api, stakeholder, level-2]
        description: |
          Put the API key (Control Center → Connections) in your secret store and explore the API: event shape, statuses and
          exception codes, cursor behaviour and limits. Ask Tomás Ortega what he knows about the aggregator's quirks, and
          Beth Kowalczyk what each status means to her team.

          **Where to start:** Open the Carrier tracking API section of Source systems, then call `GET /tracking-events` with a small `limit`.
          Tomás Ortega holds the account and knows the limits. Beth Kowalczyk knows what each status means to her team.
        acceptance_criteria:
          - "API documented: endpoints, auth, paging, limits, event fields, status and exception codes"
          - "Questions and answers from Tomás and Beth recorded"
          - "Sample payloads saved, with no secrets in them"
          - *docs
        depends_on: []
      - id: P4.S1.T3
        type: Task
        summary: "Throttling and transient errors"
        estimate_hours: 3
        due_day: 8
        priority: High
        components: [Ingestion]
        labels: [carrier-api, reliability, rate-limits, level-2]
        description: |
          The API allows about 120 requests a minute, answers 429 with `Retry-After` when you go over, and fails with a 503
          about 1% of the time. Be a good API citizen, and never lose a page.

          **Where to start:** Source systems has the limits under Carrier tracking API. Go over them on purpose once, so you see a real 429 and
          its `Retry-After` header. Ask Tomás Ortega if the API behaves differently from what you expected.
        acceptance_criteria:
          - "Retry-After honoured; backoff with jitter on 503s"
          - "Request rate stays under 120 a minute (measured over a full run)"
          - "Retries, throttles and failures counted per run and visible on P1-D1"
          - *git
        depends_on: [P4.S1.T1]
      - id: P4.S1.T2
        type: Task
        summary: "Incremental cursor-based ingestion"
        estimate_hours: 6
        due_day: 8
        priority: Highest
        components: [Ingestion]
        labels: [carrier-api, incremental, level-3]
        description: |
          Ingest new events on the schedule. Persist the cursor and `since` so a crash, a restart or a laptop that slept all
          weekend resumes exactly where it stopped. Within the 90-day retention, missing a weekend should never lose data.
        acceptance_criteria:
          - "Cursor and since state persisted and advanced only after a successful write"
          - "Exactly-once landing in bronze; re-runs don't duplicate"
          - "Catch-up after a multi-day gap tested"
          - "Throughput per run recorded"
          - *git
        depends_on: [P4.S1.T1]
      - id: P4.S1.T5
        type: Task
        summary: "Backfill from the history export"
        estimate_hours: 4
        due_day: 9
        priority: High
        components: [Ingestion]
        labels: [carrier-api, backfill, files, level-4]
        description: |
          > "Ninety days won't get me through an RFP. I need the whole history, and if the numbers jump or dip where the old
          > data meets the new, nobody in that room will believe the rest of it." (Beth)

          The API reaches back only 90 days, and that edge moves every day. A one-time gzipped CSV export in
          `landing/files/carrier/history_export/` covers the time before that. The two have to read as one history, with no
          gap and no double count, today and every day after.

          Yours to decide and defend: which source wins when both have the same event, what happens to a correction that
          lands on the other side of the seam, and how anyone would notice if the seam broke next month.
        acceptance_criteria:
          - "Export loaded with file metadata"
          - "Seam between export and API tested for gaps and duplicates"
          - "Source precedence documented, with the reasoning"
          - "Event counts per month reconciled across the stitched history"
          - *git
        depends_on: [P4.S1.T2]
      - id: P4.S1.T4
        type: Task
        summary: "Late, duplicate and out-of-order events"
        estimate_hours: 5
        due_day: 9
        priority: Highest
        components: [Modeling]
        labels: [carrier-api, late-data, dedup, level-4]
        description: |
          > "The on-time number I take into a carrier review can't move because a scan showed up twice, and it can't be wrong
          > because a correction came in days after the fact. The carrier will spot that before I do." (Beth)

          Events arrive after later events, arrive twice, and carriers correct statuses they already reported. Downstream
          needs the full history of what was reported and one reliable answer to "where is this package now", and both have
          to survive a re-run.

          Not specified, and yours to settle: what makes two events the same event, which time decides the order, what a
          correction replaces and what it leaves in place, and how far back a late event may change facts people have already
          seen. Keep what that costs on every run in mind: on Large this is every package over 3 years, each with several scans.
        acceptance_criteria:
          - "An event delivered twice counts once; what makes two events the same is documented"
          - "Event history ordered by when things happened, with arrival time kept"
          - "Current status per package correct after out-of-order and corrected events (tested)"
          - "A late or corrected event changes downstream facts without a full rebuild; any limit on how far back is documented"
          - *git
        depends_on: [P4.S1.T2]
      - id: P4.S1.T7
        type: Task
        summary: "Tracking-event data-quality checks"
        estimate_hours: 2
        due_day: 10
        priority: Medium
        components: [Data Quality]
        labels: [carrier-api, dq, level-2]
        description: |
          Some tracking problems are data problems; some are lost packages. Flag both, so Beth can tell them apart.

          **Where to start:** Start from your deduplicated events and the event and exception codes listed under Carrier tracking API in Source
          systems. For numbers Harborline never shipped, compare with the tracking-number trail from P2.S2.T4. Beth Kowalczyk
          sets the number of days without a scan.
        acceptance_criteria:
          - "Unknown status or exception codes flagged"
          - "Events for tracking numbers Harborline never shipped flagged"
          - "Events dated before the ship time or in the future flagged, comparing in UTC per P2.S1.T5"
          - "Packages with no carrier scan after the number of days Beth sets are listed"
          - *git
        depends_on: [P4.S1.T4, P2.S2.T4]
      - id: P4.S1.T6
        type: Task
        summary: "Package tracking model linked to WMS shipments"
        estimate_hours: 6
        due_day: 10
        priority: Highest
        components: [Modeling]
        labels: [carrier-api, shipments, tracking, level-3]
        description: |
          One row per package with its key milestones (label created, first carrier scan, out for delivery, delivered,
