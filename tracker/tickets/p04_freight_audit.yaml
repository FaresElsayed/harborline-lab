# Project 4 - Freight Audit & Carrier Performance (program weeks 13-16)
# Requester: Beth Kowalczyk (Transportation Manager)
project: 4
epic:
  id: P4
  summary: "Freight Audit & Carrier Performance: stop paying carrier bills on trust"
  department: Transportation
  reporter: beth.kowalczyk
  priority: High
  labels: [transportation, freight, carriers, dashboards]
  description: |
    **Sponsor:** Beth Kowalczyk, Transportation Manager.

    > "Freight is our second-biggest cost after labor, and we pay carrier invoices on trust. AP posts the bills, nobody
    > checks them line by line against what we shipped and what we negotiated." (Beth)

    Thirteen carriers, parcel and LTL across the US, Canada and Mexico, bill Harborline weekly. AP posts each bill in AX
    as a vendor invoice with free-text lines. On the service side, Beth renegotiates carrier contracts every year and goes
    in with anecdotes. She wants facts: who delivers on time on which lanes, who loses packages, and who's cheapest per
    pound once accessorials are in.

    **What this project delivers**
    - Carrier tracking events (API plus history export), EDI 940/945 documents, carrier rate cards and weekly diesel prices
      in the platform.
    - A freight audit model: every carrier bill line matched to a shipment and compared to what it should have cost.
    - A carrier performance model: on-time delivery, transit, exceptions and cost by carrier, service and lane.
    - Dashboards **P4-D1 Freight Audit** and **P4-D2 Carrier Scorecard**.

    **Why now:** carrier RFPs go out in Q1, and peak season is when billing errors pile up fastest. Carriers accept
    disputes only within a limited window after the invoice, so old errors are gone for good.

    **Sources:** the carrier tracking aggregator API, EDI 940/945 files from B2B clients, carrier rate-card workbooks in
    `landing/files/`, the EIA diesel price API, AX vendor invoices (from Project 3) and the WMS shipments you already have.

    **Success measures**
    - Every carrier bill line is matched, rated, and either accepted or disputable with evidence.
    - The Q1 RFP pack is built from P4-D2, with both on-time definitions clearly named.
    - Release **v0.4.0** tagged with CHANGELOG.
  dashboards: [P4-D1, P4-D2]

stories:
  # ---------------------------------------------------------------- S1
  - id: P4.S1
    summary: "Carrier tracking API ingestion: cursor, rate limits, late events and history backfill"
    type: Story
    reporter: beth.kowalczyk
    priority: Highest
    story_points: 13
    sprint: 1
    due_day: 6
    components: [Ingestion, Modeling]
    labels: [carrier-api, api, late-data, backfill]
    description: |
      Harborline subscribes to a tracking aggregator that returns every scan for every package across all carriers. Tomás
      Ortega set up the integration account; ask him about the API key and its limits.

      **What's known about the feed**
      - Cursor paging (`since` plus `cursor`, up to 500 events a page) and an API key in a header.
      - It throttles (429 with `Retry-After`) and has occasional 503s.
      - Events arrive late, out of order and sometimes twice; carriers also correct earlier statuses.
      - The API keeps only **90 days**. Older history is in a one-time export in `landing/files/carrier/history_export/`.
      - Volume: every shipped package (~2.5 M over 3 years on Large), each with several scans.

      **Definition of Done**
      - All sub-tasks done; full history (export plus API) in bronze with no gap or double count at the seam
      - Incremental ingestion runs on the schedule with retries and a persisted cursor
      - Package-level tracking model linked to WMS shipments, including reprinted labels
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Incremental ingestion with a persisted cursor; restarts resume with no gaps or duplicates"
      - "429s honour Retry-After and 503s are retried with backoff; no run fails on a single transient error"
      - "Duplicate, late and out-of-order events handled; the correct current status per package is derivable at any time"
      - "History export backfilled and stitched to API data with no gaps or overlaps (tested at the seam)"
      - "Event times normalized to UTC per the time standard (P2.S1.T5)"
      - "Package-level model linked to WMS shipments and cartons, including tracking numbers replaced by label reprints"
    depends_on: [P1.S5, P2.S2]
    tasks:
      - id: P4.S1.T1
        type: Task
        summary: "Explore the tracking API with Tomás and Beth"
        estimate_hours: 2
        due_day: 1
        priority: High
        components: [Ingestion, Documentation]
        labels: [carrier-api, stakeholder]
        description: |
          Put the API key (Control Center → Links) in your secret store and explore the API: event shape, statuses and
          exception codes, cursor behaviour and limits. Ask Tomás Ortega what he knows about the aggregator's quirks, and
          Beth Kowalczyk what each status means to her team.
        acceptance_criteria:
          - "API documented: endpoints, auth, paging, limits, event fields, status and exception codes"
          - "Questions and answers from Tomás and Beth recorded"
          - "Sample payloads saved, with no secrets in them"
          - &docs "Committed via PR (docs/DATA-<n>-… branch, Conventional Commit with the key) and linked from this ticket"
        depends_on: []
      - id: P4.S1.T2
        type: Task
        summary: "Incremental cursor-based ingestion"
        estimate_hours: 6
        due_day: 3
        priority: Highest
        components: [Ingestion]
        labels: [carrier-api, incremental]
        description: |
          Ingest new events on the schedule. Persist the cursor and `since` so a crash, a restart or a laptop that slept all
          weekend resumes exactly where it stopped. Within the 90-day retention, missing a weekend should never lose data.
        acceptance_criteria:
          - "Cursor and since state persisted and advanced only after a successful write"
          - "Exactly-once landing in bronze; re-runs don't duplicate"
          - "Catch-up after a multi-day gap tested"
          - "Throughput per run recorded"
          - &git "Merged via PR from a feat/DATA-<n>-… branch; Conventional Commits carry the key; PR self-review done; CI green"
        depends_on: [P4.S1.T1]
      - id: P4.S1.T3
        type: Task
        summary: "Throttling and transient errors"
        estimate_hours: 3
        due_day: 3
        priority: High
        components: [Ingestion]
        labels: [carrier-api, reliability, rate-limits]
        description: |
          The API allows about 120 requests a minute, answers 429 with `Retry-After` when you go over, and fails with a 503
          about 1% of the time. Be a good API citizen, and never lose a page.
        acceptance_criteria:
          - "Retry-After honoured; backoff with jitter on 503s"
          - "Request rate stays under the limit (measured)"
          - "Retries, throttles and failures counted per run and visible on P1-D1"
          - *git
        depends_on: [P4.S1.T1]
      - id: P4.S1.T4
        type: Task
        summary: "Late, duplicate and out-of-order events"
        estimate_hours: 5
        due_day: 5
        priority: Highest
        components: [Modeling]
        labels: [carrier-api, late-data, dedup]
        description: |
          Events arrive after later events, arrive twice, and carriers correct earlier statuses. Downstream needs both the
          full event history and a reliable current status per package, and on-time metrics must not change because a
          duplicate arrived.
        acceptance_criteria:
          - "Duplicates removed by a documented key"
          - "Event history ordered by event time, with arrival time kept"
          - "Current status per package correct after out-of-order and corrected events (tested)"
          - "Late events update downstream facts incrementally"
