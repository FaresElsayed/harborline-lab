        labels: [readout, release, level-5]
        description: |
          > "You get five minutes. How much can I claw back, which carrier should I worry about, and what would you do next?" (Beth)

          The worst carrier on cost and the worst on service may not be the same one. A big overbilled number means little if
          most of it is already outside the dispute window, and a carrier's bad lane may matter more or less than its average.
