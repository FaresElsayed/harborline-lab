  # ---------------------------------------------------------------- S4 (sprint 1)
  - id: P6.S4
    summary: "Late and out-of-order data, exactly-once, backfill and replay"
    type: Story
    reporter: luis.moreno
    priority: High
    story_points: 8
    sprint: 1
    due_day: 10
    components: [CDC, Data Quality]
    labels: [exactly-once, replay, late-data]
    description: |
      > "If the board ever shows a number that later changes for no reason, the GMs will stop looking at it." (Luis)

      Streaming systems redeliver, reorder and arrive late:
      - Changes can be redelivered after a crash.
      - WMS timestamps are local and set by the application, so they can disagree with commit order.
      - The simulator can dump late data.
      - One day you'll need to rebuild a table, or replay a window, without stopping the feed.

      **What good looks like**
      - Same input → same output, however many times it is delivered.
      - A written policy, agreed with Luis, on which time each live metric uses and how late is too late.
      - Backfill and replay procedures, tested and timed.
      - Daily evidence of exactly-once results.

      **Definition of Done**
      - All sub-tasks done; drills logged
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
      - Runbooks in the repo; CHANGELOG entry
    acceptance_criteria:
      - "Forced redelivery of an hour of changes leaves silver and gold identical"
      - "Late-data policy agreed and demonstrated with the late_data_dump scenario"
      - "Table rebuild and window replay both tested under load"
      - "Daily exactly-once reconciliation published on the Data Platform Health dashboard"
    depends_on: [P6.S2]
    tasks:
      - id: P6.S4.T1
        type: Task
        summary: "Idempotent processing end to end"
        estimate_hours: 4
        due_day: 9
        priority: High
        components: [CDC]
        labels: [idempotency]
        description: |
          Make every stage safe to re-run and safe to receive the same change twice. Prove it by forcing redelivery.
        acceptance_criteria:
          - "Forced redelivery of a 1-hour window produces identical silver and gold (checksums)"
          - "Deduplication keys documented"
          - *git
        depends_on: []
      - id: P6.S4.T2
        type: Task
        summary: "Late and out-of-order policy, agreed with Luis"
        estimate_hours: 5
        due_day: 9
        priority: High
        components: [CDC, Modeling]
        labels: [late-data, needs-clarification]
        description: |
          Decide with Luis which time each live metric uses (commit time or WMS local timestamps) and how late a change can
          arrive before a closed hour gets restated. Run the late_data_dump scenario and show that the numbers follow the policy.
        acceptance_criteria:
          - "Policy per metric agreed with Luis"
          - "late_data_dump: restatements happen only as the policy allows, and every one is logged"
          - *git
        depends_on: []
      - id: P6.S4.T3
        type: Task
        summary: "Backfill and replay runbook"
        estimate_hours: 5
        due_day: 10
        priority: High
        components: [CDC]
        labels: [replay, backfill, runbook]
        description: |
          Write two procedures. The first rebuilds one table's current state from a fresh snapshot while the stream keeps
          running. The second replays a time window from bronze into silver and gold. Test both.
        acceptance_criteria:
          - "Table rebuild under load ends with zero differences"
          - "Window replay reproduces previous results exactly"
          - "Runbook steps timed"
          - *git
        depends_on: [P6.S4.T1]
      - id: P6.S4.T4
        type: Task
        summary: "Daily exactly-once evidence"
        estimate_hours: 3
        due_day: 10
        priority: Medium
        components: [Data Quality]
        labels: [reconciliation]
        description: |
          Schedule a reconciliation that compares source and silver at a consistent point (counts and checksums per table)
          and publishes the result.
        acceptance_criteria:
          - "Runs daily; differences alert"
          - "Results visible on the Data Platform Health dashboard"
          - *git
        depends_on: [P6.S4.T1]
      - id: P6.S4.T5
        type: Task
        summary: "Keep deleted history (tombstones)"
        estimate_hours: 3
        due_day: 10
        priority: Medium
        components: [CDC, Modeling]
        labels: [deletes, audit]
        description: |
          Finance and Quality will ask about things that no longer exist in the WMS: billing records deleted before
          invoicing, voided labels, cancelled order lines. Keep deleted rows queryable, with when they were deleted and by which change.
        acceptance_criteria:
          - "Deleted rows queryable with their delete commit time"
          - "Alan Brooks can list billing records deleted since the feed went live"
          - *git
        depends_on: []
      - id: P6.S4.T6
        type: Task
        summary: "Peak drill: peak_surge at 60×"
        estimate_hours: 3
        due_day: 10
        priority: Medium
        components: [CDC]
        labels: [drill, performance]
        description: |
          Run the peak_surge scenario at 60× for an hour while the feed runs. Check lag, correctness and cost.
        acceptance_criteria:
          - "Lag stays ≤ 5 minutes, or any breach is documented with its cause"
          - "Zero reconciliation differences afterwards"
          - "Compute used recorded"
          - *git
        depends_on: [P6.S4.T1]

  # ---------------------------------------------------------------- S5
  - id: P6.S5
    summary: "Alerting and SLAs: freshness ≤ 5 minutes and replication slot health"
    type: Story
    reporter: luis.moreno
    priority: High
    story_points: 5
    sprint: 2
    due_day: 16
    components: [Observability]
    labels: [sla, alerting, on-call]
    description: |
      > "If the board is stale, I want to know before a GM tells me." (Luis)
      >
      > "And if your slot is falling behind, I want to know before my disk does." (Kevin)

      **Requirements**
      - SLO: board data ≤ 5 minutes behind the WMS (P95), measured end to end during each site's operating hours.
      - Nothing goes silently stale. A quiet table on a night shift is not the same as a stalled feed.
      - Slot health is watched from the server's side, with thresholds Kevin agrees.
      - Every alert has an owner, a severity and a runbook. You have no pager, so pick a free channel.
      - A weekly SLA report.

      **Definition of Done**
      - All sub-tasks done, including the incident and its postmortem
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
      - Alert catalog and runbooks in the repo; CHANGELOG entry
    acceptance_criteria:
      - "SLO document signed by Luis and Kevin"
      - "Freshness measured per table and tile, with heartbeats for quiet periods"
      - "Slot inactivity and retained-WAL alerts fire in a drill before Kevin's thresholds are reached"
      - "Fire drill run; weekly SLA report published"
    depends_on: [P6.S2, P1.S6]
    tasks:
      - id: P6.S5.T1
        type: Task
        summary: "Agree the SLO and alerting with Luis and Kevin"
        estimate_hours: 2
        due_day: 11
        priority: High
        components: [Observability]
        labels: [needs-clarification, sla]
        description: |
          Write the SLO: what is measured and where (source commit → board), when (operating hours per site; some sites run
          nights), the target, the error budget, and who gets alerted and how.
        acceptance_criteria:
          - "SLO document signed by Luis and Kevin"
          - "Alert channel configured and tested"
          - *docs
        depends_on: []
      - id: P6.S5.T2
        type: Bug
        reporter: kevin.ohara
        summary: "INCIDENT: replication slot left unconsumed over the weekend, disk alarm on the Postgres host"
        estimate_hours: 6
        due_day: 12
        priority: Highest
        components: [CDC, Platform]
        labels: [incident, cdc, postgres, postmortem]
        description: |
          **Reported Monday 07:45 by Kevin O'Hara (IT Infrastructure):**
          > "Docker Desktop threw a low-disk warning on Saturday night, and the Postgres volume is nearly full. pg_wal is
          > huge. The replication slot your pipeline owns has been inactive since Friday evening and has been holding WAL
          > all weekend while the simulator kept streaming. I haven't touched anything. I don't know if the slot is still
          > usable, or if dropping it loses your data. Please fix it today, and tell me how we stop this happening again."

          **Impact:** the source database is at risk. If the volume fills up, the WMS stops and every site stops shipping.
          The Live Operations Board has been stale since Friday.

          **Expected:** the server is safe, the feed is caught up with no lost or duplicated changes, and guardrails exist
          so this can't happen silently again.
        acceptance_criteria:
          - "Server made safe first: disk headroom restored with Kevin's agreement, with every action and its order logged"
          - "Feed restored: caught up if the slot survived, re-seeded with the backfill runbook if it was invalidated; reconciliation shows zero differences"
          - "Root cause: why consumption stopped and why nobody was alerted"
          - "Blameless postmortem (timeline, impact, root cause, what went well, action items with owners) in docs/postmortems/"
          - &fix "Fix merged via PR from a fix/DATA-<n>-… branch with a regression test; Conventional Commits carry the key; CI green"
        depends_on: [P6.S2]
      - id: P6.S5.T3
        type: Task
        summary: "End-to-end freshness monitoring with heartbeats"
        estimate_hours: 4
        due_day: 14
        priority: High
        components: [Observability]
        labels: [freshness, monitoring]
        description: |
          Measure freshness per table and per board tile, from source commit time to availability. Add heartbeats so quiet
          tables at night don't look stale and stalled feeds don't look healthy.
        acceptance_criteria:
          - "Freshness measured at least every 5 minutes per table and tile"
          - "Heartbeat proves liveness when there are no business changes"
          - "Alert when P95 > 5 minutes for 10 minutes during operating hours"
          - *git
        depends_on: [P6.S5.T1]
      - id: P6.S5.T4
        type: Task
        summary: "Replication slot lag and disk safety alerts"
        estimate_hours: 3
        due_day: 15
        priority: Highest
        components: [Observability, CDC]
        labels: [slots, alerting]
        description: |
          Watch the slot from the server's point of view: whether it's active, how much WAL it retains, its lag, and how
          close it is to the server's safety limits. Kevin wants hours of warning, not minutes.
        acceptance_criteria:
          - "Alerts on an inactive slot and on retained WAL above thresholds Kevin agrees"
          - "Drill: stop the consumer and show the alert fires before the threshold"
          - "Kevin's sign-off recorded"
          - *git
        depends_on: [P6.S5.T2]
      - id: P6.S5.T5
        type: Task
        summary: "Alert catalog, runbooks and fire drill"
        estimate_hours: 3
        due_day: 16
        priority: Medium
        components: [Observability]
        labels: [runbook, on-call]
        description: |
          Give every alert a severity, an owner and a runbook link. Then run a fire drill with an injected failure.
        acceptance_criteria:
          - "Alert catalog in the repo"
          - "Fire drill log with time to detect and time to resolve"
          - *git
        depends_on: [P6.S5.T3, P6.S5.T4]
      - id: P6.S5.T6
        type: Task
        summary: "Weekly SLA report"
        estimate_hours: 2
        due_day: 16
        priority: Low
        components: [Observability]
        labels: [sla, reporting]
        description: |
          Publish SLO attainment and incidents weekly to Luis, and show them on the Data Platform Health dashboard.
        acceptance_criteria:
          - "Weekly report generated automatically"
          - "Shows attainment against the 5-minute target per site, plus incidents"
          - *git
        depends_on: [P6.S5.T3]

  # ---------------------------------------------------------------- S6
  - id: P6.S6
    summary: "Live Operations Board dashboard + readout"
    type: Story
    reporter: luis.moreno
    priority: High
    story_points: 8
    sprint: 2
    due_day: 20
    components: [Dashboards]
    labels: [dashboards, brand-kit, readout, tv-mode]
    attachments: [wireframes/P6-D1.svg]
    description: |
      The spec is **P6-D1 Live Operations Board**, and the wireframe is attached. It runs on a TV in each site's shipping
      office and on Luis's phone.

      > "If I can't read it from the doorway, it's not a board." (Shanice)

      **Requirements**
      - KPIs, filters and visuals as specified. "Backlog" and "at risk" mean different things to Ops and to Client Success,
        so settle them and record them.
      - Refresh: data ≤ 5 minutes behind the WMS, the page auto-refreshes, and a freshness light turns amber or red on an SLA breach.
      - Access: GMs see their site and Luis sees all. No consumer names, addresses, phone numbers or emails, because it's on a wall.
      - Every interaction < 3 s. On Databricks Free Edition you have one 2X-Small warehouse: keeping it warm costs credits,
        and letting it auto-stop costs cold-start time. Document how you meet both "≤ 5 min" and "< 3 s".
      - Harborline brand kit from `brand/`: dark dashboard background for TV mode, Operations accent, palette and number formats.
      - 5-minute readout to Luis and Shanice, done live on the board.

      **Definition of Done**
      - All sub-tasks done, including the bug report
      - Dashboard definition committed; each sub-task merged through its own PR (Conventional Commits with the key, self-review, CI green)
      - Release **v0.6.0** tagged on `main` with CHANGELOG; 3-minute demo video linked in the README
    acceptance_criteria:
      - "Board matches the spec: every KPI has one agreed definition and a named owner in the metric catalog"
      - "Filters (site, client, order type, carrier mode) work; site defaults to the viewer's site"
      - "Refresh SLA ≤ 5 minutes met during a 2-hour soak at 60×; freshness light wired to the SLO monitor"
      - "Access: site-scoped for GMs, all sites for Luis; no consumer PII reachable from the board's datasets"
      - "P95 interaction < 3 s measured; warehouse cost per day documented"
      - "Brand kit applied, including TV mode at 1920×1080"
      - "5-minute readout delivered; feedback logged as new tickets"
      - "Release v0.6.0 tagged with CHANGELOG"
      - "Iris Novak's UAT sign-off recorded for P6-D1 before the readout"
    depends_on: [P6.S3, P6.S5, P2.S5, P2.S6]
    tasks:
      - id: P6.S6.T1
        type: Task
        summary: "Finalize the P6-D1 spec with Luis and Shanice"
        estimate_hours: 2
        due_day: 15
        priority: High
        components: [Dashboards]
        labels: [needs-clarification, definitions]
        description: |
          Walk through the spec. Settle the "backlog" and "at risk" definitions (Ops and Client Success disagree), and
          confirm the TV layout and which tiles a GM sees.
        acceptance_criteria:
          - "Spec updated with decisions and KPI owners"
          - "Metric catalog updated"
          - *docs
        depends_on: []
      - id: P6.S6.T2
        type: Task
        summary: "Serving layer and refresh design (fresh and fast on your tier)"
        estimate_hours: 5
        due_day: 16
        priority: High
        components: [Serving]
        labels: [performance, free-tier, finops]
        description: |
          Make the board both fresh (≤ 5 minutes) and fast (< 3 s) on your tier. Decide which tables serve the board, the
          refresh cadence, and the warehouse warm-up and auto-stop settings, and work out what each choice costs.
        acceptance_criteria:
          - "Design note with cost per day at 1× and 60×"
          - "Board queries hit serving tables only"
          - "P95 query < 3 s measured"
          - *git
        depends_on: [P6.S6.T1]
      - id: P6.S6.T3
        type: Task
        summary: "Build the Live Operations Board (P6-D1)"
        estimate_hours: 7
        due_day: 18
        priority: High
        components: [Dashboards]
        labels: [dashboards, brand-kit, tv-mode]
        description: |
          Build the board from the spec and wireframe with the brand kit: the dark template for TV mode and the Operations
          accent. Include a freshness light that turns amber or red when the SLO is breached.
        acceptance_criteria:
          - "All spec tiles present; site filter defaults to the viewer's site"
          - "Freshness light wired to the SLO monitor"
          - "TV mode readable from 3 m at 1920×1080"
          - *git
        depends_on: [P6.S6.T2]
      - id: P6.S6.T4
        type: Task
        summary: "Access rules and no PII on a wall display"
        estimate_hours: 2
        due_day: 18
        priority: High
        components: [Security, Dashboards]
        labels: [access, pii]
        description: |
          GMs see their site and Luis sees all of them. Nothing on the board may expose consumer names, addresses, phone
          numbers or emails.
        acceptance_criteria:
          - "Site-scoped access tested with two GM identities and Luis's"
          - "No ship_to_* column reachable from any dataset behind the board"
          - *git
        depends_on: [P6.S6.T3]
      - id: P6.S6.T5
        type: Bug
        reporter: shanice.carter
        summary: "Board shows cancelled orders as still PICKING"
        estimate_hours: 3
        due_day: 17
        priority: High
        components: [Streaming, CDC]
        labels: [bug, cdc, deletes]
        description: |
          **Reported by Shanice Carter (GM ATL1):**
          > "Three orders the client cancelled at 10:15 were still on the at-risk list at 11:00, showing PICKING. My leads
          > walked to the pick face for nothing. The WMS shows them cancelled, and the lines are gone."

          **Expected:** cancelled orders and deleted lines leave every open-order tile within 5 minutes.
        acceptance_criteria:
          - "Reproduced with a cancellation during streaming, or non-reproduction proven by a test"
          - "Root cause documented in the PR"
          - *fix
        depends_on: [P6.S3.T1]
      - id: P6.S6.T6
        type: Task
        summary: "Soak test at 60× with the board open"
        estimate_hours: 4
        due_day: 19
        priority: Medium
        components: [Serving, Observability]
        labels: [performance, soak-test]
        description: |
          Run the stream at 60× for at least 2 hours with the board open. Capture freshness, query times, failures and cost.
        acceptance_criteria:
          - "SLO met, or breaches explained"
          - "P95 < 3 s throughout"
          - "Cost of the soak recorded"
          - *git
        depends_on: [P6.S6.T3]
      - id: P6.S6.T7
        type: Task
        summary: "One-page board guide for GMs"
        estimate_hours: 2
        due_day: 19
        priority: Low
        components: [Documentation]
        labels: [documentation]
        description: |
          Explain how to read each tile, what "at risk" means, what the freshness light means, and who to call when it's red.
        acceptance_criteria:
          - "Guide reviewed by Shanice"
          - "Linked from the board"
          - *docs
        depends_on: [P6.S6.T3]
      - id: P6.S6.T8
        type: Task
        summary: "UAT sign-off from Iris Novak for P6-D1"
        estimate_hours: 4
        due_day: 20
        priority: Highest
        reporter: iris.novak
        components: [Dashboards, Data Quality]
        labels: [uat, sign-off, reconciliation]
        description: |
          Nothing goes to Luis and Shanice until Iris Novak (Business Performance Manager) has signed it off. She ties
          your numbers back to the source systems herself, checks every KPI against your metric catalog and the
          dashboard spec, and writes up numbered findings with a verdict.

          For each dashboard: stop the stream, refresh, download the source extract from the Control Center, and put
          a submission in `uat/<dashboard id>/round-1/` as the team page describes (Dashboard sign-off). Attach the
          package zip, the zipped submission and the extract to a chat with Iris (or ask her in your coding agent).
          Fix or answer every finding, and resubmit as round 2, 3 and so on until she signs off. Blockers and Majors
          must be fixed before the readout; Minors can become tickets if she agrees.

          The board never stops moving, so for UAT stop the stream, let the board catch up, and capture it with the sim
          clock in view. Iris compares the board with the source at that moment.
        acceptance_criteria:
          - "A submission for each dashboard: every page as PNG, CSV exports of the headline visuals and the end tables behind them, data-as-of and sim clock, a copy of the metric catalog, bridge.csv and the matching source extract"
          - "Iris's review report committed under uat/ for every round"
          - "No open Blocker or Major findings; agreed Minors ticketed"
          - "Verdict Signed off (or Signed off with conditions) for P6-D1"
        depends_on: [P6.S6.T4, P6.S6.T5, P6.S6.T6]
      - id: P6.S6.T9
        type: Task
        summary: "Readout, demo video and release v0.6.0"
        estimate_hours: 3
        due_day: 20
        priority: High
        components: [Documentation]
        labels: [readout, release]
        description: |
          Give a 5-minute readout to Luis and Shanice, live on the board with the stream at 60×. Record a 3-minute demo,
          tag the release, and hold a short retro.
        acceptance_criteria:
          - "Readout delivered with live data; feedback captured as new tickets"
          - "Demo video linked from the README"
          - "v0.6.0 tagged on main; CHANGELOG lists every ticket key in the release"
          - "Retro notes committed"
        depends_on: [P6.S6.T8]
