          - *git
        depends_on: []
      - id: P6.S3.T5
        type: Task
        summary: "Site-local time and DST across all sites"
        estimate_hours: 2
        due_day: 13
        priority: Medium
        components: [Streaming]
        labels: [time-zones, dst]
