        depends_on: []
      - id: P6.S3.T3
        type: Task
        summary: "Throughput and backlog by hour"
        estimate_hours: 4
        due_day: 13
        priority: Medium
        components: [Streaming, Modeling]
        labels: [streaming, throughput]
        description: |
          Show orders received, released and shipped per hour by site, backlog by status, and pick throughput over the last 60 minutes.
        acceptance_criteria:
          - "Hourly series per site in local time"
          - "Backlog matches the agreed KPI definition"
          - "Throughput for closed hours matches the batch results"
          - *git
        depends_on: [P6.S3.T1]
      - id: P6.S3.T4
        type: Task
        summary: "Dock and labor in motion"
        estimate_hours: 3
        due_day: 13
        priority: Medium
        components: [Streaming, Modeling]
        labels: [streaming, labor, dock]
        description: |
          Show inbound trailers that have arrived but aren't fully received, and open tasks by type and zone per site.
          Identify workers by username only. This ends up on a wall display.
        acceptance_criteria:
          - "Open receipts with dwell time"
          - "Open tasks by type and zone"
