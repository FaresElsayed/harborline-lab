# Project 1 - Data Platform Foundation (program weeks 1-4)
# Requester: Sam Okafor (Director of IT)
#
# Difficulty ramp. Every Story, Task, Spike and Bug in p01..p08 carries exactly one label, level-1 to level-5:
#   level-1  follow a clear instruction in one system; has a Where to start
#   level-2  build something small to a clear spec; has a Where to start
#   level-3  join systems and make a choice; the method is mostly yours
#   level-4  design something with trade-offs and failure modes (CDC, idempotency, late data); no Where to start
#   level-5  own an ambiguous business outcome end to end (security, stakeholders, readouts); no Where to start
# Average level never falls from one project to the next, or from sprint 1 to sprint 2 inside a project. Project 1 has
# no level-4 or level-5, Project 5 onward has no level-1. simulator/tests/test_tracker_catalog.py enforces all of it.
project: 1
epic:
  id: P1
  summary: "Data Platform Foundation: one trusted, cheap, boring platform for everything that follows"
  department: IT
  reporter: sam.okafor
  priority: Highest
  labels: [platform, foundation, dashboards]
  description: |
    **Sponsor:** Sam Okafor, Director of IT.

    > "Every department runs on its own exports. Marcus pulls a WMS CSV for Ops every Monday by hand, Finance rebuilds
    > the same numbers from AX in Excel every month-end, and Sales Ops keeps a third client list in Salesforce.
    > Nobody can tell me how many active clients we have." (Sam)

    Daniel Reyes has told the board that Harborline will have a single, trusted data platform by year-end. Three
    departments (Operations, Finance, Transportation) are queued behind it. This project is the foundation everything
    after it stands on, so Sam would rather it be boring and solid than clever.

    **How this project runs:** the first sprint is small, concrete steps (a first connection, a first table, a first
    number, a first pull request). The second sprint adds what keeps it running without you.

    **What this project delivers**
    - Your engineering setup and repository standards, so anyone who joins later works the same way.
    - A cloud data platform with separate dev and prod, secrets handled properly, and costs inside the free tier.
    - The WMS landed every day, starting with one table, and a first silver layer on top of it.
    - Every insert, update and delete captured, plus history the WMS itself throws away.
    - A data-quality framework that quarantines bad rows instead of hiding them.
    - Scheduled, retried, alerting pipelines, and CI on every pull request.
    - Dashboard **P1-D1 Data Platform Health**: can yesterday's data be trusted?

    **Constraints**
    - Sources are on-prem (your machine, behind Harborline's firewall). Kevin O'Hara will not open inbound ports.
    - Free tier first. Sam wants to hear about a paid limit before it is hit, not after.
    - Dataset: on Large about 3 years, ~2.5 M orders, ~7 M order lines and ~20 M inventory-ledger rows (Medium is 2 years and about 40% of that), plus a continuous
      stream of inserts, updates and deletes when the simulator is running.

    **Success measures**
    - Five consecutive scheduled runs land everything the WMS changed since the previous run, with no manual steps.
    - Every data-quality failure is recorded and visible on P1-D1.
    - Release **v0.1.0** tagged on `main` with a CHANGELOG and the ADRs that explain the platform.

    **Out of scope:** Finance, CRM and carrier pipelines (Projects 3-5), streaming CDC (Project 6).
  dashboards: [P1-D1]

stories:
  # ---------------------------------------------------------------- S1
  - id: P1.S1
    summary: "Workstation, first connection and first pull request"
    type: Story
    reporter: sam.okafor
    priority: Highest
    story_points: 5
    sprint: 1
    due_day: 3
    components: [CI/CD, Documentation]
    labels: [setup, git, standards, level-1]
    description: |
      Before anyone writes a pipeline, Sam wants the basics right: a working machine, a first query against the WMS, and
      a repository that enforces how the team works.

      > "The last contractor's scripts lived on a laptop with passwords in them. When he left, so did the pipelines.
      > That doesn't happen again." (Sam)

      The tickets here are small and in order. Do them one at a time, top to bottom.

      **Why now:** every later ticket assumes a branch per ticket, Conventional Commits with the ticket key, a PR with
      self-review and pre-commit secret scanning. Adding standards later costs ten times more.

      **Talk to:** Kevin O'Hara (machine, Docker, network) and Mei Tanaka (what counts as a secret and what must never be committed).

      **Where to start:** The **Getting Started** handbook page has the install steps, then take P1.S1.T1.

      **Definition of Done**
      - All sub-tasks done; your repository is on GitHub with `main` protected
      - At least one PR merged through the full flow: branch `feat/DATA-<n>-…` → Conventional Commits with the key → PR template → self-review → merge
      - The ADR template and CHANGELOG.md exist on `main`; the source inventory is linked from the README
    acceptance_criteria:
      - "The simulator runs on your machine with a Medium or Large build finished; the Control Center is reachable at http://localhost:8080"
      - "You can query wms, ax2012 and iot as etl_reader and call the mock Salesforce and carrier APIs"
      - "Your own GitHub repository exists with a protected main (PR required, no force-push, no deletion)"
      - "PR template, issue templates, CODEOWNERS and pre-commit (gitleaks, ruff, sqlfluff) are committed"
      - "A planted fake secret is blocked by pre-commit before it reaches a commit"
      - "A source inventory covers every Harborline source system"
    depends_on: []
    tasks:
      - id: P1.S1.T1
        type: Task
        summary: "Set up the workstation with the setup file"
        estimate_hours: 3
        due_day: 1
        priority: Highest
        components: [Platform]
        labels: [setup, level-1]
        description: |
          Run the setup file (SETUP-WINDOWS.cmd or SETUP-MAC.command) until it finishes with ALL DONE. It installs what's
          missing and skips the rest. If it stops, paste its report to Kevin O'Hara, do what he says and run it again.
          Note anything that went wrong or took longer than expected; Sam wants that feedback so the next hire's setup
          is faster.

          **Where to start:** Run the file from the folder you downloaded; Getting Started → *Run the setup file* says what each step does.
        acceptance_criteria:
          - "The setup file finishes with ALL DONE"
          - "Docker Desktop has at least the memory the handbook recommends"
          - "Git identity and SSH key work against GitHub; gh auth status is clean"
          - "Setup notes (time spent, gotchas) saved, to be committed once the repository exists"
        depends_on: []
      - id: P1.S1.T2
        type: Task
        summary: "Build the dataset and run your first query"
        estimate_hours: 2
        due_day: 1
        priority: Highest
        components: [Platform]
        labels: [setup, wms, level-1]
        description: |
          Start the simulator and run a Medium or Large build, if setup has not done it already (Medium is 2 years of history, Large 3; the Control Center shows an estimate).

          Then make your first connection: Postgres, database `wms`, as `etl_reader`, the same login your pipelines will use.
          Run one query and look at the result. Don't build anything yet.

          Finally, press **Generate batch** once in the Control Center and run the query again, so you see the source change
          underneath you.

          **Where to start:** Getting Started → *Try each source system* has the connection details and the query. Open it
          from the `Harborline WMS` connection in DBeaver. Stuck? Kevin O'Hara.
        acceptance_criteria:
          - "Build completed; size, build time and row counts per system recorded"
          - "DBeaver connected as etl_reader to the wms database"
          - "The first query in Getting Started returns one row per warehouse, with its time zone"
          - "After one Generate batch you can say how many orders were added"
        depends_on: [P1.S1.T1]
      - id: P1.S1.T3
        type: Task
        summary: "Finish your data repository and project skeleton"
        estimate_hours: 2
        due_day: 2
        priority: Highest
        components: [CI/CD]
        labels: [git, setup, level-1]
        description: |
          The setup file created `harborline-analytics` on your machine and on your GitHub account, with a starter
          README. The layout from here is your call, but someone new should understand it from the README in five
          minutes. The simulator is not part of this repo.

          CI will run on Linux, so line endings matter: read the `.gitattributes` it started you with.

          **Where to start:** `harborline-analytics` on your machine. Open its README first. Ask Nadia Petrov if you can't decide on a folder name.
        acceptance_criteria:
          - "Repository on your machine and on GitHub (nothing confidential in it)"
          - "README states purpose, layout, how to run, and links to this epic"
          - ".gitignore keeps .env files, local data and credentials out; .gitattributes normalizes line endings"
          - "Your first commit on the skeleton follows Conventional Commits and carries this ticket's key"
          - "Setup notes from P1.S1.T1 committed under docs/"
        depends_on: [P1.S1.T1]
      - id: P1.S1.T4
        type: Task
        summary: "Your first pull request: protect main and add templates"
        estimate_hours: 2
        due_day: 2
        priority: High
        components: [CI/CD]
        labels: [git, standards, level-1]
        description: |
          Sam's rule: nothing reaches `main` without a pull request, and every PR tells a reviewer what changed, why, how
          it was tested and what could break. You're the only engineer building this, so the first reviewer is you tomorrow
          morning; Nadia Petrov will look when you ask. The self-review checklist is not optional.

          The setup file started this: a ruleset on `main`, a PR template and a bug template. Check them against the
          criteria below and finish what's missing. Keep the change small: the point is to learn the full flow.

          **Where to start:** Getting Started → *Your own repository* has every command. The project brief's *Git and
          engineering standards* says why.
        acceptance_criteria:
          - "Branch protection or a ruleset on main requires a PR, blocks force-pushes and deletion"
          - "PR template covers summary, ticket link, testing evidence, data impact, rollback and a self-review checklist"
          - "Issue templates exist for bug, data request and spike"
          - "CODEOWNERS committed"
          - &git "Merged via PR from a feat/DATA-<n>-… branch; Conventional Commits carry the key; PR self-review done; checks green"
        depends_on: [P1.S1.T3]
      - id: P1.S1.T5
        type: Task
        summary: "Pre-commit hooks for secrets, Python and SQL"
        estimate_hours: 3
        due_day: 2
        priority: Highest
        components: [CI/CD, Security]
        labels: [git, security, lint, level-1]
        description: |
          The setup file installed pre-commit with gitleaks (secrets), ruff (Python lint and format) and sqlfluff (SQL
          lint). Prove it works. sqlfluff has a provisional dialect: revisit it after the platform decision (P1.S2.T1).

          Mei Tanaka's standard: a secret that reaches a remote is a security incident, even in a private repository.
          The same hooks will run in CI later (P1.S5), so nobody can skip them with `--no-verify`.

          **Where to start:** Run `pre-commit run --all-files` in your repository, then try committing a scratch file with a made-up key in it.
          Ask Mei Tanaka what she counts as a secret.
        acceptance_criteria:
          - "pre-commit config committed with gitleaks, ruff and sqlfluff; hook versions pinned"
          - "Hooks run on every commit on your machine"
          - "A fake credential in a scratch file is blocked; the test is described in the PR, not committed"
          - "README explains how to install the hooks"
          - *git
        depends_on: [P1.S1.T3]
      - id: P1.S1.T6
        type: Task
        summary: "Conventional Commits, CHANGELOG and release policy"
        estimate_hours: 2
        due_day: 3
        priority: Medium
        components: [CI/CD, Documentation]
        labels: [git, release, level-1]
        description: |
          Every project in this program ends with a release tag. Write down how versions are bumped and how the CHANGELOG is
          kept (by hand is fine). Commit messages carry the ticket key so anyone can trace a change back to the request that
          caused it.

          **Where to start:** Copy the rules from the project brief's *Commit messages* and *Releases, CHANGELOG and ADRs*
          into your own words. Nadia Petrov will read it if you ask.
        acceptance_criteria:
          - "CONTRIBUTING (or a README section) defines commit types, scopes, the ticket-key rule and branch naming"
          - "CHANGELOG.md exists with an Unreleased section"
          - "Release policy written down: one tag per project, v0.1.0 at the end of this project"
          - *git
        depends_on: [P1.S1.T3]
      - id: P1.S1.T7
        type: Task
        summary: "ADR template and index"
        estimate_hours: 2
        due_day: 3
        priority: Medium
        components: [Documentation]
        labels: [adr, docs, level-1]
        description: |
          > "Our last platform migration failed partly because nobody remembered why things were built the way they were." (Sam)

          Set up a lightweight Architecture Decision Record practice: a template and an index. You don't need to decide
          anything yet. ADR-0001 is your platform choice in the next story, and you'll write more in this project:
          connectivity, infrastructure as code, ingestion strategy, modeling tool and orchestration.

          **Where to start:** The project brief's *Releases, CHANGELOG and ADRs* lists what an ADR contains and where it lives.
        acceptance_criteria:
          - "ADR template (context, decision, alternatives, consequences, status) in docs/adr"
          - "ADR index linked from the README; status values defined (Proposed, Accepted, Superseded)"
          - &docs "Committed via PR (docs/DATA-<n>-… branch, Conventional Commit with the key) and linked from this ticket"
        depends_on: [P1.S1.T3]
      - id: P1.S1.T8
        type: Task
        summary: "Source-system inventory"
        estimate_hours: 5
        due_day: 3
        priority: Highest
        components: [Ingestion, Documentation]
        labels: [discovery, wms, ax2012, salesforce, iot, edi, files, stakeholder, level-2]
        description: |
          Before you design ingestion, know what you're ingesting. Connect once to each remaining source and write an
          inventory a new engineer could use: what each system is, who owns it, how to connect, the tables or objects that
          matter, approximate volumes, keys, which columns tell you a row changed, how deletes happen, time-zone and unit
          conventions, and what you still don't know.

          The owners know things the schema won't tell you. Ask them:
          - **Marcus Bell**: WMS (housekeeping jobs, how timestamps and deletes behave)
          - **Priya Raman**: AX 2012
          - **Dana Whitfield**: Salesforce
          - **Tomás Ortega**: EDI and the carrier tracking feed
          - **Grace Liu**: sensors (IoT)

          **Where to start:** Getting Started → *Try each source system* gets you connected; the Source systems handbook page
          has the behaviour reference and the data dictionary. Fill in the table from there, then ask about the gaps.
        acceptance_criteria:
          - "Connected once to each: ax2012 and iot as etl_reader, an OAuth token and one SOQL query on Salesforce, one page of carrier events, the landing folder"
          - "Inventory covers WMS, AX 2012, IoT, Salesforce, carrier API, EDI and the landing files"
          - "Every WMS table listed with row count, primary key, change-tracking column (or none) and delete behaviour"
          - "Cross-system keys identified (client, tracking number, client PO, worker) with known quality concerns"
          - "Open questions listed with whom you asked and what they said"
          - *docs
        depends_on: [P1.S1.T2, P1.S1.T3]

  # ---------------------------------------------------------------- S2
  - id: P1.S2
    summary: "Cloud platform and environments"
    type: Story
    reporter: sam.okafor
    priority: Highest
    story_points: 8
    sprint: 1
    due_day: 6
    components: [Platform, Security]
    labels: [cloud, environments, security, finops, level-2]
    description: |
      Harborline needs a home for its data. Sam has no budget for a paid platform this year, so start from a free tier:
      **Databricks Free Edition** or a **Snowflake trial**. The trial ends after 30 days, so plan for day 31. Pick one,
      justify it, and set it up with separate dev and prod and no shared passwords. Keep a list of what you create; it
      goes into code in P1.S5.

      **Constraints**
      - Free-tier limits are real. Databricks Free Edition is serverless-only, with one small SQL warehouse, a cap on
        concurrent job tasks and daily usage quotas. A Snowflake trial has a credit cap and an end date. Know the limits
        and design within them.
      - The sources are on-prem, and Kevin O'Hara won't open inbound firewall ports, so the cloud cannot pull from
        Postgres directly.
      - Mei Tanaka owns security policy. Ask her what she expects for secrets, access and consumer PII: ship-to names,
        addresses, phone numbers and e-mail addresses live in the WMS.

      **Why now:** every later story deploys into this.

      **Where to start:** Getting Started → *Your cloud platform*, then P1.S2.T1.

      **Definition of Done**
      - All sub-tasks done; ADRs for platform and connectivity accepted and merged
      - gitleaks is clean on the full git history
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, checks green)
    acceptance_criteria:
      - "Platform chosen in an accepted ADR comparing at least two options on cost, limits, features needed through Project 8, and exit plan"
      - "Separate dev and prod environments with documented naming conventions and access"
      - "Secrets live in a secret store or untracked local config, never in the repository"
      - "Cost guardrails configured and documented, including what happens when a free-tier quota is hit"
      - "The path from on-prem sources to the cloud is documented and respects the no-inbound-ports rule"
    depends_on: [P1.S1]
    tasks:
      - id: P1.S2.T1
        type: Spike
        summary: "Spike: Databricks Free Edition vs Snowflake trial"
        estimate_hours: 4
        due_day: 4
        priority: Highest
        components: [Platform, Documentation]
        labels: [spike, adr, cloud, level-2]
        description: |
          Time-box: 4 hours. Compare the options for Harborline's whole roadmap, not just this month. Later projects need
          API ingestion, near-real-time CDC (Project 6, five-minute freshness), row-level security and PII masking
          (Project 8) and dashboards. Include what breaks when the trial or quota runs out, and how you'd move off the platform.

          Sam doesn't care which one you pick. He cares that you can defend it.

          **Where to start:** Answer the questions in Getting Started → *Decide, with reasons*, one row per option. That table is most of the ADR.
        acceptance_criteria:
          - "ADR-0001 (platform choice) with options, criteria, decision and consequences"
          - "Free-tier limits that affect the design listed, with links to the official documentation"
          - "Decision names the dashboard tool you'll use (platform-native, Power BI Desktop or Streamlit) and why"
          - "Time spent logged; no more than the time-box"
          - *docs
        depends_on: [P1.S1.T8]
      - id: P1.S2.T2
        type: Task
        summary: "Provision dev and prod environments"
        estimate_hours: 4
        due_day: 4
        priority: Highest
        components: [Platform]
        labels: [cloud, environments, level-2]
        description: |
          Create the account or workspace and the structures for two environments. You must be able to break dev with
          no risk to prod, and prod should change only through a merged PR (fully enforced once CD exists in P1.S5).
          Anyone reading an object name should know its environment and its layer (bronze, silver or gold).

          Creating these by hand is fine for now, as long as you write down what you made. They go into code in P1.S5.T8.

          **Where to start:** The project brief's *Environments and infrastructure*, then your platform's own quick-start.
        acceptance_criteria:
          - "dev and prod separated (catalogs, databases or schemas; your design, documented)"
          - "Naming conventions for environments, layers, objects and service identities written down"
          - "A non-personal identity (service principal or service user) runs pipelines, separate from your login"
          - "Your personal login cannot write to prod outside the deployment path, or the free-tier gap is documented"
          - "A list of every object you created by hand is committed"
          - *git
        depends_on: [P1.S2.T1]
      - id: P1.S2.T3
        type: Task
        summary: "Secrets management"
        estimate_hours: 3
        due_day: 5
        priority: Highest
        components: [Security, Platform]
        labels: [security, secrets, level-2]
        description: |
          Pipelines need the Postgres `etl_reader` password, the Salesforce client secret, the carrier API key and, if you take
          Project 4's stretch comparison, an EIA API key. Decide where secrets live on your machine and on the platform, how code reads them, and how
          you'd rotate one. Check Mei Tanaka's expectations first. She is strict and she will ask.

          **Where to start:** Start with one secret, the `etl_reader` password: put it in `.env` (already ignored) and read it from code. The
          project brief's *Secrets and personal data* has the rules; your platform's docs have its secret store.
        acceptance_criteria:
          - "No secret in code, notebooks, config or git history (gitleaks run on the full history)"
          - "Local secrets kept in an untracked file or the OS credential store, documented in the README"
          - "Platform-side secrets kept in the platform's secret mechanism"
          - "Rotation drill done for one secret you control and written up in docs/runbook.md (start the file now; P1.S5.T7 finishes it)"
          - *git
        depends_on: [P1.S2.T2]
      - id: P1.S2.T4
        type: Task
        summary: "Decide how on-prem data reaches the cloud"
        estimate_hours: 3
        due_day: 5
        priority: Highest
        components: [Platform, Security, Documentation]
        labels: [adr, connectivity, security, level-3]
        description: |
          The sources sit on-prem: Postgres in Docker, a folder of landing files and two APIs. Kevin O'Hara's rule is no
          inbound ports from the internet, so the cloud platform can't connect to Postgres directly. Decide how data
          leaves the building, what runs where, what crosses the wire and how it's protected in transit.

          Kevin and Mei both want to read this one.
        acceptance_criteria:
          - "ADR (connectivity and data movement) accepted, with a simple diagram"
          - "States what runs on-prem and what runs in the cloud, and how each source's data moves"
          - "Covers encryption in transit and where each credential is used"
          - "Lists the consumer-PII columns that would leave the building and records Mei Tanaka's answer on how to handle them"
          - *docs
        depends_on: [P1.S2.T1]
      - id: P1.S2.T5
        type: Task
        summary: "Cost guardrails for the free tier"
        estimate_hours: 3
        due_day: 6
        priority: High
        components: [Platform]
        labels: [finops, cloud, level-2]
        description: |
          > "Keep it cheap, and never surprise me." (Sam)

          Find out what costs money or consumes quota on your platform. Put guardrails in place: auto-stop or suspend,
          small compute sizes, quotas or resource monitors, and budget alerts where the platform allows them. Document
          what happens when a limit is hit, including how long you're blocked. These numbers feed the cost panel on P1-D1.

          **Where to start:** Your platform's docs page on auto-stop or auto-suspend, then its page on quotas or resource monitors. The free-tier
          limits you listed in P1.S2.T1 are the checklist.
        acceptance_criteria:
          - "Every compute resource auto-stops or suspends within minutes of going idle"
          - "A budget or quota alert, resource monitor or documented free-tier equivalent exists"
          - "Free-tier quotas and what happens when each is exceeded documented in docs/runbook.md"
          - "Baseline usage for one day of development recorded"
          - *git
        depends_on: [P1.S2.T2]

  # ---------------------------------------------------------------- S3
  - id: P1.S3
    summary: "First WMS tables: a landed table, a first number, then every table and a first silver layer"
    type: Story
    reporter: sam.okafor
    priority: Highest
    story_points: 13
    sprint: 1
    due_day: 10
    components: [Ingestion]
    labels: [wms, incremental, backfill, silver, time-zones, units, level-2]
    description: |
      Time to put real data in the platform, one small step at a time. Land the smallest WMS table, then see a number you
      can check against the source. Then widen: every WMS table, a daily incremental load and a first silver layer, so
      no department has to touch raw bronze data.

      Marcus Bell can't change the WMS schema, and IT won't add triggers to it. The WMS has harder habits too: `order_line`
      has no audit timestamp, rows are physically deleted and a nightly job purges old tasks. Those wait for P1.S4. Note
      them, but don't solve them here.

      **Constraints**
      - Read-only access as `etl_reader`. For now Sam wants reliable batch loads; streaming CDC is planned for Project 6.
      - The WMS is a production system in the daytime, so keep the extract load modest.
      - Volume on Large: ~2.5 M orders, ~7 M lines and ~20 M `inventory_txn` rows over 3 years (Medium is about 40% of that over 2 years).

      **Where to start:** P1.S3.T1, one table, and the connectivity ADR you just wrote.

      **Definition of Done**
      - All sub-tasks done; the ingestion-strategy and modeling-tool ADRs are accepted
      - All 28 WMS tables land in bronze with load metadata; the full backfill is complete
      - Silver models for the WMS have tests
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, checks green)
    acceptance_criteria:
      - "A first table and a first number in the platform, checked against the source"
      - "Every WMS table lands in bronze with batch id, extract window and source row counts"
      - "Each table has a documented load strategy (full, incremental, append-only or snapshot comparison) and the reason"
      - "Tables with mod_ts load incrementally; re-running a load creates no duplicates"
      - "Full backfill completed within free-tier limits, with its duration documented"
      - "Layer conventions (bronze, silver, gold) documented: what each guarantees and who may read it"
      - "Silver WMS models are typed, one current row per business key, with UTC and local timestamps and canonical units"
    depends_on: [P1.S2]
    tasks:
      - id: P1.S3.T1
        type: Task
        summary: "Land your first table: wms.warehouse"
        estimate_hours: 3
        due_day: 6
        priority: Highest
        components: [Ingestion]
        labels: [wms, first-load, level-1]
        description: |
          Copy one table from the WMS to your dev environment, by the route your connectivity ADR describes. `warehouse` is
          the right first table: one row per site, no consumer data, nothing to get wrong. Copy the whole table, every time.
          Don't build a framework yet. A short script is fine.

          **Where to start:** Run `SELECT * FROM wms.warehouse` in DBeaver and note the row count. Write the script that lands
          those rows in dev bronze, reading the password from where you put it in P1.S2.T3. Stuck? Nadia Petrov.
        acceptance_criteria:
          - "wms.warehouse is in dev bronze with every source column and a load timestamp"
          - "Row count in the platform equals the row count in the WMS"
          - "Running the script twice leaves the same rows, not double"
          - *git
        depends_on: [P1.S2.T2, P1.S2.T3]
      - id: P1.S3.T2
        type: Task
        summary: "Your first number: orders per site"
        estimate_hours: 3
        due_day: 7
        priority: Highest
        components: [Ingestion, Dashboards]
        labels: [wms, first-number, level-1]
        description: |
          Sam's first question of any platform is whether its numbers are right. Land `order_header` in dev bronze, leaving out
          every `ship_to_*` column, and join it to the `warehouse` table you landed. Show one number per site, orders received
          in the last 30 days, in the dashboard tool you named in ADR-0001 (a saved query with a simple chart counts). Then
          check it against the source.

          **Where to start:** The first query in Getting Started → *Try each source system* is nearly this one. Run it in
          DBeaver with a date filter, stop the stream so the source holds still, and keep that result to compare against.
        acceptance_criteria:
          - "Orders received per site, last 30 days, shown in your dashboard tool"
          - "Every site's number equals the same query run against the WMS"
          - "No ship_to column in the platform; a screenshot with both results is in the PR"
          - *git
        depends_on: [P1.S3.T1]
      - id: P1.S3.T3
        type: Task
        summary: "Add tables by configuration: a config-driven extract"
        estimate_hours: 6
        due_day: 7
        priority: Highest
        components: [Ingestion]
        labels: [wms, framework, level-2]
        description: |
          Your first script copied one table. Turn it into something that copies any table, so adding a table is a line of
          configuration, not code. Every batch must be traceable: which run produced it, when, how many rows the source had
          and how many arrived. Full copies are fine for now.

          **Where to start:** A YAML file in the repository with one entry per table (name, schema, load mode) and your P1.S3.T1
          script reading it. Get `warehouse` and `owner` working before adding more.
        acceptance_criteria:
          - "Tables and their load mode driven by configuration in the repository"
          - "Each batch carries run id, extract window and row counts and lands in bronze unchanged (append-only)"
          - "Source and landed row counts reconciled per table per run; a mismatch fails the run"
          - "Extract time for one day of full volume documented"
          - "Credentials read from the secret mechanism set up in P1.S2.T3"
          - *git
        depends_on: [P1.S3.T1, P1.S2.T4]
      - id: P1.S3.T4
        type: Task
        summary: "Backfill the full WMS history"
        estimate_hours: 3
        due_day: 8
        priority: High
        components: [Ingestion, Platform]
        labels: [wms, backfill, finops, level-2]
        description: |
          Run the initial full load of the full dataset into prod, and a smaller slice into dev. Watch the free-tier
          limits: a careless backfill can burn a day's quota or a big share of the trial credits. Record how long it took
          and what it consumed. Sam will ask.

          **Where to start:** List your tables by size first (your inventory has the counts) and load small to large, so a mistake is cheap. Note
          your quota before and after.
        acceptance_criteria:
          - "Full backfill in prod; source and landed counts reconciled for every table"
          - "Duration, data volume and compute or credits used recorded in the runbook"
          - "dev holds a documented subset that is enough for development and CI"
          - "A failed backfill restarts from where it stopped"
          - *git
        depends_on: [P1.S3.T3]
      - id: P1.S3.T5
        type: Task
        summary: "Ingestion strategy per WMS table (ADR)"
        estimate_hours: 4
        due_day: 8
        priority: Highest
        components: [Ingestion, Documentation]
        labels: [wms, adr, level-3]
        description: |
          You've now seen every WMS table in your own platform. For each one, decide how you'll detect new, changed and deleted
          rows, how often, and at what extract cost. The next tickets and P1.S4 implement this. Use what you learned in
          discovery. Ask Marcus Bell anything you're unsure of: whether `mod_ts` is always set on update, when housekeeping
          runs, which tables are append-only.
        acceptance_criteria:
          - "Per-table matrix: grain, primary key, change signal, delete behaviour, strategy, frequency, expected daily volume"
          - "ADR (ingestion strategy) accepted, including why not streaming CDC yet"
          - "Edge cases listed: local-time watermarks across DST, late-committing transactions, warehouses in different time zones"
          - *docs
        depends_on: [P1.S1.T8, P1.S2.T4, P1.S3.T4]
      - id: P1.S3.T6
        type: Task
        summary: "Incremental loads for tables with audit timestamps"
        estimate_hours: 5
        due_day: 9
        priority: Highest
        components: [Ingestion]
        labels: [wms, incremental, level-2]
        description: |
          Most WMS tables carry `mod_ts`, which is local warehouse time and set by the application. Load only what changed
          since the last successful run, without re-reading the world every time. Watermarks must survive restarts and failed
          runs.

          **Where to start:** One table, `owner`. Keep the highest `mod_ts` you loaded, per table, and next time read a little
          before it (an overlap window) so late-committing rows aren't missed, then drop what you've already seen.
        acceptance_criteria:
          - "Watermark state persisted per table and advanced only after a successful load"
          - "No missed updates when a simulator batch and an extract overlap in time (tested)"
          - "Behaviour across a DST change documented"
          - "Re-running the same window creates no duplicates"
          - "A column added by a WMS release (see sys_release) doesn't break the load and is reported"
          - *git
        depends_on: [P1.S3.T3, P1.S3.T5]
      - id: P1.S3.T7
        type: Task
        summary: "Daily snapshots of AX customers and Salesforce accounts for the client crosswalk"
        estimate_hours: 3
        due_day: 9
        priority: Medium
        components: [Ingestion]
        labels: [ax2012, salesforce, crosswalk, level-2]
        description: |
          Every later project joins clients across three systems: WMS `owner.owner_code`, AX `custtable.accountnum` (the
          name lives in `dirpartytable`) and the Salesforce `Account` (`WMS_Owner_Code__c`, `ERP_Account_Number__c`).
          The full AX and Salesforce pipelines come in Project 3. For now, land a small daily snapshot of just these
          customer and account records so the platform can check the crosswalk (P1.S4.T6).

          Dana Whitfield can tell you about Salesforce API limits; Priya Raman about AX customers in the three legal entities.

          **Where to start:** Getting Started → *Try each source system* has both the AX customer query and the Salesforce token and SOQL call.
          Point them at bronze, once a day, as a new dated snapshot each time.
        acceptance_criteria:
          - "Daily full snapshot of AX customers (all three legal entities, with party names) and Salesforce Accounts in bronze"
          - "Salesforce access uses OAuth client credentials and follows pagination to the end"
          - "Snapshot history kept so day-to-day changes can be compared"
          - *git
        depends_on: [P1.S3.T3]
      - id: P1.S3.T8
        type: Task
        summary: "Layer conventions and modeling tool (ADR)"
        estimate_hours: 3
        due_day: 9
        priority: Highest
        components: [Modeling, Documentation]
        labels: [adr, conventions, level-2]
        description: |
          Choose the modeling tool (dbt Core, platform-native SQL or pipelines, or something else) and decide how bronze,
          silver and gold are laid out, named and tested. Remember the free-tier limits, and that every later project
          inherits this choice.

          **Where to start:** If you have no reason to choose otherwise, dbt Core is a safe default. Read the project brief's *Environments and
          infrastructure*, then write the ADR. Nadia Petrov reviews it.
        acceptance_criteria:
          - "ADR (modeling tool and layers) accepted"
          - "Naming, materialization and testing conventions documented"
          - "Repository structure matches the ADR"
          - *docs
        depends_on: [P1.S2.T1]
      - id: P1.S3.T9
        type: Task
        summary: "First silver models for the WMS"
        estimate_hours: 7
        due_day: 10
        priority: Highest
        components: [Modeling]
        labels: [wms, silver, time-zones, level-3]
        description: |
          Build silver for every WMS table Ops and Finance will use: one current row per business key, types enforced. All WMS
          times are local to the row's warehouse (`warehouse.time_zone`), and downstream needs both UTC and local. Child tables
          with no warehouse column still need a time zone.

          Deleted rows come in P1.S4, so leave room for a deleted flag and a detected-at time.
        acceptance_criteria:
          - "Silver models for all WMS tables, with primary-key uniqueness and not-null tests"
          - "Every timestamp available in UTC and local time, correct across DST transitions (tested on a fall-back night)"
          - "Incremental where it pays off; full rebuild time documented"
          - *git
        depends_on: [P1.S3.T8, P1.S3.T4]
      - id: P1.S3.T10
        type: Task
        summary: "Normalize units of measure"
        estimate_hours: 3
        due_day: 10
        priority: High
        components: [Modeling, Data Quality]
        labels: [wms, units, level-2]
        description: |
          US sites record weights and dimensions in LB and IN; TOR1 and MTY1 use KG and CM. The unit is stored per row
          (`weight_uom`, `dim_uom`), and some rows are wrong. Finance and Transportation will add weights across sites,
          so silver must offer canonical units without losing the original values.

          **Where to start:** `wms.material`, and a `GROUP BY` of its units per site, to see what's there.
        acceptance_criteria:
          - "Canonical weight and dimension columns sit alongside the source values and units"
          - "Rows whose unit is implausible for their site or magnitude are flagged, ready to become a rule in P1.S4.T5"
          - "Canonical unit choice documented"
          - *git
        depends_on: [P1.S3.T9]

  # ---------------------------------------------------------------- S4
  - id: P1.S4
    summary: "Every change captured, and data quality you can see"
    type: Story
    reporter: sam.okafor
    priority: Highest
    story_points: 13
    sprint: 2
    due_day: 14
    components: [Modeling, Data Quality]
    labels: [wms, incremental, deletes, retention, dq, quarantine, level-3]
    description: |
      The first sprint landed what the WMS shows today. Now capture what it hides.

      **What makes the WMS hard** (from your inventory and Marcus Bell)
      - `order_line` has no audit timestamp at all.
      - Rows are physically deleted: inventory at zero quantity, cancelled order lines, abandoned draft orders, voided
        labels (`shipment_carton`), `billing_record` corrections before invoicing, ASNs cancelled before arrival, SKUs
        created in error.
      - A nightly housekeeping job deletes `task` rows older than 180 days. Ops will want labor history older than that.

      Just as important: when data is wrong, Sam wants to **see** it, not have it silently dropped or silently passed
      through. The simulator injects realistic defects (orphans, duplicates, negative quantities, sentinel dates, unit
      mix-ups, whitespace in keys, mojibake and more) at about 1 in 10,000 records per category by default. Your
      framework should catch them, quarantine what's unusable and record every result.

      **Why now:** Project 2 (Operations) builds on silver in two weeks.

      **Definition of Done**
      - All sub-tasks done
      - Inserts, updates and deletes from a simulator batch are reflected after the next load, proven by a reconciliation
      - The DQ results table is populated on every run
      - DQ precision and recall measured once against the simulator's answer key, recorded in the PR
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, checks green)
    acceptance_criteria:
      - "Updates are captured for order_line, including quantity changes"
      - "Hard deletes are detected for every table that deletes, with the time the deletion was detected"
      - "Task history older than 180 days survives the purge, and purges are distinguishable from cancellations"
      - "DQ rules declared as configuration with severity; every run records rule, table, rows checked, rows failed and sample keys"
      - "Rows failing error-level rules are quarantined with a reason and excluded from silver; warnings pass with a flag"
      - "Quarantined rows can be re-processed after a fix without a full reload"
      - "Cross-system client key match rate measured daily"
      - "DQ precision and recall measured against the simulator answer key"
    depends_on: [P1.S3]
    tasks:
      - id: P1.S4.T1
        type: Task
        summary: "Capture changes to order_line, which has no audit timestamp"
        estimate_hours: 5
        due_day: 11
        priority: Highest
        components: [Ingestion]
        labels: [wms, incremental, deletes, level-3]
        description: |
          `order_line` has no `mod_ts`, yet its allocated, picked and shipped quantities and its status change all day,
          and cancelled lines are deleted. Ops' fill rate and Finance's billing both depend on it being right.

          Reflect every change within one load cycle at full volume (~7 M lines on Large) without copying the whole table on
          every run, or justify a full copy with measured numbers.
        acceptance_criteria:
          - "Inserted, updated and deleted lines appear in bronze after the next load"
          - "Changed-line counts match the simulator's change summary for order_line after a batch"
          - "Run time and data volume per load documented for your build size"
          - "Approach and trade-offs recorded in the ingestion ADR"
          - *git
        depends_on: [P1.S3.T3, P1.S3.T5]
      - id: P1.S4.T2
        type: Task
        summary: "Detect hard deletes, and keep task history beyond the 180-day purge"
        estimate_hours: 6
        due_day: 12
        priority: Highest
        components: [Ingestion]
        labels: [wms, deletes, retention, level-3]
        description: |
          Several WMS tables delete rows physically: `inventory` (zero quantity), `order_header` (abandoned draft orders),
          `order_line` (cancelled), `shipment_carton` (voided labels), `billing_record` (pre-invoice corrections),
          `asn_header` and `asn_line` (cancelled before arrival), `material` (SKUs created in error) and `task` (purge). The
          list may not be complete; Marcus Bell would know. Downstream needs to know a row is gone, and when you noticed.

          `task` needs extra care. The WMS deletes rows older than 180 days every night, and Luis Moreno's team will want labor
          productivity history in Project 2. Keep tasks after the WMS forgets them, and never mistake a purge for a
          cancellation. Ask Marcus when the purge runs and exactly what it removes.
        acceptance_criteria:
          - "Every deleting table has delete detection; deleted rows are flagged in bronze and silver, not removed, with a detected-at time"
          - "Delete counts per table per run are recorded (they appear on P1-D1)"
          - "Detected deletes reconcile with the simulator's delete counts per table after a batch"
          - "Rows missing because of a partial or failed extract can never be recorded as deletes"
          - "Purged tasks remain in your history with their final state, classified separately from operational deletes"
          - "Documented how much task history existed at your first load, and what is lost for good"
          - *git
        depends_on: [P1.S3.T3, P1.S3.T5]
      - id: P1.S4.T3
        type: Task
        summary: "Data-quality framework and results table"
        estimate_hours: 6
        due_day: 12
        priority: Highest
        components: [Data Quality]
        labels: [dq, framework, level-3]
        description: |
          Build or adopt a DQ framework where rules are declared, not hand-coded per table, and every evaluation is
          recorded. Sam wants to answer "what failed last night, how badly, and since when?" from one table.

          Severity matters: some failures should stop a load, most should not.
        acceptance_criteria:
          - "Rules declared in configuration with name, table, severity (error or warn), owner and description"
          - "Results table holds run id, rule, table, rows checked, rows failed, failure rate and sample keys (no PII values)"
          - "Error-level failures can block promotion to silver; warn-level failures cannot"
          - "Result history kept so trends can be charted on P1-D1"
          - *git
        depends_on: [P1.S3.T8]
      - id: P1.S4.T4
        type: Task
        summary: "Quarantine and re-processing"
        estimate_hours: 4
        due_day: 13
        priority: High
        components: [Data Quality]
        labels: [dq, quarantine, level-3]
        description: |
          Rows that fail error-level rules must not reach silver, and must not disappear either. They go somewhere visible
          with a reason, someone fixes the cause (or the rule), and the rows flow on without reloading everything.
        acceptance_criteria:
          - "Quarantine holds each failed row with rule, reason and run id"
          - "Silver excludes quarantined rows"
          - "Re-processing after a rule change or source fix documented and tested"
          - "Quarantine volume per table available for P1-D1"
          - *git
        depends_on: [P1.S4.T3]
      - id: P1.S4.T5
        type: Task
        summary: "Data-quality rules for the WMS"
        estimate_hours: 4
        due_day: 13
        priority: High
        components: [Data Quality]
        labels: [dq, wms, level-2]
        description: |
          Write the rules that matter for WMS data. The simulator's defect categories (Control Center → DQ) are a starting
          list, but think like Ops and Finance: what would make a number on a dashboard wrong? Check with Marcus Bell which
          defects are plausible in the real WMS and who should own each rule.

          **Where to start:** Control Center → DQ lists the defect categories. Write one rule per bullet in the criteria below, then check with
          Marcus Bell which defects are plausible in the real WMS.
        acceptance_criteria:
          - "Rules cover orphan references, duplicate business keys, missing required values, negative quantities, shipped more than ordered, sentinel and future dates, key whitespace and case, header vs line totals, and unit plausibility"
          - "Each rule has a severity and an owner"
          - "Rules run on every load and write to the results table"
          - *git
        depends_on: [P1.S4.T3, P1.S3.T9]
      - id: P1.S4.T6
        type: Task
        summary: "Cross-system client key check"
        estimate_hours: 3
        due_day: 14
        priority: High
        components: [Data Quality]
        labels: [dq, crosswalk, ax2012, salesforce, wms, level-3]
        description: |
          Finance, Sales and Ops each keep their own client list. Before Finance starts relying on the joins in Project 3,
          Sam wants to know how trustworthy they are. Using the snapshots from P1.S3.T7, measure how well WMS owners, AX
          customers and Salesforce accounts line up.

          Dana Whitfield owns Salesforce data entry; Priya Raman owns AX customer setup; Marcus Bell owns the WMS owner table.
        acceptance_criteria:
          - "Daily match rate WMS↔AX and WMS↔Salesforce, by legal entity"
          - "Every unmatched or ambiguous client listed with a reason category"
          - "Findings shared with the owners; who you told and what they said recorded"
          - "Check runs daily and feeds P1-D1"
          - *git
        depends_on: [P1.S3.T7, P1.S4.T3]
      - id: P1.S4.T7
        type: Task
        summary: "Measure DQ precision and recall against the answer key"
        estimate_hours: 2
        due_day: 14
        priority: Medium
        components: [Data Quality]
        labels: [dq, answer-key, level-2]
        description: |
          The simulator logs every defect it injects. Once your rules are in place (not before; it's an honor system), run
          the scoring script described on the answer-key handbook page and see what you caught, what you missed and what
          you flagged wrongly. This is how you calibrate rules instead of guessing.

          **Where to start:** The answer-key handbook page has the scoring command. Score, read the misses, change one rule, score again.
        acceptance_criteria:
          - "Precision and recall per defect category recorded in the PR description"
          - "At least one rule improved because of a miss or a false positive"
          - "Categories you deliberately don't catch yet listed with the reason"
          - *git
        depends_on: [P1.S4.T5]

  # ---------------------------------------------------------------- S5
  - id: P1.S5
    summary: "Orchestration and CI/CD"
    type: Story
    reporter: sam.okafor
    priority: High
    story_points: 8
    sprint: 2
    due_day: 18
    components: [Orchestration, CI/CD]
    labels: [orchestration, ci, cd, alerting, reliability, iac, level-3]
    description: |
      > "Right now the pipeline runs when you run it. I need it to run when nobody's watching, recover by itself when
      > something blips, and tell IT when it can't." (Sam)

      Sam also needs every change checked before it reaches prod, and everything you created by hand back in code.

      **Requirements from IT**
      - A scheduled daily run end to end (extract → bronze → silver → DQ), plus an on-demand run.
      - Transient failures (network, API throttling, warehouse resume) retry. Real failures alert.
      - Alerts go to IT (Sam and Kevin O'Hara); agree the channel with Kevin. An alert says what failed, where, and what to do next.
      - A missed run (laptop off overnight or over a weekend) catches up by itself.
      - CI on every pull request: lint, tests and a model build against dev. CD: a merge to `main` deploys to prod.

      **Constraints:** the free tier caps concurrent tasks and compute, so the schedule and parallelism must respect that.
      Part of the pipeline runs on-prem and part in the cloud, and orchestration has to cover both.

      **Definition of Done**
      - All sub-tasks done; the orchestration and infrastructure-as-code ADRs are accepted
      - Five consecutive scheduled runs succeeded with no manual steps (run history linked)
      - dev and prod are reproducible from the repository; dev has been torn down and recreated from code once
      - The runbook covers rerun, backfill, catch-up and alert response
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "Daily schedule and on-demand trigger for the end-to-end pipeline, with task dependencies"
      - "Transient failures retried with backoff; re-running a step creates no duplicates"
      - "Missed runs caught up automatically, in order"
      - "Alerts on failure, freshness breach and error-level DQ failures reach the channel agreed with Kevin O'Hara"
      - "CI runs on every PR (lint, unit tests, model build and tests against dev) and is required by branch protection"
      - "A merge to main deploys to prod without manual steps; deployments are versioned"
      - "Environment objects are created from code in the repository, not by hand"
      - "Runbook in the repository"
    depends_on: [P1.S4]
    tasks:
      - id: P1.S5.T1
        type: Task
        summary: "Orchestrate the end-to-end pipeline on a schedule"
        estimate_hours: 6
        due_day: 15
        priority: Highest
        components: [Orchestration]
        labels: [orchestration, adr, level-3]
        description: |
          Choose where orchestration lives (on-prem, cloud or split) given your connectivity ADR and the free-tier limits,
          record the choice in an ADR, and wire the full flow with dependencies. Run history must be queryable; P1-D1
          reads it.
        acceptance_criteria:
          - "ADR (orchestration) accepted"
          - "Daily schedule and manual trigger in place"
          - "Dependencies enforced: silver doesn't run on a failed extract"
          - "Run and step history (start, end, status, rows, retries) persisted to a table"
          - *git
        depends_on: [P1.S3.T9, P1.S4.T3]
      - id: P1.S5.T2
        type: Task
        summary: "Retries and catch-up"
        estimate_hours: 3
        due_day: 15
        priority: High
        components: [Orchestration]
        labels: [reliability, orchestration, level-3]
        description: |
          Make failures boring. Transient errors retry with backoff; permanent ones fail fast. If the machine was off for two
          days, the next run processes both days, in order. Re-running a step for a window must give the same result; the
          simplest way is for each step to replace its window rather than add to it. Project 6 comes back to this properly.
        acceptance_criteria:
          - "Retry policy per step type documented"
          - "Killing a run midway and re-running it produces no duplicates or gaps (tested)"
          - "Two missed days caught up automatically and in order (tested with simulator batches)"
          - *git
        depends_on: [P1.S5.T1]
      - id: P1.S5.T3
        type: Task
        summary: "Alerting for failures, freshness and data quality"
        estimate_hours: 3
        due_day: 16
        priority: High
        components: [Orchestration]
        labels: [alerting, observability, level-2]
        description: |
          Kevin O'Hara is on call for infrastructure. Ask him how IT wants to be alerted, and how it doesn't: nobody wants
          forty e-mails for one root cause. Every alert must be actionable.

          **Where to start:** Ask Kevin O'Hara which channel he wants. Then make one pipeline step fail on purpose and get that one alert through
          before adding the others.
        acceptance_criteria:
          - "Alerts fire on pipeline failure, freshness-SLA breach and error-level DQ failures"
          - "Each alert names the run, step, table, error and the runbook section to follow"
          - "Repeated alerts for the same root cause are suppressed"
          - "A test alert received in the channel agreed with Kevin"
          - *git
        depends_on: [P1.S5.T1]
      - id: P1.S5.T4
        type: Task
        summary: "CI on pull requests"
        estimate_hours: 5
        due_day: 16
        priority: Highest
        components: [CI/CD]
        labels: [ci, git, level-2]
        description: |
          Every PR is checked automatically before it can merge: the same lint as pre-commit, unit tests, and a build and
          test of changed models against dev with a small dataset. CI runs often, so keep CI minutes and platform compute small.

          **Where to start:** The project brief's *CI on every pull request* is the spec. Start with one GitHub Actions job that runs your
          pre-commit hooks, get it green, then add tests and the model build.
        acceptance_criteria:
          - "CI runs on every PR (GitHub Actions or equivalent)"
          - "Lint (ruff, sqlfluff, gitleaks, commit messages), unit tests and model build and tests must pass before merge"
          - "CI status check required by branch protection on main"
          - "Typical CI duration and platform compute per run documented"
          - *git
        depends_on: [P1.S1.T5, P1.S3.T8]
      - id: P1.S5.T5
        type: Task
        summary: "Continuous deployment to prod"
        estimate_hours: 3
        due_day: 17
        priority: High
        components: [CI/CD]
        labels: [cd, release, level-2]
        description: |
          Prod changes only through a merge to `main`. Deploy automatically (or with one documented approval step), make
          the deployed version visible, and know how to roll back.

          **Where to start:** Add a second GitHub Actions workflow that runs on a push to `main`, using a prod-scoped secret. Deploy one model
          first. The project brief's *Environments and infrastructure* has the rule it enforces.
        acceptance_criteria:
          - "A merge to main deploys to prod with no manual steps, or one documented approval"
          - "The deployed version is visible in prod (for example a version table or tag)"
          - "Rollback procedure documented and tried once in dev"
          - *git
        depends_on: [P1.S5.T4]
      - id: P1.S5.T6
        type: Bug
        reporter: kevin.ohara
        summary: "Incident: weekend catch-up run duplicated Saturday's inventory ledger"
        estimate_hours: 3
        due_day: 17
        priority: Highest
        components: [Orchestration, Ingestion]
        labels: [incident, idempotency, level-3]
        description: |
          **Reported by Kevin O'Hara (IT Infrastructure), Monday 07:40:**
          > "The data box was powered off from Friday night to Monday for the building power work. When it came back the
          > pipeline caught up, but Saturday's `inventory_txn` count in silver is about double what the WMS shows for
          > Saturday. Marcus says nobody posted extra transactions. Can you look before Ops sees it?"

          Treat this as a production incident: contain, find the root cause, fix, prevent it coming back. If your pipeline
          doesn't have this defect, prove it by replaying the scenario and showing the counts match.
        acceptance_criteria:
          - "Root cause identified with evidence, or the scenario replayed showing no duplication"
          - "Prod counts reconcile with the WMS for the affected days"
          - "A regression test reproduces the weekend-off scenario"
          - "Short blameless postmortem (timeline, impact, root cause, actions) in docs/postmortems/"
          - &fix "Fix merged via PR from a fix/DATA-<n>-… branch with a regression test; Conventional Commits carry the key; CI green"
        depends_on: [P1.S5.T2]
      - id: P1.S5.T7
        type: Task
        summary: "Write the runbook"
        estimate_hours: 2
        due_day: 18
        priority: Medium
        components: [Documentation, Orchestration]
        labels: [runbook, docs, level-2]
        description: |
          Write the runbook IT would use at 3 a.m. without you: how to check health, rerun a step, backfill a window,
          rotate a secret, respond to each alert, and what normal looks like.

          **Where to start:** Copy your alert list in as headings, one section per alert. Then do each procedure once as you write it. Kevin O'Hara
          is the reader; ask him what he'd want at 3 a.m.
        acceptance_criteria:
          - "Runbook has a section per alert type"
          - "Rerun, backfill, catch-up and secret-rotation procedures each tested once"
          - "Linked from the README and from alert messages"
          - *docs
        depends_on: [P1.S5.T3, P1.S5.T5]
      - id: P1.S5.T8
        type: Task
        summary: "Infrastructure as code for the platform"
        estimate_hours: 4
        due_day: 18
        priority: High
        components: [Platform, CI/CD]
        labels: [iac, adr, level-3]
        description: |
          dev and prod must be reproducible from the repository. You kept a list in P1.S2.T2 of what you made by hand; put it in
          code. Pick an infrastructure-as-code approach that fits your platform and the free tier, and record why in an ADR.
          Options include Terraform providers, Databricks Asset Bundles and SQL migration tools, or something else you can
          justify. Recreate dev from scratch once to prove it.

          If you're on the Snowflake trial, this is what makes day 31 a non-event.
        acceptance_criteria:
          - "ADR (infrastructure as code) accepted"
          - "Schemas or catalogs, compute, service identity and grants defined in code"
          - "dev torn down and recreated from code with no manual steps; time recorded"
          - "You can tell how you'd notice someone changing prod by hand (drift check documented)"
          - *git
        depends_on: [P1.S2.T2, P1.S5.T5]

  # ---------------------------------------------------------------- S6
  - id: P1.S6
    summary: "Data Platform Health dashboard"
    type: Story
    reporter: sam.okafor
    priority: High
    story_points: 8
    sprint: 2
    due_day: 20
    components: [Dashboards]
    labels: [dashboard, observability, finops, level-3]
    attachments: [wireframes/P1-D1.svg]
    description: |
      > "Every morning I want to open one page and know whether yesterday's data can be trusted, before Luis or Rebecca
      > asks me." (Sam)

      That page is **P1-D1 Data Platform Health**. The spec is in the dashboard catalog and the wireframe is attached.

      **Audience:** IT (Sam, Kevin O'Hara, Mei Tanaka) and you. Not business users.

      **It must answer**
      - Is every source fresh? What's late, by how much, and since when?
      - Did last night's runs succeed? How long did they take, and is that trending up?
      - Are volumes normal for this day of the week, or did something drop or spike?
      - What did data quality catch, how bad is it, and is it getting worse?
      - How well do client keys line up across WMS, AX and Salesforce?
      - What are we spending, or how much of the free quota are we using?

      **Non-negotiables:** under 3 seconds per view; the Harborline brand kit (`brand/`: logo, IT department accent,
      dashboard background, theme or palette for your tool); data freshness shown in the footer.

      **Readout:** 5 minutes with Sam at the end of the sprint: what's healthy, what isn't, and one thing you'd fix next.

      **Definition of Done**
      - All sub-tasks done; dashboard published in prod with access restricted as specified
      - KPI definitions in the repository match what's on screen
      - Release **v0.1.0** tagged on `main`; CHANGELOG lists everything Project 1 delivered
      - Readout recorded; Sam's feedback captured as tickets
      - Each sub-task merged through its own PR (branch `feat/DATA-<n>-…`, Conventional Commits with the key, self-review, CI green)
    acceptance_criteria:
      - "KPI definitions for freshness, run success, duration, volume vs expected, DQ pass rate, quarantine volume, client key match rate and cost or quota match the P1-D1 spec and are documented"
      - "Filters for environment, source system, table, date range and DQ severity work together"
      - "Refreshes after every pipeline run and is never more than 60 minutes behind the latest run"
      - "Access limited to IT (sam.okafor, kevin.ohara, mei.tanaka) and you; no consumer PII anywhere, including DQ sample keys"
      - "Every view renders in under 3 seconds on the free-tier warehouse (measured cold and warm)"
      - "Harborline brand kit applied: logo lockup, IT accent, dashboard background, data-viz palette, number formats"
      - "5-minute readout delivered to Sam Okafor and recorded"
      - "Iris Novak's UAT sign-off recorded for P1-D1 before the readout"
    depends_on: [P1.S5]
    tasks:
      - id: P1.S6.T1
        type: Task
        summary: "Pipeline run telemetry model"
        estimate_hours: 4
        due_day: 18
        priority: High
        components: [Modeling]
        labels: [observability, gold, level-2]
        description: |
          Turn the run history from P1.S5 into something a dashboard can read: runs, steps, durations, rows in and out,
          retries and failures, by environment.

          **Where to start:** The run and step history table from P1.S5.T1. Write one query that shows last night's run, then shape the gold tables
          around what P1-D1 needs from it.
        acceptance_criteria:
          - "Gold tables for runs and steps with status, timings, rows and retry counts"
          - "Duration trend per step available (p50 and p95)"
          - "Checked against the orchestrator's own run history for one week"
          - *git
        depends_on: [P1.S5.T1]
      - id: P1.S6.T2
        type: Task
        summary: "Freshness, volume and change metrics per table"
        estimate_hours: 3
        due_day: 18
        priority: High
        components: [Modeling]
        labels: [observability, freshness, level-3]
        description: |
          For each source table: how old is the newest data, how does today's volume compare with a normal day like it,
          and how many inserts, updates and deletes did you capture? Normal has to account for weekly seasonality (Sundays
          are quiet and B2B barely ships at weekends) and for peak season.
        acceptance_criteria:
          - "Freshness per table vs its SLA, in minutes"
          - "Volume vs expected, with a documented baseline method that respects day of week"
          - "Inserts, updates and deletes captured per table per run"
          - *git
        depends_on: [P1.S5.T1]
      - id: P1.S6.T3
        type: Task
        summary: "Cost and quota usage"
        estimate_hours: 3
        due_day: 19
        priority: Medium
        components: [Modeling, Platform]
        labels: [finops, level-2]
        description: |
          Sam wants to see spend, or free-quota consumption, next to the work that caused it. Use what your platform
          exposes (system or usage tables, account usage, query history). If the free tier hides billing data, choose a
          defensible proxy and label it clearly on the dashboard.

          **Where to start:** Your platform's system or usage tables (`system.billing` on Databricks, `ACCOUNT_USAGE` on Snowflake, where your tier
          exposes them), and the baseline day you recorded in P1.S2.T5.
        acceptance_criteria:
          - "Daily usage by environment, and by pipeline step where attributable"
          - "Month-to-date usage vs budget or quota, with a projection"
          - "Proxy method, if any, documented and labelled on screen"
          - *git
        depends_on: [P1.S2.T5, P1.S5.T1]
      - id: P1.S6.T4
        type: Task
        summary: "Build P1-D1 Data Platform Health and lock down access"
        estimate_hours: 6
        due_day: 19
        priority: High
        components: [Dashboards]
        labels: [dashboard, brand, access, performance, level-3]
        description: |
          Build the dashboard to the P1-D1 spec and wireframe, using the Harborline brand kit. Picture Sam reading it in
          30 seconds at 7 a.m.: the top row alone should tell him whether anything is wrong. Then restrict it to IT and prove
          the performance target holds.
        acceptance_criteria:
          - "Every KPI and visual in the P1-D1 spec present"
          - "Brand kit applied: logo lockup, IT accent, background template, palette, number formats"
          - "Footer shows data freshness and dashboard version"
          - "Every view under 3 seconds; cold and warm load times recorded per view"
          - "Access restricted per the spec and tested with a non-IT identity, or the free-tier limitation documented"
          - *git
        depends_on: [P1.S6.T1, P1.S6.T2, P1.S6.T3, P1.S4.T6]
      - id: P1.S6.T5
        type: Task
        summary: "UAT sign-off from Iris Novak for P1-D1"
        estimate_hours: 4
        due_day: 20
        priority: Highest
        reporter: iris.novak
        components: [Dashboards, Data Quality]
        labels: [uat, sign-off, reconciliation, level-2]
        description: |
          Nothing goes to Sam Okafor until Iris Novak (Business Performance Manager) has signed it off. She ties
          your numbers back to the source systems herself, checks every KPI against your metric catalog and the
          dashboard spec, and writes up numbered findings with a verdict.

          For each dashboard: stop the stream, refresh, download the source extract from the Control Center, and put
          a submission in `uat/<dashboard id>/round-1/` as the team page describes (Dashboard sign-off). Attach the
          package zip, the zipped submission and the extract to a chat with Iris (or ask her in your coding agent).
          Fix or answer every finding, and resubmit as round 2, 3 and so on until she signs off. Blockers and Majors
          must be fixed before the readout; Minors can become tickets if she agrees.

          First time only: save Iris's prompt from the team page (Dashboard sign-off) and download one source extract,
          so the steps are familiar before the deadline.

          **Where to start:** The team page's *Dashboard sign-off* section has every step, in order. If you haven't met Iris Novak yet, do that first
          (Getting Started → *Your AI chat team*).
        acceptance_criteria:
          - "A submission for each dashboard: every page as PNG, CSV exports of the headline visuals and the end tables behind them, data-as-of and sim clock, a copy of the metric catalog, bridge.csv and the matching source extract"
          - "Iris's review report committed under uat/ for every round"
          - "No open Blocker or Major findings; agreed Minors ticketed"
          - "Verdict Signed off (or Signed off with conditions) for P1-D1"
        depends_on: [P1.S6.T4]
      - id: P1.S6.T6
        type: Task
        summary: "Readout to Sam and release v0.1.0"
        estimate_hours: 2
        due_day: 20
        priority: High
        components: [Documentation]
        labels: [readout, release, level-2]
        description: |
          Walk Sam through P1-D1 in five minutes: what's healthy, what isn't, and one thing you'd fix next. Record it; it's
          your portfolio demo too. Then tag the release and close the epic.

          **Where to start:** Write three lines first: what's healthy, what isn't, what you'd fix next. Then open P1-D1 and talk Sam through it.
          The project brief's *Releases, CHANGELOG and ADRs* has the tag commands.
        acceptance_criteria:
          - "Readout delivered and recording (or script plus screenshots) linked here"
          - "Sam's questions and feedback captured as new tickets"
          - "v0.1.0 tagged on main; CHANGELOG lists every ticket key in the release"
          - "Retro notes (keep / change / try) committed"
        depends_on: [P1.S6.T5]
