cold_chain:
  COOLER:  { min_c: 2.0,   max_c: 8.0,   excursion_minutes: 30 }
  FREEZER: { min_c: -25.0, max_c: -18.0, excursion_minutes: 30 }
  AMBIENT: { min_c: 10.0,  max_c: 32.0,  excursion_minutes: 240 }
  humidity_max_pct: 70
  hold_review_days: [1, 5]            # Quality reviews held lots within this many days
  release_share: 0.7                  # share of held lots released; the rest destroyed

# Probe calibration programme: telemetry.sensor.calibration_due moves on after each visit.
sensor_calibration:
  first_due_days: [20, 360]           # a probe's first due date, in days from when it enters the sensor list
  interval_days: 365                  # the next due date, in days from the visit
  early_days: [0, 21]                 # most visits: this many days before the due date
  late_share: 0.35                    # share of visits that slip past the due date
  late_days: [3, 120]                 # how many days those slip, which leaves about 5% of probes overdue at any time

labor:
  picks_per_hour: { B2C: 95, B2B: 140 }   # lines per hour for an average picker
  hourly_wage_usd: { US: 19.5, CA: 21.0, MX: 6.5 }

calendars:
  holiday_countries: { us01: US, ca01: CA, mx01: MX }
  peak_season: { start: "11-15", end: "12-24", cyber_week_boost: 1.6 }
  weekday_shape_b2c: [1.18, 1.08, 1.02, 0.98, 0.95, 0.72, 0.80]   # Mon..Sun
  weekday_shape_b2b: [1.10, 1.08, 1.06, 1.04, 1.00, 0.12, 0.05]

data_quality:
  default_rate_denominator: 10000      # 1 bad record in N per category
  categories:
    - orphan_fk
    - duplicate_row
    - null_required
    - negative_qty
    - shipped_gt_ordered
    - sentinel_date
    - future_date
    - invalid_currency
    - unit_mixup
    - key_whitespace_case
    - mojibake
    - malformed_edi
    - sensor_spike
    - sensor_stuck
    - late_arriving
    - schema_drift
    - header_line_mismatch
    - duplicate_account
    - dst_duplicate

