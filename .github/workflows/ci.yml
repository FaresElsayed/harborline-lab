name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator:
    runs-on: ubuntu-latest
    env:
      HL_TEST_PG_PORT: 55434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A password just for this run
        run: echo "HL_TEST_PG_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      # Not a service container: those can't take the settings logical replication needs.
      - name: Start a throwaway Postgres
        run: |
          docker run -d --name hl-test-pg -e POSTGRES_PASSWORD=$HL_TEST_PG_PASSWORD -p $HL_TEST_PG_PORT:5432 \
            postgres:17 -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
          until docker exec hl-test-pg pg_isready -U postgres; do sleep 2; done
      - name: Install
        working-directory: simulator
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: simulator
        run: python -m pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No key in the repository, ever
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --no-git

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build

  setup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: The setup file survives a checkout and parses on PowerShell 5.1
        shell: powershell
        run: |
          "PowerShell $($PSVersionTable.PSVersion)"
          $bytes = [IO.File]::ReadAllBytes('SETUP-WINDOWS.cmd')
          $text = [IO.File]::ReadAllText('SETUP-WINDOWS.cmd')
          if (($text -replace "`r`n", '') -match "`n") { throw 'SETUP-WINDOWS.cmd lost its CRLF line endings' }
          if ($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1) { throw 'SETUP-WINDOWS.cmd is not ASCII' }
          $null = [ScriptBlock]::Create($text)
      - name: A click can't pause the setup window
        shell: powershell
        run: |
          $text = [IO.File]::ReadAllText('SETUP-WINDOWS.cmd')
          $guard = [regex]::Match($text, "(?s)\`$Script:ClickGuard = @'\r?\n(.*?)\r?\n'@").Groups[1].Value
          if (-not $guard) { throw 'Could not find the click guard' }
          $probe = @"
          $guard
          function Read-Mode { [uint32]`$m = 0; `$h = [HarborlineLab.ConsoleMode]::GetStdHandle(-10); [void][HarborlineLab.ConsoleMode]::GetConsoleMode(`$h, [ref]`$m); `$m }
          Set-ClickSelects `$true; `$on = Read-Mode
          Set-ClickSelects `$false; `$off = Read-Mode
          "on=`$on off=`$off" | Set-Content -LiteralPath "$env:RUNNER_TEMP\click.txt"
          "@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($probe))
          # A new console of its own, like the window a person double-clicks open.
          Start-Process powershell.exe -Wait -WindowStyle Hidden -ArgumentList @('-NoProfile', '-EncodedCommand', $encoded)
          $result = Get-Content -LiteralPath "$env:RUNNER_TEMP\click.txt" -Raw
          "Console modes: $result"
          if ($result -notmatch 'on=(\d+) off=(\d+)') { throw "No result: $result" }
          if (-not ([int]$Matches[1] -band 0x40)) { throw 'Clicks should select while setup waits for an answer' }
          if ([int]$Matches[2] -band 0x40) { throw 'A click can still pause the window' }
      - name: Keys, the update download and the fresh window work on PowerShell 5.1 and a real cmd.exe
        shell: powershell
        run: |
          $text = [IO.File]::ReadAllText('SETUP-WINDOWS.cmd')
          function Get-Part([string]$From, [string]$To) {
            $a = $text.IndexOf($From)
            $b = $text.IndexOf($To, $a)
            if ($a -lt 0 -or $b -lt 0) { throw "Could not find $From" }
            $text.Substring($a, $b - $a)
          }
          . ([ScriptBlock]::Create((Get-Part 'function New-Key' 'function Get-BackupValue')))
          . ([ScriptBlock]::Create((Get-Part 'function Get-ErrorText' 'function Clear-UpdateFolder')))
          $one = New-Key
          if ($one -notmatch '^[0-9a-f]{48}$') { throw 'A key has the wrong shape' }
          if ($one -eq (New-Key)) { throw 'Two keys came out the same' }
          $Script:SystemProxy = $null
          $version = Invoke-UpdateFetch "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/setup/VERSION"
          if ("$version".Trim() -notmatch '^[0-9.]+$') { throw "Read '$version' for the version" }
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $failed = $false
          try { Invoke-UpdateFetch 'https://10.255.255.1/' '' 3 } catch { $failed = $true }
          if (-not $failed -or $clock.Elapsed.TotalSeconds -gt 8) { throw "The time limit did not hold: $($clock.Elapsed.TotalSeconds) s" }
          # A folder name that needs the quoting to be right.
          $dir = Join-Path $env:RUNNER_TEMP 'with space & (brackets)'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir 'SETUP-WINDOWS.cmd'
          [IO.File]::WriteAllText($file, "@echo off`r`n> `"%~dp0marker.txt`" echo %HL_SETUP_UPDATED%`r`n")
          $child = (Get-Part 'function Start-SetupInNewWindow' 'function Stop-IfOlderThanInstalled') + "`nfunction Write-Log { }`nfunction Get-ErrorText { }`nStart-SetupInNewWindow '$($file -replace "'", "''")' '2026.11.10'"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($child))
          $p = Start-Process powershell.exe -Wait -PassThru -WindowStyle Hidden -ArgumentList @('-NoProfile', '-EncodedCommand', $encoded)
          if ($p.ExitCode -ne 75) { throw "The old window left with $($p.ExitCode), not 75" }
          $marker = Join-Path $dir 'marker.txt'
          for ($i = 0; $i -lt 30 -and -not (Test-Path -LiteralPath $marker); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path -LiteralPath $marker)) { throw 'The new window never ran the file' }
          $got = (Get-Content -LiteralPath $marker -Raw).Trim()
          "Marker in the new window: $got"
          if ($got -ne '2026.11.10') { throw "The new window got '$got'" }
