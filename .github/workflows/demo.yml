# The no-install browser demo: web/ built with the mock API, plus the handbook and brand kit it links to.
# Needs Settings > Pages > Source: GitHub Actions.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'brand/**'
      - 'handbook/**'
      - 'config/**'
      - 'START_HERE.html'
      - 'setup/harborline-chat.zip'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:demo -- --base=/${{ github.event.repository.name }}/
        working-directory: web
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
          # brand/themes/*/.streamlit is linked from the handbook's brand page.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
