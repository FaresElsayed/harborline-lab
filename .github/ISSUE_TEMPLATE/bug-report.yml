name: Something's wrong in the lab
description: A bug in the Control Center, the tracker, the data or a colleague's answers.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please don't reveal the hidden business problems here. Say that something looks wrong without saying what's planted where.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can someone see it?
      placeholder: "Open /control/runs, press Generate batch..."
  - type: input
    id: version
    attributes:
      label: Version
      description: The contents of setup/VERSION.
