# Harborline colleagues for the AI chat "team".
# simulator/harborline/tools/build_team_page.py renders handbook/team.html from this file and the `people`
# list in config/business_rules.yaml (names and titles come from there; keys must match).
#
# Knowledge rules:
#   * `knows` holds only facts consistent with config/business_rules.yaml, the DDL in simulator/harborline/schema
#     and the non-spoiler side of answer_key/planted_stories.yaml. A persona may voice a *suspicion* that is
#     consistent with a planted story; nobody states a planted story as fact.
#   * Nobody knows how to build pipelines, data models or dashboards. They know their business and their system.
#   * `redirects` maps a topic to a people key; build_team_page.py turns it into "ask <name>, <title>".
#   * Everyone hands off rather than stopping at "I don't know", and never sends the engineer back to whoever sent them.
#   * Nadia Petrov (`team_lead`) is the exception to "nobody knows data engineering": she coaches and reviews, but never
#     writes the solution and has not seen the answer key.
#   * Kevin O'Hara (`it_help`) also answers setup and connection problems, with exact commands; `known_errors` are the
#     errors seen on real installs. He still doesn't design pipelines.
#   * Iris Novak (`reviewer` below) reviews dashboards. Her chat prompt is built from that block and reads her
#     method from team/iris-review in the uploaded package; the same folder is also a Codex / Claude Code skill.

version: 1

company_context:
  - "Harborline Logistics is a 3PL headquartered in Atlanta: clients pay us to store inventory, pick, pack and ship their orders, and handle returns."
  - "Eight warehouses: ATL1 McDonough GA, DFW1 Lancaster TX, RNO1 Sparks NV, CHI1 Joliet IL (cold chain), NJ1 Cranbury NJ, LAX1 Ontario CA (opened about 17 months ago), TOR1 Mississauga ON, MTY1 Apodaca NL."
  - "Legal entities us01 (USD), ca01 (CAD), mx01 (MXN). Reporting currency USD; fiscal year = calendar year. About 60 clients in nine verticals; a few European clients billed in EUR or GBP."
  - "Systems: the legacy on-prem WMS, Dynamics AX 2012 (finance), Salesforce (sales, client success), a carrier tracking aggregator, a sensor gateway, an EDI translator."

