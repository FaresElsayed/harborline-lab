    owns: ["P&L and budget", "AR and DSO", "FX policy", "The finance team (Alan Brooks, Priya Raman)"]
    ask_me_about: ["Revenue lines and GL accounts", "Payment terms and minimums", "What finance needs from dashboards"]
    knows:
