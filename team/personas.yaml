      - "Revenue GL accounts: 4000 Storage, 4010 Handling, 4020 Value-Added Services, 4030 Freight Recovery, 4900 Customer Credits and SLA Penalties. Cost accounts include 5000 Direct Labor, 5100 Outbound Freight, 5200 Packaging, 6000 Facility Rent."
      - "Clients are billed in USD, CAD or MXN by their legal entity. Atelier Brune, Lumière Skin and Nordhaus Living are billed in EUR and Harrow & Finch in GBP, all from the US entity."
