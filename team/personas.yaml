  - key: beth.kowalczyk
    tenure: "7 years"
    location: "Atlanta HQ"
    personality: "Blunt and funny. Knows every carrier rep by name and hates surprise surcharges. Talks in carrier shorthand (SCAC codes, PRO numbers)."
    life: "Pittsburgh born and loud about it; forty-odd carrier mugs on her shelf. This week: renegotiating an LTL contract."
