<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Do and don't: dual axis"><title>Do and don't: dual axis</title><rect width="880" height="300" fill="#F3F5F7"/><rect x="11.5" y="0.5" width="410" height="299" rx="8" fill="#FFFFFF" stroke="#D2DAE2"/><path d="M17 21 l9 9 M26 21 l-9 9" fill="none" stroke="#C22826" stroke-width="2.2" stroke-linecap="round"/><text x="34.0" y="31.0" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2338" text-anchor="start">Don't · two scales on one chart</text><text x="16.0" y="286.0" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#4F6175" text-anchor="start">Two y-axes invite false correlations; the crossing point means nothing.</text><line x1="56" x2="376" y1="60.0" y2="60.0" stroke="#E3E8ED"/><line x1="56" x2="376" y1="102.5" y2="102.5" stroke="#E3E8ED"/><line x1="56" x2="376" y1="145.0" y2="145.0" stroke="#E3E8ED"/><line x1="56" x2="376" y1="187.5" y2="187.5" stroke="#E3E8ED"/><line x1="56" x2="376" y1="230.0" y2="230.0" stroke="#E3E8ED"/><path d="M64.0 230.0v-116.0q0 -3 3 -3h18.0q3 0 3 3v116.0z" fill="#2973D0"/><path d="M104.0 230.0v-112.1q0 -3 3 -3h18.0q3 0 3 3v112.1z" fill="#2973D0"/><path d="M144.0 230.0v-124.5q0 -3 3 -3h18.0q3 0 3 3v124.5z" fill="#2973D0"/><path d="M184.0 230.0v-128.4q0 -3 3 -3h18.0q3 0 3 3v128.4z" fill="#2973D0"/><path d="M224.0 230.0v-119.9q0 -3 3 -3h18.0q3 0 3 3v119.9z" fill="#2973D0"/><path d="M264.0 230.0v-136.9q0 -3 3 -3h18.0q3 0 3 3v136.9z" fill="#2973D0"/><path d="M304.0 230.0v-144.8q0 -3 3 -3h18.0q3 0 3 3v144.8z" fill="#2973D0"/><path d="M344.0 230.0v-153.9q0 -3 3 -3h18.0q3 0 3 3v153.9z" fill="#2973D0"/><polyline points="76.0,85.5 116.0,79.1 156.0,119.5 196.0,142.9 236.0,104.6 276.0,157.7 316.0,170.5 356.0,185.4" fill="none" stroke="#F2672D" stroke-width="2"/><text x="50.0" y="64.0" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#4F6175" text-anchor="end">260k</text><text x="50.0" y="230.0" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#4F6175" text-anchor="end">0</text><text x="382.0" y="64.0" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#4F6175" text-anchor="start">98%</text><text x="382.0" y="230.0" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="400" fill="#4F6175" text-anchor="start">90%</text><text x="56.0" y="50.0" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#0F2338" text-anchor="start">Orders (k) and OTIF %</text><rect x="457.5" y="0.5" width="410" height="299" rx="8" fill="#FFFFFF" stroke="#D2DAE2"/><path d="M462 28 l4 4 l8 -9" fill="none" stroke="#1A763F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="480.0" y="31.0" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F2338" text-anchor="start">Do · one measure per chart</text><text x="462.0" y="286.0" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#4F6175" text-anchor="start">Same x-axis, two small charts: each scale is honest.</text><text x="498.0" y="54.0" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#0F2338" text-anchor="start">Orders, thousands</text><line x1="498" x2="828" y1="128" y2="128" stroke="#AEB9C4"/><path d="M506.0 128.0v-43.2q0 -3 3 -3h18.0q3 0 3 3v43.2z" fill="#2973D0"/><path d="M547.0 128.0v-41.7q0 -3 3 -3h18.0q3 0 3 3v41.7z" fill="#2973D0"/><path d="M588.0 128.0v-46.5q0 -3 3 -3h18.0q3 0 3 3v46.5z" fill="#2973D0"/><path d="M629.0 128.0v-48.0q0 -3 3 -3h18.0q3 0 3 3v48.0z" fill="#2973D0"/><path d="M670.0 128.0v-44.7q0 -3 3 -3h18.0q3 0 3 3v44.7z" fill="#2973D0"/><path d="M711.0 12