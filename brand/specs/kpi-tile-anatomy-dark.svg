<svg xmlns="http://www.w3.org/2000/svg" width="980" height="300" viewBox="0 0 980 300" role="img" aria-label="KPI tile anatomy"><title>KPI tile anatomy</title><rect width="980" height="300" fill="#08131F"/><rect x="40.5" y="48.5" width="383" height="191" rx="16" fill="#0F1E2E" stroke="#26394E" stroke-width="2"/><rect x="64" y="72" width="336" height="144" fill="none" stroke="#FF8A4C" stroke-dasharray="4 4" stroke-opacity="0.6"/><text x="64" y="94" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="500" fill="#9BAEC1" text-anchor="start">Dock-to-stock, median</text><text x="64" y="152" font-family="'Archivo Narrow', 'Arial Narrow', 'Segoe UI', sans-serif" font-size="56" font-weight="600" fill="#E6EDF3" text-anchor="start">18.4 h</text><rect x="64" y="168" width="136" height="32" rx="16" fill="#12321F"/><path transform="translate(82 184)" d="M0 -6 v12 M-5 1 l5 5 l5 -5" fill="none" stroke="#5BCC80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="96" y="189" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#5BCC80" text-anchor="start">2.1 h faster</text><text x="210" y="189" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#9BAEC1" text-anchor="start">vs prior 4 wk</text><polyline points="288,127.7 302,135.8 316,131.4 330,147.1 344,149.7 358,158.5 372,154.1 386,163.5" fill="none" stroke="#3983E1" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="386" cy="163.5" r="6" fill="#3983E1" stroke="#0F1E2E" stroke-width="3"/><circle cx="52" cy="82" r="10" fill="#FF8A4C"/><text x="52" y="86" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1A0E06" text-anchor="middle">1</text><circle cx="52" cy="150" r="10" fill="#FF8A4C"/><text x="52" y="154" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1A0E06" text-anchor="middle">2</text><circle cx="52" cy="210" r="10" fill="#FF8A4C"/><text x="52" y="214" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1A0E06" text-anchor="middle">3</text><circle cx="432" cy="144" r="10" fill="#FF8A4C"/><text x="432" y="148" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1A0E06" text-anchor="middle">4</text><circle cx="432" cy="234" r="10" fill="#FF8A4C"/><text x="432" y="238" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1A0E06" text-anchor="middle">5</text><circle cx="486" cy="56" r="10" fill="#FF8A4C"/><text x="486" y="60" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1A0E06" text-anchor="middle">1</text><text x="506" y="60" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">Label</text><text x="506" y="78" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9BAEC1" text-anchor="start">Hanken Grotesk 500, 9 pt (12 px), muted ink. Sentence case, names the period.</text><circle cx="486" cy="102" r="10" fill="#FF8A4C"/><text x="486" y="106" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1A0E06" text-anchor="middle">2</text><text x="506" y="106" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">Value</text><text x="506" y="124" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9BAEC1" text-anchor="start">Archivo Narrow 600, 21 pt (28 px), ink. Short units: 1.28M, 96.4%, 18.4 h.</text><circle cx="486" cy="148" r="10" fill="#FF8A4C"/><text x="486" y="152" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1A0E06" text-anchor="middle">3</text><text x="506" y="152" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">Comparison</text><text x="506" y="170" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9BAEC1" text-anchor="start">8 pt (11 px). Arrow = direction, colour = good/bad, words say both.</text><circle cx="486" cy="194" r="10" fill="#FF8A4C"/><text x="486" y="198" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1A0E06" text-anchor="middle">4</text><text x="506" y="198" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">Sparkline</text><text x="506" y="216" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9BAEC1" text-anchor="start">Optional. 2 px line in series slot 1, last point dotted, 64 × 24.</text><circle cx="486" cy="240" r="10" fill="#FF8A4C"/><text x="486" y="244" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#1A0E06" text-anchor="middle">5</text><text x="506" y="244" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">Container</text><text x="506" y="262" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9BAEC1" text-anchor="start">192 × 96, surface fill, 1 px border, radius 8, padding 12.</text><text x="40" y="280" font-family="'Hanken Grotesk', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" fill="#9BAEC1" text-anchor="start">Drawn at 2× · Power BI sizes in pt (1 pt = 1.33 px on the 1280 × 720 canvas)</text></svg>
