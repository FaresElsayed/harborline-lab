[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harborline-lab"
version = "1.0.0"
description = "Harborline Logistics source-system simulator (WMS, AX 2012, Salesforce, carrier, IoT, EDI, files)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2,<4",
  "numpy>=2.1,<3",
  "pandas>=3.0,<4",
  "pyarrow>=18",
  "openpyxl>=3.1",
  "xlsxwriter>=3.2",
  "faker>=30",
  "pyyaml>=6",
  "pydantic>=2.9",
  "holidays>=0.60",
  "httpx>=0.27",
  "tzdata>=2024.2",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-timeout>=2.3", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["harborline", "harborline.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.sql", "*.yaml", "*.yml", "*.json", "*.csv", "*.txt", "*.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
markers = ["slow: long-running build tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
